<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vetrate">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Calcolo Vetrate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: strumento tecnico. Barra superiore compatta, contenuto su carta millimetrata, navigazione fissa in basso; schede a una colonna su telefono */
:root{
  --bg:#eef1f4; --grid:#e3e8ed; --surface:#ffffff; --surface-2:#f5f7f9; --ink:#0f1720; --muted:#5b6976;
  --line:#d6dde4; --line-2:#b8c3ce; --accent:#0b7a8f; --accent-ink:#ffffff; --accent-soft:#e0f0f3;
  --hi:#d9530b; --sel:var(--hi); --glass:#cfe6ec; --glass-2:#a8d2db; --bar:#0f1720; --bar-ink:#dfe7ee; --bar-muted:#7f8d99;
  --warn:#b25b00; --bad:#c0362c; --ok:#2b7a3d;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px; --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1015; --grid:#111920; --surface:#111a21; --surface-2:#16212a; --ink:#e2e9ef; --muted:#8b9aa7;
  --line:#22303b; --line-2:#344552; --accent:#3cc3d8; --accent-ink:#04232a; --accent-soft:#0f2e36;
  --hi:#ff8a3d; --glass:#173f48; --glass-2:#215661; --bar:#070b0f; --bar-ink:#dfe7ee; --bar-muted:#6f7e8a;
  --warn:#f0a54a; --bad:#ff8a80; --ok:#7fcf8a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1015; --grid:#111920; --surface:#111a21; --surface-2:#16212a; --ink:#e2e9ef; --muted:#8b9aa7;
  --line:#22303b; --line-2:#344552; --accent:#3cc3d8; --accent-ink:#04232a; --accent-soft:#0f2e36;
  --hi:#ff8a3d; --glass:#173f48; --glass-2:#215661; --bar:#070b0f; --bar-ink:#dfe7ee; --bar-muted:#6f7e8a;
  --warn:#f0a54a; --bad:#ff8a80; --ok:#7fcf8a; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:.9375rem;line-height:1.45;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto}

/* barra superiore */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border:1px solid var(--line);border-top:0;
  border-radius:0 0 var(--r) var(--r);padding:12px 14px;margin-bottom:4px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .titles{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.crumb{font:500 .66rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font:700 1.45rem/1.05 var(--f-display);letter-spacing:.005em;margin:0;overflow-wrap:anywhere}
.sub{color:var(--muted);font:400 .76rem var(--f-mono);overflow-wrap:anywhere}
.logo{flex:none;width:38px;height:38px;border-radius:var(--r);background:var(--bar);display:grid;place-items:center}
.back{flex:none;width:38px;height:38px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.back svg{width:18px;height:18px}
.hbtn{flex:none;width:38px;height:38px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.hbtn svg{width:20px;height:20px}
.hbtn:hover,.back:hover{border-color:var(--ink)}

/* navigazione in basso */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bar);border-top:1px solid var(--line-2);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bnav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.bnav button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:var(--r);
  color:var(--bar-muted);font:500 .64rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;position:relative}
.bnav svg{width:22px;height:22px}
.bnav button[aria-selected="true"]{color:var(--bar-ink)}
.bnav button[aria-selected="true"]::before{content:"";position:absolute;top:-7px;left:25%;right:25%;height:2px;background:var(--accent)}
.bnav button:focus-visible{outline:2px solid var(--accent)}

main{padding-top:14px;display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:14px}
@media (min-width:860px){.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
h2{font:600 1.15rem/1.2 var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
h3{font:600 .68rem var(--f-mono);margin:4px 0 0;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);display:flex;align-items:center;gap:8px}
h3::after{content:"";flex:1;height:1px;background:var(--line)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}
.sec h2{font-size:1rem;text-transform:uppercase;letter-spacing:.08em}
.sec .note{font-size:.78rem}

/* campi */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px 12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
label.f,.lrow label{font:500 .66rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:20px}
label.f .hint{font:400 .74rem var(--f-body);letter-spacing:0;text-transform:none;opacity:.9}
.f.wide{grid-column:1/-1}
label.chk{display:flex;gap:8px;align-items:center;font-size:.88rem}
label.chk input{width:auto}
input,select,textarea{font:500 .95rem var(--f-body);color:var(--ink);background:var(--surface-2);border:1px solid var(--line-2);border-radius:4px;padding:9px 10px;width:100%;min-width:0;min-height:40px}
input.num,textarea.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
input[readonly]{background:transparent;border-style:dashed;color:var(--muted)}
input.name{font:600 1.08rem var(--f-display);background:transparent;border-color:transparent;padding:4px 6px;min-height:0}
input.name:hover{border-color:var(--line-2)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.unit{position:relative}
.unit input{padding-right:40px}
.unit span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:500 .68rem var(--f-mono);color:var(--muted);pointer-events:none;text-transform:none;letter-spacing:0}

/* pulsanti */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:500 .78rem var(--f-mono);border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);padding:7px 11px;border-radius:4px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.btn{font:600 .82rem var(--f-body);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:4px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line-2))}
.btn.sm{padding:5px 9px;font-size:.76rem}
.btn[data-armed]{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}

/* letture numeriche */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{padding:10px 12px;background:var(--surface-2);border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.stat b{display:block;font:600 1.35rem var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font:500 .62rem var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.1em}

/* tabelle */
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font:500 .62rem var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.1em;background:var(--surface-2)}
td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
.l{text-align:left}
td.t{font-family:var(--f-body)}
tr.grp td{background:var(--accent-soft);font:600 .7rem var(--f-mono);color:var(--accent);text-align:left;text-transform:uppercase;letter-spacing:.1em}
tfoot td{font-weight:600}

.pill{display:inline-flex;align-items:center;gap:5px;font:500 .7rem var(--f-mono);padding:3px 8px;border-radius:3px;border:1px solid currentColor;letter-spacing:.02em}
.pill.mob{color:var(--accent)} .pill.fix{color:var(--muted)} .pill.w{color:var(--warn)} .pill.b{color:var(--bad)}
.msg{font-size:.82rem;padding:7px 10px;border-radius:4px;border-left:3px solid var(--warn);background:var(--surface-2)}
.msg.bad{border-color:var(--bad)} .msg.ok{border-color:var(--ok)}
.note{font-size:.84rem;color:var(--muted);margin:0;max-width:68ch}
.banner{font-size:.84rem;padding:10px 12px;border-radius:4px;border:1px dashed var(--hi);background:color-mix(in srgb,var(--hi) 7%,transparent)}

/* struttura */
.lato{padding:0;gap:0;overflow:hidden}
.lato-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.lato-head .tag{font:700 .9rem var(--f-mono);color:var(--surface);background:var(--ink);border-radius:4px;width:30px;height:30px;display:grid;place-items:center}
.lato-head input.name{flex:1;min-width:140px}
.lato-body{padding:14px 12px;display:flex;flex-direction:column;gap:14px}
.vani{display:flex;flex-direction:column;gap:12px}
.vano{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.vano-head{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 8px;border-bottom:1px solid var(--line)}
.vano-head input.name{flex:1;min-width:120px;font-size:1rem}
.vano-main{display:grid;grid-template-columns:1fr;gap:12px;padding:12px}
@media (min-width:640px){.vano-main{grid-template-columns:200px minmax(0,1fr)}}
.thumb{background:var(--surface-2);border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;padding:8px;min-height:120px}
.thumb svg{width:100%;height:auto;max-height:190px;display:block}
.vres{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font:500 .8rem var(--f-mono);padding:8px 12px;border-top:1px solid var(--line);background:var(--surface-2)}
.vres b{font-weight:600}
.vano details{padding:0 12px 12px}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.vano details summary{font:500 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--accent);padding-top:10px}
.vano details summary::before{content:"+ "}
.vano details[open] summary::before{content:"− "}
.vano details[open] summary{margin-bottom:8px}

/* disegni */
.draw{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:8px;overflow-x:auto}
.draw svg{display:block;width:100%;height:auto}
.plan svg{max-height:380px}
.plan [data-lato]{cursor:pointer}
.kv{display:grid;grid-template-columns:1fr auto;gap:0;font-size:.86rem;margin:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kv dt,.kv dd{padding:7px 10px;border-bottom:1px solid var(--line);margin:0}
.kv dt{color:var(--muted)} .kv dd{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;font-weight:500}
.kv dt:nth-last-child(2),.kv dd:last-child{border-bottom:0}

/* elenco cantieri */
.clist{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.ccard{text-align:left;cursor:pointer;font:inherit;color:inherit;padding:0;gap:0;overflow:hidden}
.ccard:hover{border-color:var(--ink)}
.ccard .cthumb{background:var(--surface-2);border-bottom:1px solid var(--line);height:130px;display:grid;place-items:center;padding:10px}
.ccard .cthumb svg{width:100%;height:100%}
.ccard .cbody{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.ccard .pill{align-self:flex-start}
.ccard .meta{display:grid;grid-template-columns:repeat(4,auto);justify-content:start;gap:4px 14px;font:400 .7rem var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ccard .meta b{display:block;font:600 .95rem var(--f-mono);color:var(--ink);letter-spacing:0}

.vtab td input{padding:6px 8px;font-size:.86rem;min-height:34px}
.vtab td{padding:4px 6px}
.vtab td:first-child input{min-width:150px}
.vtab td input.num{width:84px}

/* sistemi */
[data-s] details>summary{display:flex;flex-direction:column;gap:2px}
.sis-t{font:600 1.1rem var(--f-display);color:var(--ink)}
[data-s] details>summary .note{font:400 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
.sis-body{display:flex;flex-direction:column;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}

.sync{font:500 .64rem var(--f-mono);color:var(--muted);display:inline-flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.08em}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--ok)} .sync.w::before{background:var(--warn)} .sync.b::before{background:var(--bad)}
.hb{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--surface);color:var(--muted);font:700 .7rem/1 var(--f-mono);
  display:inline-grid;place-items:center;cursor:pointer;padding:0;letter-spacing:0;text-transform:none}
.hb:hover,.hb[aria-expanded="true"]{border-color:var(--hi);color:var(--hi)}
.hb[aria-expanded="true"]{background:color-mix(in srgb,var(--hi) 10%,var(--surface))}
.lrow .hb{width:18px;height:18px;font-size:.62rem}
.help{font:400 .84rem/1.55 var(--f-body);letter-spacing:0;text-transform:none;color:var(--ink);background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:4px;padding:10px 12px;max-width:72ch}
.help b{font-weight:600}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px 10px;flex-wrap:wrap}
.card-h h2{flex:1 1 150px;min-width:0}
.card-h-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.h3row{display:flex;align-items:center;gap:8px;margin-top:4px}
.h3row h3{flex:1;margin:0}
.vano>.help{margin:10px 12px 0}
.lato-head .hb{margin-left:2px}
.sub-card{padding:12px;gap:8px}
.gap-top{margin-top:10px}
.remind{border-color:var(--hi)}
.remind h2{color:var(--hi)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setl{font-size:.9rem;font-weight:500}
.tip-top{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.tip-top .f{flex:1;min-width:200px}
.tip-top .btn{min-height:40px}
.tip-new{border:1px dashed var(--line-2);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.tip-body{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.tip-pre{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.prova-res{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
.prova-tab{display:flex;flex-direction:column;gap:8px;min-width:0}
@media (min-width:640px){.prova-res{grid-template-columns:200px minmax(0,1fr)}}
.ver{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font:500 .7rem var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:4px 0 8px}
.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:21;display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:8px 8px 8px 14px;font:500 .8rem var(--f-mono);box-shadow:0 6px 20px rgba(0,0,0,.18);white-space:nowrap}
.htabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin-top:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:4px}
.htabs button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 10px;border-radius:4px;font:600 .9rem var(--f-body);color:var(--muted)}
.htabs button svg{width:18px;height:18px}
.htabs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.htabs button:focus-visible{outline:2px solid var(--accent)}
.xbtn{flex:none;width:32px;height:32px;border-radius:4px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);font:600 .95rem/1 var(--f-body);display:grid;place-items:center;cursor:pointer;padding:0}
.xbtn:hover{border-color:var(--ink);color:var(--ink)}
.pill.ok{color:var(--ok)}
.plist{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.pcard{text-align:left;cursor:pointer;font:inherit;color:inherit;gap:8px}
.pcard:hover{border-color:var(--ink)}
.pcard .pill{align-self:flex-start}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pc-top h2{min-width:0;overflow-wrap:anywhere}
.pc-tot{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px solid var(--line);padding-top:8px}
.pc-tot span{font:500 .62rem var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.pc-tot b{font:600 1.2rem var(--f-mono);font-variant-numeric:tabular-nums}
.pvtab input{width:110px;min-height:34px;padding:6px 8px;text-align:right}
.pvtab td:last-child{font-weight:600}
.kv.tot dt:nth-last-child(2),.kv.tot dd:last-child{background:var(--surface-2);font-weight:700;color:var(--ink)}
.kv.tot dd:last-child{font-size:1.15rem}
details.regole{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}

<script>
(function(){
const $=id=>document.getElementById(id);
const num=v=>{if(v==null)return NaN;const s=String(v).trim().replace(/\s/g,'').replace(',','.');return s===''?NaN:parseFloat(s)};
const fmt=(n,d=0)=>isFinite(n)?n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d}):'–';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const letter=i=>String.fromCharCode(65+(i%26));
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- testi delle spiegazioni (pulsanti «!») ---------- */
const HELP={
 nuovo:'Scegli il lavoro: Vetrate e scorrevoli, Finestre e zanzariere o entrambi. Si apre la sezione giusta e puoi sempre usare anche l\'altra. Nei vani scegli i profili creati nella sezione Profili. Con Importa cantiere apri un file ricevuto da un collega: i suoi profili che non hai vengono aggiunti ai tuoi.',
 lato:'Un lato è una parete della veranda, ad esempio il fronte o un fianco, e contiene uno o più vani. I vani vanno inseriti da sinistra a destra guardando il lato dall\'esterno. Le frecce cambiano l\'ordine dei lati, che è anche l\'ordine con cui vengono disegnati in pianta.',
 angolo:'Angolo tra questo lato e il successivo, misurato all\'interno della veranda: 90° per un angolo retto, 135° per un angolo smussato. Serve solo per disegnare la pianta e non cambia le misure dei vetri. Se non lo conosci, usa lo strumento Angolo tra due lati.',
 pil:'Spessore di pilastri, montanti o muretti che separano un vano dall\'altro sullo stesso lato. Si aggiunge alla lunghezza del lato e compare nel prospetto. Non cambia le misure dei vetri.',
 vano:'Per ogni vano l\'app calcola subito numero di vetri, misure di taglio, m² e peso, secondo il profilo scelto. Il disegno mostra il vano visto dall\'esterno, con i vetri numerati, le quote in arancione e, per le vetrate apribili, la freccia del verso di apertura. Apri Misure dei vetri per la tabella completa e gli eventuali avvisi.',
 vL:'Larghezza del vano finito, da muro a muro o da pilastro a pilastro. Misurala in alto, al centro e in basso e usa la più piccola.',
 vHd:'Altezze ai due lati del vano, guardando dall\'esterno. Se sono diverse il vano è in pendenza e ogni vetro avrà due altezze. Lascia vuota l\'altezza destra se è uguale alla sinistra.',
 vq:'Quante vetrate identiche a questa ci sono. Moltiplica vetri, m² e pesi nei totali e nella distinta.',
 vt:'Il profilo di questo vano, scelto tra quelli della sezione Profili. Le deduzioni si modificano in Profili: il cantiere conserva i valori con cui l\'hai calcolato e ti avvisa se nel frattempo il profilo è cambiato.',
 vn:'Con Automatico l\'app usa il numero minimo di vetri che rispetta larghezza e peso massimi del profilo. Puoi scegliere un numero preciso: se supera i limiti compare un avviso.',
 vg:'Il vetro serve per calcolare il peso e, nel preventivo, il prezzo. L\'elenco dei vetri si gestisce in Profili › Vetri.',
 pianta:'Vista dall\'alto della veranda. I lati sono disegnati in sequenza con gli angoli inseriti in Struttura; la linea tratteggiata è la parete di appoggio. Le tacche indicano dove finisce un vano e inizia il successivo. Tocca un lato per vederne il prospetto.',
 prospetto:'Il lato visto dall\'esterno, con i vani, i vetri numerati e le misure. Nei profili ad ante sovrapposte le ante hanno due tonalità alternate; le frecce arancioni indicano il verso di apertura. Tutti i lati mostra lo sviluppo completo della veranda, un lato dopo l\'altro.',
 totali:'Vani, vetri, m² e peso di tutto il cantiere. Distinta PDF crea il documento per il vetraio, con i disegni di ogni lato e le misure di ogni vetro: si apre il menu Condividi per mandarlo, salvarlo in File o stamparlo. Copia distinta copia lo stesso contenuto come testo. Prezzi e costi stanno nel preventivo.',
 ordine:'Pezzi, superfici e pesi raggruppati per tipo di vetro: è il riassunto da usare per l\'ordine al vetraio.',
 distinta:'Tutti i vetri del cantiere, lato per lato, con le misure di taglio. Nei vani in pendenza l\'altezza è indicata come sinistra / destra.',
 datiCantiere:'Con Veranda addossata a una parete la pianta viene chiusa da una linea tratteggiata tra l\'ultimo e il primo lato. Esporta cantiere crea un file da mandare a un collega, che lo apre con Importa cantiere nella schermata iniziale.',
 calcolo:'<b>Come si calcola un vetro</b><br>1. Luce = larghezza vano − 2 × gioco di posa − deduzione telaio in larghezza.<br>2. Ante sovrapposte: anta = (luce + sormonti) ÷ numero di ante. Vetri affiancati: modulo = (luce − spazi tra vetri) ÷ numero di vetri.<br>3. Larghezza vetro = anta o modulo − deduzione vetro in larghezza.<br>4. Altezza vetro = altezza vano − 2 × gioco di posa − deduzione telaio in altezza − deduzione vetro in altezza.',
 schema:'Ante sovrapposte: le ante scorrono su binari diversi e da chiuse si sovrappongono (si usa il sormonto). Vetri affiancati: i vetri stanno uno accanto all\'altro, separati da una fuga, una guarnizione o un montante (impacchettabili, a libro, fisse).',
 mobili:'Indica se i vetri si aprono. Serve per le etichette Anta mobile o Fisso nella distinta e nei disegni.',
 prova:'Inserisci le misure di un vano di cui conosci già i vetri, per esempio un lavoro fatto con lo stesso sistema: se i risultati coincidono, il profilo è tarato bene. La prova non modifica il profilo né i cantieri.',
 fattur:'Regole per calcolare i m² dei vetri da mettere in preventivo: superficie minima per lastra, arrotondamento dei lati e maggiorazione per sfrido. Non cambiano le misure di taglio dei vetri.',
 vetri:'Elenco dei vetri che puoi scegliere nei vani. Scrivendo lo spessore il peso viene stimato a 2,5 kg/m² per mm; puoi correggerlo a mano, per esempio per i vetrocamera. I prezzi si inseriscono nella sezione Preventivi.',
 inclinato:'Per i vani sotto una falda: con la base e le due altezze ricavi il lato superiore inclinato, la pendenza e le due diagonali, utili per controllare il vano o tagliare i profili. Puoi partire dalle misure di un vano del cantiere.',
 triangolo:'Teorema di Pitagora: inserisci due lati qualsiasi di un triangolo rettangolo e ottieni il terzo. Se li inserisci tutti e tre, vedi di quanto la diagonale misurata si discosta da quella teorica.',
 squadra:'Misura le due diagonali del vano da angolo ad angolo. Se sono uguali il vano è in squadra: fino a 2 mm di differenza è considerato in squadra, fino a 5 mm leggermente fuori squadra.',
 angoloLati:'Per trovare l\'angolo reale tra due lati della veranda: dall\'angolo segna un punto su ciascun lato (per esempio a 1000 mm) e misura la distanza tra i due punti. L\'app calcola l\'angolo con il teorema del coseno: inseriscilo in Struttura come angolo interno.',
 aspetto:'Automatico segue l\'impostazione chiaro o scuro dell\'iPad. Testo grande ingrandisce tutta l\'app, comodo in cantiere. Puoi nascondere i pulsanti «!» quando non ti servono più: le spiegazioni restano disponibili riattivandoli da qui.',
 arrot:'Come vengono arrotondate le misure di taglio dei vetri. Al mm per difetto è la scelta più prudente per l\'ordine: il vetro non risulta mai più grande del calcolo. Superfici e pesi vengono calcolati sulle misure arrotondate.',
 intest:'Ditta, indirizzo, contatto e partita IVA compaiono in testa ai PDF (distinte, ordini e preventivi) e ai testi copiati. Le note per il vetraio vanno in fondo alla distinta vetri.',
 fatturPre:'Fatturazione con cui parte ogni nuovo cantiere. Non cambia i cantieri esistenti.',
 backup:'I dati sono salvati solo su questo dispositivo. Backup completo crea un file con tutti i cantieri, le impostazioni e i disegni dei profili: salvalo in File, su iCloud o mandalo via email. Ripristina backup sostituisce tutti i dati con quelli del file. Elimina tutti i dati cancella tutto da questo dispositivo.',
 prevLista:'Ogni cantiere ha un solo preventivo che comprende vetrate, finestre e zanzariere. Qui vedi stato e totale di ciascuno e le somme per stato. Il Listino prezzi contiene i prezzi di partenza: i preventivi li usano da soli per le voci nuove. I filtri mostrano solo bozze, inviati, accettati o rifiutati.',
 prevDati:'Cliente, numero e data compaiono in testa al preventivo. Lo stato serve a tenere traccia dei preventivi: bozza, inviato al cliente, accettato o rifiutato. PDF crea il preventivo da mandare al cliente. Prezzi dal listino aggiorna tutti i prezzi (vetri, finestre, zanzariere) con quelli del listino. Apri cantiere porta alle misure e ai disegni.',
 prevVetri:'Ogni tipo di vetro usato nelle vetrate compare con pezzi e m² da preventivare: inserisci il prezzo al m² e l\'importo si calcola da solo. I m² seguono le Regole di calcolo (superficie minima per lastra, arrotondamento dei lati, sfrido).',
 prevLav:'Voci da aggiungere ai vetri: posa, profili, trasporto, smaltimento e altro. Per ogni voce scrivi descrizione, quantità, unità di misura e prezzo unitario. Con i pulsanti Dal listino aggiungi una voce già pronta: la quantità viene proposta dal cantiere (m² di vetro, metri lineari dei lati o numero di vani) e puoi correggerla.',
 prevTot:'Lo sconto si applica all\'imponibile (vetri più lavorazioni), poi si aggiunge l\'IVA. Imposta l\'aliquota IVA giusta per il tipo di lavoro.',
 prevNote:'Le note per il cliente finiscono in fondo al preventivo: tempi, esclusioni, pagamento. Le note interne restano solo nell\'app. Preventivo PDF crea il documento da mandare al cliente, con spazio per la firma di accettazione; Copia testo copia la versione in testo.',
 listVetri:'Prezzo al m² di ogni vetro della sezione Profili. I preventivi lo usano per i vetri che non hanno ancora un prezzo; per aggiornare un preventivo esistente usa Prezzi dal listino.',
 listLav:'Lavorazioni che usi spesso, con unità di misura e prezzo: nei preventivi le aggiungi con un tocco.',
 listAltro:'IVA, validità, regole dei m² e note con cui parte ogni nuovo preventivo. Non cambiano i preventivi già esistenti.',
 voce:'Un vano dove va una finestra, una zanzariera o entrambe. Inserisci la misura del vano: la misura da ordinare si calcola con le regole del profilo scelto, che imposti nella sezione Profili. Il disegno mostra il vano visto dall\'interno, con il simbolo di apertura della finestra; la retinatura arancione indica la zanzariera.',
 fzVani:'Qui inserisci i vani di finestre e zanzariere del cliente. + Da un vano delle vetrate riusa un vano già misurato nella sezione Vetrate e scorrevoli: le misure restano collegate e si aggiornano in entrambe le sezioni finché non lo scolleghi.',

function totals(c){const t={vetri:0,mq:0,fmq:0,kg:0,cost:0,vani:0,warn:0};
  c.lati.forEach(l=>l.vani.forEach(v=>{t.vani++;const r=compute(v,c);if(!r.ok)return;
    t.vetri+=r.N*r.qta;t.mq+=r.mq;t.fmq+=r.fmq;t.kg+=r.kg;if(r.prezzo>0)t.cost+=r.fmq*r.prezzo;t.warn+=r.msgs.length}));return t}
function fzCalc(c,x){
  const L=num(x.L),H=num(x.H),q=Math.max(1,Math.round(num(x.qta))||1),r={ok:L>0&&H>0,L,H,q,msgs:[]};
  if(!r.ok)return r;
  if(x.fin&&x.fin.on){const t=c.tipFin.find(y=>y.id===x.fin.tipo)||c.tipFin[0];
    if(t){const oL=rv(L-(num(t.p.detL)||0)),oH=rv(H-(num(t.p.detH)||0));r.fin={t,oL,oH,mq:oL*oH/1e6};
      if(!(oL>0&&oH>0))r.msgs.push(['bad','Finestra: misura da ordinare nulla o negativa, controlla le deduzioni.'])}
    else r.msgs.push(['bad','Nessun profilo di finestra: aggiungine uno nella sezione Profili.'])}
  if(x.zan&&x.zan.on){const t=c.tipZan.find(y=>y.id===x.zan.tipo)||c.tipZan[0];
    if(t){const so=x.zan.mont==='sormonto',p=t.p,oL=rv(so?L+(num(p.sorL)||0):L-(num(p.detL)||0)),oH=rv(so?H+(num(p.sorH)||0):H-(num(p.detH)||0));
      r.zan={t,oL,oH,mq:oL*oH/1e6,mont:so?'a sormonto':'in luce'};
      if(!(oL>0&&oH>0))r.msgs.push(['bad','Zanzariera: misura da ordinare nulla o negativa, controlla le deduzioni.']);
      if(num(p.maxL)>0&&oL>num(p.maxL))r.msgs.push(['warn',`Zanzariera larga ${fmt(oL)} mm: oltre il massimo di ${fmt(num(p.maxL))} mm.`]);
      if(num(p.maxH)>0&&oH>num(p.maxH))r.msgs.push(['warn',`Zanzariera alta ${fmt(oH)} mm: oltre il massimo di ${fmt(num(p.maxH))} mm.`])}
    else r.msgs.push(['bad','Nessun profilo di zanzariera: aggiungine uno nella sezione Profili.'])}
  return r}
const fzCount=c=>(c.fz&&c.fz.voci||[]).reduce((a,x)=>{const q=Math.max(1,Math.round(num(x.qta))||1);if(x.fin&&x.fin.on)a.fin+=q;if(x.zan&&x.zan.on)a.zan+=q;return a},{fin:0,zan:0});

function vanoThumb(r){

    g+=`<text x="${q.gx+q.gw/2}" y="${Y(b+(q.hl+q.hr)/4)}" font-size="${fs*0.8}" text-anchor="middle" dominant-baseline="middle" fill="var(--ink)" font-family="IBM Plex Mono,monospace" font-weight="600">${q.i}</text>`});
  if(r.s.mobili&&r.verso){const ya=Y(Math.min(r.Hs,r.Hd)*0.2);versoSegs(r.verso).forEach(([a,b])=>{g+=frecciaSvg(a*L,b*L,ya,fs*0.55)})}
  const Q='stroke="var(--hi)" stroke-width="1" vector-effect="non-scaling-stroke"',T=`font-size="${fs*0.75}" text-anchor="middle" fill="var(--hi)" font-family="IBM Plex Mono,monospace"`;
  const yb=Hm+fs*0.9;
  g+=`<path d="M0 ${yb-fs*.3}V${yb+fs*.3}M${L} ${yb-fs*.3}V${yb+fs*.3}M0 ${yb}H${L}" ${Q}/><text x="${L/2}" y="${yb+fs*1.15}" ${T}>${fmt(L)}</text>`;
  const qv=(xd,h,tx)=>`<path d="M${xd-fs*.3} ${Y(0)}H${xd+fs*.3}M${xd-fs*.3} ${Y(h)}H${xd+fs*.3}M${xd} ${Y(0)}V${Y(h)}" ${Q}/><text x="${tx}" y="${Y(h/2)}" ${T} transform="rotate(-90 ${tx} ${Y(h/2)})">${fmt(h)}</text>`;

  return g+'</svg>';
}
function planSvg(c,sel,mini){
  let x=0,y=0,dx=0,dy=1;const segs=[];
  c.lati.forEach((l,li)=>{const len=latoLen(l)||1000;const s={l,li,x0:x,y0:y,dx,dy,len};x+=dx*len;y+=dy*len;s.x1=x;s.y1=y;segs.push(s);
    const t=(180-(num(l.angolo)||90))*Math.PI/180;[dx,dy]=[dx*Math.cos(t)+dy*Math.sin(t),-dx*Math.sin(t)+dy*Math.cos(t)]});
  if(!segs.length)return'<p class="note">Aggiungi almeno un lato.</p>';
  const xs=segs.flatMap(s=>[s.x0,s.x1]),ys=segs.flatMap(s=>[s.y0,s.y1]);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const ext=Math.max(maxX-minX,maxY-minY,1000),fs=ext/20,pad=mini?fs*1.2:fs*4.2;
  let g=`<svg viewBox="${minX-pad} ${minY-pad} ${maxX-minX+pad*2} ${maxY-minY+pad*2}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pianta della veranda">`;
  if(c.parete&&segs.length>1){const a=segs[0],b=segs[segs.length-1];
    g+=`<line x1="${b.x1}" y1="${b.y1}" x2="${a.x0}" y2="${a.y0}" stroke="var(--muted)" stroke-width="6" stroke-dasharray="10 8" vector-effect="non-scaling-stroke"/>`;
    if(!mini)g+=`<text x="${(a.x0+b.x1)/2}" y="${(a.y0+b.y1)/2-fs*0.7}" font-size="${fs*0.8}" text-anchor="middle" fill="var(--muted)" font-family="IBM Plex Mono,monospace">PARETE</text>`}
  segs.forEach(s=>{const on=s.l.id===sel,col=on?'var(--sel)':'var(--accent)';
    const nx=-s.dy,ny=s.dx; /* esterno = destra del percorso */
    g+=`<g data-lato="${s.l.id}"><line x1="${s.x0}" y1="${s.y0}" x2="${s.x1}" y2="${s.y1}" stroke="transparent" stroke-width="${fs*2.2}"/>
      <line x1="${s.x0}" y1="${s.y0}" x2="${s.x1}" y2="${s.y1}" stroke="${col}" stroke-width="${on?7:5}" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
    let acc=0;s.l.vani.forEach((v,i)=>{acc+=num(v.L)||0;if(i<s.l.vani.length-1){const px=s.x0+s.dx*acc,py=s.y0+s.dy*acc;
      g+=`<line x1="${px-nx*fs*.5}" y1="${py-ny*fs*.5}" x2="${px+nx*fs*.5}" y2="${py+ny*fs*.5}" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/>`;acc+=num(s.l.pil)||0}});
    if(mini){g+='</g>';return}
    const mx=(s.x0+s.x1)/2+nx*fs*1.9,my=(s.y0+s.y1)/2+ny*fs*1.9;
    g+=`<text x="${mx}" y="${my-fs*0.15}" font-size="${fs}" text-anchor="middle" fill="${on?'var(--sel)':'var(--ink)'}" font-family="IBM Plex Sans Condensed,sans-serif" font-weight="700">${letter(s.li)} · ${esc(s.l.nome)}</text>
      <text x="${mx}" y="${my+fs*0.95}" font-size="${fs*0.75}" text-anchor="middle" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${fmt(latoLen(s.l))} mm</text></g>`});
  return g+'</svg>';

function elevSvg(c,lati,multi){

  if(!Hm)return'<p class="note">Inserisci le misure dei vani per vedere il prospetto.</p>';

  /* quota verticale: linea in xd dalla base all'altezza h, testo all'esterno (dir −1 a sinistra, +1 a destra), si legge dal basso */

  let x=0,body='';

    /* altezza destra: solo se il vano è inclinato e il vano accanto non riparte dalla stessa altezza */

      x+=DW;if(!i)xa=x;
      body+=`<polygon points="${x},${Y(0)} ${x+L},${Y(0)} ${x+L},${Y(Hd)} ${x},${Y(Hs)}" fill="none" stroke="var(--ink)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`;
      if(r.ok){const sc=r.s.schema==='scorrevole';r.panes.forEach((q,k)=>{const fill=sc&&k%2?'var(--glass-2)':'var(--glass)',X=x+q.gx,b=q.by;

        body+=`<text x="${X+q.gw/2}" y="${Y(b+(q.hl+q.hr)/4)}" font-size="${fs*0.9}" text-anchor="middle" dominant-baseline="middle" fill="var(--ink)" font-family="IBM Plex Sans Condensed,sans-serif" font-weight="700">${q.i}</text>`});
        if(r.s.mobili&&r.verso){const ya=Y(Math.min(Hs,Hd)*0.2);versoSegs(r.verso).forEach(([a,b])=>{body+=frecciaSvg(x+a*L,x+b*L,ya,fs*0.5)})}}
      body+=`<text x="${x+L/2}" y="${Y(Math.max(Hs,Hd))-fs*0.55}" font-size="${fs*0.78}" text-anchor="middle" fill="var(--ink)" font-family="IBM Plex Sans,sans-serif" font-weight="600">${esc(v.nome)}</text>`;
      const yb=Hm+fs*0.6;
      body+=`<path d="M${x} ${yb-fs*.22}V${yb+fs*.22}M${x+L} ${yb-fs*.22}V${yb+fs*.22}M${x} ${yb}H${x+L}" ${Q}/><text x="${x+L/2}" y="${yb+fs*1.0}" ${TQ}>${fmt(L)}</text>`;

      <text x="${(xa+xb)/2}" y="${Hm+fs*3.6}" font-size="${fs}" text-anchor="middle" fill="var(--accent)" font-family="IBM Plex Sans Condensed,sans-serif" font-weight="700">${letter(c.lati.indexOf(l))} · ${esc(l.nome)}</text>`;x+=gap}});
  if(multi)x-=gap;
  const W=Math.max(x,1),top=fs*2,bot=multi?fs*4.3:fs*2.1,side=fs*0.4,vbW=W+side*2,vbH=Hm+top+bot;

}

/* ---------- riepilogo ---------- */
function viewRiepilogo(c){

    l.vani.forEach(v=>{const r=compute(v,c);if(!r.ok){rows+=`<tr><td class="t l">${esc(v.nome)}</td><td class="t l" colspan="6">Misure incomplete</td></tr>`;return}
      const g=byG[r.gl.id]||(byG[r.gl.id]={nome:r.gl.nome,n:0,mq:0,kg:0});g.n+=r.N*r.qta;g.mq+=r.mq;g.kg+=r.kg;
      txt+=`${v.nome} – ${r.s.nome} – vano ${fmt(r.L)} × ${r.flat?fmt(r.Hs):fmt(r.Hs)+'/'+fmt(r.Hd)}${r.qta>1?' (× '+r.qta+')':''} – ${r.gl.nome}${versoTxt(r)?' – '+versoTxt(r):''}\n`;
      r.panes.forEach(q=>{rows+=`<tr><td class="t l">${esc(v.nome)}</td><td class="l">${q.i}</td><td>${fmtMm(q.gw)}</td><td>${r.flat?fmtMm(q.hl):fmtMm(q.hl)+' / '+fmtMm(q.hr)}</td><td>${r.qta}</td><td>${fmt(q.mq*r.qta,3)}</td><td>${fmt(q.kg*r.qta,1)}</td></tr>`;
        txt+=`  ${q.i}) ${fmtMm(q.gw)} × ${r.flat?fmtMm(q.hl):fmtMm(q.hl)+'/'+fmtMm(q.hr)} mm  ×${r.qta}  ${fmt(q.mq*r.qta,3)} m²\n`})})});
  txt+=`\nTOTALE: ${t.vetri} vetri · ${fmt(t.mq,2)} m² · ${fmt(t.kg,0)} kg`;
  const gl=Object.values(byG);
  txt+='\n\nORDINE VETRI:\n'+gl.map(g=>`${g.nome}: ${g.n} pz · ${fmt(g.mq,2)} m²`).join('\n');
  if(st.noteOrdine)txt+='\n\nNOTE: '+st.noteOrdine;
  setMain(),$('main').innerHTML=`
  <section class="card">${cardH('Totali cantiere','totali','hp_tot',`<button class="btn sm" id="toPrev" type="button">Preventivo</button><button class="btn sm" id="copyAll" type="button">Copia distinta</button><button class="btn primary sm" id="pdfDist" type="button">Distinta PDF</button>`)}
    <div class="stats"><div class="stat"><span>Vani</span><b>${t.vani}</b></div><div class="stat"><span>Vetri</span><b>${t.vetri}</b></div>
    <div class="stat"><span>m² di vetro</span><b>${fmt(t.mq,2)}</b></div><div class="stat"><span>Peso</span><b>${fmt(t.kg,0)} kg</b></div></div>
    ${t.warn?`<div class="msg">Ci sono ${t.warn} avvisi nei vani: controllali in Struttura.</div>`:''}
    <textarea id="distTa" rows="8" class="num" hidden></textarea></section>
  <section class="card">${cardH('Ordine per tipo di vetro','ordine','hp_ord')}
    <div class="tablebox"><table><thead><tr><th class="l">Vetro</th><th>Pezzi</th><th>m²</th><th>kg</th></tr></thead><tbody>
    ${gl.map(g=>`<tr><td class="t l">${esc(g.nome)}</td><td>${g.n}</td><td>${fmt(g.mq,2)}</td><td>${fmt(g.kg,0)}</td></tr>`).join('')}</tbody></table></div></section>
  <section class="card">${cardH('Distinta vetri per lato','distinta','hp_dis')}
    <div class="tablebox"><table><thead><tr><th class="l">Vano</th><th class="l">N°</th><th>Larghezza</th><th>Altezza</th><th>Pz</th><th>m²</th><th>kg</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
  $('copyAll').onclick=()=>copy(txt,$('distTa'));
  $('pdfDist').onclick=()=>sharePdf(pdfDistinta(c));
  $('toPrev').onclick=()=>goPrev(c.id);
}

/* ---------- editor dei profili di vetrata (sezione Profili) ---------- */
function tipSel(ctx){S.ui.tipSel=S.ui.tipSel||{};const l=ctx.filter?ctx.h.sistemi.filter(ctx.filter):ctx.h.sistemi;return l.find(s=>s.id===S.ui.tipSel[ctx.key])||l[0]}
const usoTxt=(u,cat)=>u==null?'':cat?(u?` · ${u} ${u===1?'cantiere':'cantieri'}`:''):` · ${u} ${u===1?'vano':'vani'}`;
function tipHTML(ctx,title,hk){
  const all=ctx.h.sistemi,list=ctx.filter?all.filter(ctx.filter):all,sel=tipSel(ctx);
  const opts=list.map(s=>`<option value="${s.id}" ${s===sel?'selected':''}>${esc(s.nome)}${usoTxt(ctx.usage?ctx.usage(s):null,ctx.catalogo)}</option>`).join('');
  const pre=PRESETS.filter(x=>!ctx.sec||sezOf(x)===ctx.sec);
  const base=(pre.length?`<optgroup label="Preimpostazioni">${pre.map(x=>`<option value="pre:${x.key}">${esc(x.nome)}</option>`).join('')}</optgroup>`:'')+
    (list.length?`<optgroup label="Copia di un profilo">${list.map(s=>`<option value="copy:${s.id}">${esc(s.nome)}</option>`).join('')}</optgroup>`:'')+
    `<optgroup label="Altro"><option value="vuota">Vuoto, da compilare</option></optgroup>`;
  return`<section class="card" id="tipCard">${cardH(title,hk,'hp_tip')}
   <div class="tip-top">${list.length?fld({id:'tipSel',label:'Profilo da modificare',ctrl:`<select id="tipSel">${opts}</select>`}):''}
     <button class="btn" id="tipNewBtn" type="button">+ Nuovo profilo</button></div>
   <div class="tip-new" id="tipNew" hidden>
     <div class="fields">${fld({id:'tipBase',label:'Parti da',ctrl:`<select id="tipBase">${base}</select>`})}${fld({id:'tipNome',label:'Nome',attrs:'placeholder="Facoltativo"'})}</div>
     <div class="row"><button class="btn primary" id="tipCreate" type="button">Crea profilo</button><button class="btn" id="tipAnn" type="button">Annulla</button></div>
   </div>
   ${sel?tipBody(ctx,sel):'<p class="note">Nessun profilo in questa sezione: creane uno con + Nuovo profilo.</p>'}
  </section>`}
function tipBody(ctx,s){
  const pr=PRESETS.find(x=>x.key===s.preset),P=S.ui.prova||(S.ui.prova={L:'3000',H:'2200',n:'auto'});
  return`<div class="tip-body" data-s="${s.id}">
   ${ctx.usage?usoNota(ctx.usage(s)):''}
   ${pr?'<p class="note">Valori preimpostati indicativi: verificali con la Prova rapida su un lavoro di cui conosci già le misure.</p>':''}
   <div class="fields">
     ${fld({id:'tsNome',label:'Nome',val:s.nome,wide:true})}
     ${fld({id:'tsForn',label:'Fornitore / serie',wide:true,val:s.forn||'',help:HELP.profForn,attrs:'placeholder="Facoltativo"'})}
     ${fld({id:'tsNote',label:'Note',wide:true,ctrl:`<textarea id="tsNote" rows="2">${esc(s.note||'')}</textarea>`})}
     ${fld({id:'tsSchema',label:'Come si dividono i vetri',wide:true,help:HELP.schema,ctrl:`<select id="tsSchema">${Object.entries(SCHEMI).map(([k,t])=>`<option value="${k}" ${s.schema===k?'selected':''}>${t}</option>`).join('')}</select>`})}
     ${fld({id:'tsMob',label:'Vetri',help:HELP.mobili,ctrl:`<select id="tsMob"><option value="1" ${s.mobili?'selected':''}>Mobili</option><option value="0" ${s.mobili?'':'selected'}>Fissi</option></select>`})}
   </div>
   ${h3H('Sezione del profilo','disegno','hp_dis')}${disBlockHTML(s.id)}
   ${SIS_FIELDS.map(gr=>{const fs=gr.f.filter(x=>!x[4]||x[4]===s.schema);return fs.length?`<h3>${gr.t}</h3><div class="fields">`+
     fs.map(([k,l,un,h])=>fld({id:'tp_'+k,label:l,unit:un,val:s.p[k]??'',help:h,attrs:`data-k="${k}"`})).join('')+'</div>':''}).join('')}
   ${h3H('Prova rapida','prova','hp_prova')}
   <div class="fields">${fld({id:'prL',label:'Larghezza vano',unit:'mm',val:P.L,attrs:'data-pv="L"'})}${fld({id:'prH',label:'Altezza vano',unit:'mm',val:P.H,attrs:'data-pv="H"'})}
     ${fld({id:'prN',label:s.mobili?'Ante':'Vetri',ctrl:`<select id="prN" data-pv="n">${nOpts(s.schema,P.n)}</select>`})}</div>
   <div class="prova-res" id="provaRes"></div>
   <div class="row"><button class="btn sm" id="tsDup" type="button">Duplica</button>${pr?'<button class="btn sm" id="tsReset" type="button">Ripristina valori preimpostati</button>':''}<button class="btn sm danger" id="tsDel" type="button">Elimina profilo</button></div>
  </div>`}
function provaUpdate(ctx){const box=$('provaRes');if(!box)return;const s=tipSel(ctx),P=S.ui.prova;
  const r=compute({L:P.L,Hs:P.H,Hd:'',qta:'1',sistema:s.id,n:P.n,vetro:ctx.vetri[0]?.id},{sistemi:ctx.h.sistemi,prev:{fatt:DEF_FATT},vetri:ctx.vetri});
  if(!r.ok){box.innerHTML='<p class="note">Inserisci larghezza e altezza del vano di prova.</p>';return}
  box.innerHTML=`<div class="thumb">${vanoThumb(r)}</div><div class="prova-tab">${r.msgs.map(([k,t])=>`<div class="msg ${k==='bad'?'bad':''}">${esc(t)}</div>`).join('')}${paneTable(r)}</div>`}
function bindTip(ctx){
  const rer=ctx.rerender,chg=()=>ctx.onChange&&ctx.onChange();S.ui.tipSel=S.ui.tipSel||{};
  if($('tipSel'))$('tipSel').onchange=e=>{S.ui.tipSel[ctx.key]=e.target.value;save();rer()};
  $('tipNewBtn').onclick=()=>{const n=$('tipNew');n.hidden=!n.hidden;if(!n.hidden)$('tipBase').focus()};
  $('tipAnn').onclick=()=>{$('tipNew').hidden=true};
  $('tipCreate').onclick=()=>{const b=$('tipBase').value,nome=$('tipNome').value.trim();let n;
    if(b.startsWith('pre:'))n=sisDaPreset(PRESETS.find(x=>x.key===b.slice(4)));
    else if(b.startsWith('copy:')){const o=ctx.h.sistemi.find(x=>x.id===b.slice(5));n={...clone(o),id:uid(),nome:o.nome+' (copia)'}}
    else{const sc=ctx.sec==='scorrevoli';n={id:uid(),nome:'Nuovo profilo',schema:sc?'scorrevole':'affiancati',mobili:ctx.sec!=='fisse',note:'',preset:'',p:{...DEF_SP,minN:sc?2:1}}}
    n.forn=n.forn||'';n.note=n.note||'';if(nome)n.nome=nome;ctx.h.sistemi.push(n);S.ui.tipSel['prof_'+sezOf(n)]=n.id;S.ui.tipSel[ctx.key]=n.id;if(ctx.sec)S.ui.profSec=sezOf(n);save();rer();chg();toast('Profilo creato: '+n.nome)};
  const s=tipSel(ctx);if(!s)return;
  bindDis(rer);
  document.querySelectorAll('.tip-body [data-k]').forEach(i=>i.addEventListener('input',e=>{const n=num(e.target.value);s.p[e.target.dataset.k]=isFinite(n)?n:0;save();provaUpdate(ctx);chg()}));
  const pg=()=>{if(ctx.catalogo)propaga('sistemi',s);save()};
  $('tsNome').addEventListener('input',e=>{s.nome=e.target.value||'Profilo';pg();const o=$('tipSel')&&$('tipSel').selectedOptions[0];if(o)o.textContent=s.nome+usoTxt(ctx.usage?ctx.usage(s):null,ctx.catalogo)});
  $('tsForn').addEventListener('input',e=>{s.forn=e.target.value;pg()});
  $('tsNote').addEventListener('input',e=>{s.note=e.target.value;pg()});
  const sposta=()=>{if(!ctx.sec)return;const ns=sezOf(s);if(ns===ctx.sec)return;S.ui.profSec=ns;S.ui.tipSel['prof_'+ns]=s.id;toast('Profilo spostato in «'+((SEZ_VET.find(x=>x[0]===ns)||[])[1]||'')+'»')};
  $('tsSchema').onchange=e=>{s.schema=e.target.value;sposta();save();rer();chg()};
  $('tsMob').onchange=e=>{s.mobili=e.target.value==='1';sposta();save();rer();chg()};
  document.querySelectorAll('.tip-body [data-pv]').forEach(i=>i.addEventListener(i.tagName==='SELECT'?'change':'input',e=>{S.ui.prova[e.target.dataset.pv]=e.target.value;save();provaUpdate(ctx)}));
  $('tsDup').onclick=()=>{const n={...clone(s),id:uid(),nome:s.nome+' (copia)'};ctx.h.sistemi.splice(ctx.h.sistemi.indexOf(s)+1,0,n);S.ui.tipSel[ctx.key]=n.id;save();rer();toast('Profilo duplicato')};
  if($('tsReset'))armDelete('#tsReset',()=>{const x=PRESETS.find(k=>k.key===s.preset);if(!x)return;s.p={...DEF_SP,...x.p};s.schema=x.schema;s.mobili=x.mobili;sposta();save();rer();chg();toast('Valori ripristinati')});
  armDelete('#tsDel',()=>{const u=ctx.usage?ctx.usage(s):0;
    if(ctx.h.sistemi.length<2){toast('Serve almeno un profilo di vetrata');return}
    ctx.h.sistemi=ctx.h.sistemi.filter(x=>x!==s);delete S.ui.tipSel[ctx.key];if(!u)disDel(s.id).catch(()=>{});save();rer();
    toast(u?`Profilo eliminato: ${u===1?'il cantiere che lo usa conserva':'i '+u+' cantieri che lo usano conservano'} i suoi valori`:'Profilo eliminato')});
  provaUpdate(ctx)}
/* ---------- elenco vetri (sezione Profili) ---------- */
function vetriHTML(list,key){return`<div data-gk="${key}"><div class="tablebox"><table class="vtab"><thead><tr><th class="l">Nome</th><th>Spessore mm</th><th>kg/m²</th><th></th></tr></thead><tbody>
  ${list.map(v=>`<tr data-g="${v.id}"><td><input id="${key}n_${v.id}" data-f="nome" value="${esc(v.nome)}" aria-label="Nome del vetro"></td>
    <td><input class="num" id="${key}s_${v.id}" data-f="sp" inputmode="decimal" value="${esc(v.sp)}" aria-label="Spessore"></td>
    <td><input class="num" id="${key}k_${v.id}" data-f="kg" inputmode="decimal" value="${esc(v.kg)}" aria-label="Peso al metro quadro"></td>
    <td><button class="btn danger sm" type="button" data-delg="${v.id}" aria-label="Elimina vetro">✕</button></td></tr>`).join('')}</tbody></table></div>
  <div class="row gap-top"><button class="btn" type="button" data-addg>+ Aggiungi vetro</button></div></div>`}
function bindVetri(holder,prop,key,rerender,onChange){const box=document.querySelector(`[data-gk="${key}"]`);if(!box)return;
  box.querySelectorAll('[data-g] input').forEach(i=>i.addEventListener('input',e=>{const v=holder[prop].find(x=>x.id===e.target.closest('tr').dataset.g),f=e.target.dataset.f;
    v[f]=f==='nome'?e.target.value:e.target.value.replace(',','.');
    if(f==='sp'){const sp=num(e.target.value);if(sp>0){v.kg=+(sp*2.5).toFixed(1);$(key+'k_'+v.id).value=v.kg}}save();onChange&&onChange(v,f)}));
  armDelete(`[data-gk="${key}"] [data-delg]`,b=>{if(holder[prop].length<2){toast('Serve almeno un vetro');return}holder[prop]=holder[prop].filter(v=>v.id!==b.dataset.delg);save();rerender();onChange&&onChange()});
  box.querySelector('[data-addg]').onclick=()=>{holder[prop].push({id:uid(),nome:'Nuovo vetro',sp:8,kg:20});save();rerender()}}

/* ---------- scheda Dati del cantiere e avvisi sui profili ---------- */
function viewDati(c){
  const grp=[['sistemi','Vetrate'],['vetri','Vetri'],['tipFin','Finestre'],['tipZan','Zanzariere']];
  let haDiff=false;
  const righe=grp.map(([k,t])=>{const l=c[k]||[];if(!l.length)return'';return`<h3>${t}</h3><div class="pu-list">${l.map(cp=>{const st=statoCopia(k,cp);
    const pill=st.st==='ok'?'<span class="pill ok">Uguale al profilo</span>':st.st==='solo'?'<span class="pill fix">Solo in questo cantiere</span>':st.st==='ign'?'<span class="pill fix">Diverso · avviso nascosto</span>':'<span class="pill w">Diverso dal profilo</span>';
    const dif=st.st==='mod'||st.st==='ign'?diffCopia(k,cp,st.src):[];if(dif.length)haDiff=true;
    const sub=[k==='sistemi'?(SEZ_VET.find(x=>x[0]===sezOf(cp))||[])[1]:k==='vetri'?`${fmt(num(cp.kg),1)} kg/m²`:'',cp.forn].filter(Boolean).join(' · ');
    return`<div class="pu-row" data-pk="${k}" data-pid="${cp.id}"><div class="pu-d"><b>${esc(cp.nome)}</b>${sub?`<small>${esc(sub)}</small>`:''}</div>${pill}
      ${st.st==='mod'||st.st==='ign'||DIS.meta.has(cp.id)?`<div class="row pu-a">${disBtn(cp.id,'Sezione')}${st.st==='mod'||st.st==='ign'?`<button class="btn sm primary" type="button" data-puup>Aggiorna</button>${st.st==='mod'?'<button class="btn sm" type="button" data-puign>Ignora</button>':''}`:''}</div>`:''}
      ${dif.length?`<ul class="pu-diff">${dif.map(([n,x,y])=>`<li>${esc(n)}: <b>${esc(x)} → ${esc(y)}</b></li>`).join('')}</ul>`:''}</div>`}).join('')}</div>`}).join('');
  setMain(),$('main').innerHTML=`
  <section class="card">${cardH('Dati del cantiere','datiCantiere','hp_dc')}
    <div class="fields">${fld({id:'cn',label:'Nome',val:c.nome})}${fld({id:'ci',label:'Indirizzo',val:c.indirizzo})}</div>
    ${fld({id:'cno',label:'Note',ctrl:`<textarea id="cno" rows="2">${esc(c.note)}</textarea>`})}
    <label class="chk"><input type="checkbox" id="cpar" ${c.parete?'checked':''}> Veranda addossata a una parete</label>
    <div class="row"><button class="btn primary" id="expC" type="button">Esporta cantiere</button><button class="btn" id="dupC" type="button">Duplica cantiere</button><button class="btn danger" id="delC" type="button">Elimina cantiere</button></div></section>
  <section class="card">${cardH('Profili usati','profUsati','hp_pu')}
    ${righe||'<p class="note">Questo cantiere non usa ancora nessun profilo.</p>'}
    ${haDiff?'<p class="note">Le differenze sono indicate come valore del cantiere → valore nella sezione Profili.</p>':''}
    <div class="row"><button class="btn" id="toProf" type="button">Apri la sezione Profili</button></div></section>`;
  $('cn').oninput=e=>{c.nome=e.target.value||'Senza nome';save();document.querySelector('h1').textContent=c.nome};
  $('ci').oninput=e=>{c.indirizzo=e.target.value;save();updTot(c)};
  $('cno').oninput=e=>{c.note=e.target.value;save()};
  $('cpar').onchange=e=>{c.parete=e.target.checked;save()};
  $('expC').onclick=()=>{ensureRefs(c);shareFile('cantiere-'+fileName(c.nome)+'.json',{v:2,tipo:'cantiere',cantiere:c})};
  $('dupC').onclick=()=>{const n={...clone(c),id:uid(),nome:c.nome+' (copia)'};n.prev={...n.prev,stato:'bozza',numero:''};S.cantieri.unshift(n);go(n.id,'struttura');toast('Cantiere duplicato')};
  armDelete('#delC',()=>{S.cantieri=S.cantieri.filter(x=>x!==c);go(null);toast('Cantiere eliminato')});

    if(x>0&&y>0&&!(d>0))r=[['Diagonale',fmt(Math.hypot(x,y),1)+' mm'],['Angolo alla base',fmt(Math.atan2(y,x)*180/Math.PI,2)+'°']];
    else if(x>0&&d>0&&!(y>0))r=d>x?[['Altezza',fmt(Math.sqrt(d*d-x*x),1)+' mm']]:[['La diagonale deve superare la base','']];
    else if(y>0&&d>0&&!(x>0))r=d>y?[['Base',fmt(Math.sqrt(d*d-y*y),1)+' mm']]:[['La diagonale deve superare l\'altezza','']];
    else if(x>0&&y>0&&d>0)r=[['Diagonale teorica',fmt(Math.hypot(x,y),1)+' mm'],['Differenza con la tua',fmt(d-Math.hypot(x,y),1)+' mm']];

const STATI=[['bozza','Bozza'],['inviato','Inviato'],['accettato','Accettato'],['rifiutato','Rifiutato']];
const statoPill=s=>{const m={bozza:'fix',inviato:'mob',accettato:'ok',rifiutato:'b'};return`<span class="pill ${m[s]||'fix'}">${(STATI.find(x=>x[0]===s)||STATI[0])[1]}</span>`};
const fmtData=d=>{if(!d)return'';const[y,m,g]=String(d).split('-');return g?`${g}/${m}/${y}`:String(d)};
const fmtE=n=>(isFinite(n)?n:0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:'always'});
const eur=n=>'€ '+fmtE(n||0);
const fmtQ=n=>isFinite(n)?n.toLocaleString('it-IT',{maximumFractionDigits:2}):'–';
/* prezzo di una riga finestra/zanzariera: quello del preventivo, altrimenti quello del listino per il profilo */
function prezzoListino(kind,t){const L=S.listino[kind]||{};let d=t&&L[t.id];
  if(!d&&t){const pre=(S.prof[kind==='fin'?'tipFin':'tipZan']||[]).find(y=>y.nome===t.nome||(t.preset&&y.preset===t.preset));if(pre)d=L[pre.id]}
  return{modo:(d&&d.modo)||(kind==='fin'?'pz':'mq'),prezzo:(d&&d.prezzo)||'',min:(d&&d.min)||''}}
function lineaPrezzo(c,kind,x,t,mat){const pv=c.prev;pv.fz=pv.fz||{};const e=pv.fz[x.id]&&pv.fz[x.id][kind];if(e)return e;
  const r=prezzoListino(kind,t);if(mat){pv.fz[x.id]=pv.fz[x.id]||{};pv.fz[x.id][kind]=r}return r}
function prevCalc(c,mat){
  if(!c.prev)c.prev=newPrev(S.listino,c.vetri);
  const pv=c.prev,byG={};let mq=0,vani=0;
  c.lati.forEach(l=>l.vani.forEach(v=>{vani++;const r=compute(v,c);if(!r.ok)return;mq+=r.mq;
    const g=byG[r.gl.id]||(byG[r.gl.id]={id:r.gl.id,nome:r.gl.nome,n:0,mq:0,fmq:0});g.n+=r.N*r.qta;g.mq+=r.mq;g.fmq+=r.fmq}));
  const vetri=Object.values(byG).map(g=>{let pz=pv.prezzi[g.id];if(pz===undefined){const lp=S.listino.vetri[g.id];if(lp!=null&&lp!==''){pz=lp;if(mat)pv.prezzi[g.id]=lp}}const pr=num(pz);return{...g,pr,imp:pr>0?pr*g.fmq:0}});
  const fz={fin:[],zan:[]};
  (c.fz&&c.fz.voci||[]).forEach(x=>{vani++;const r=fzCalc(c,x);if(!r.ok)return;
    ['fin','zan'].forEach(kind=>{const o=r[kind];if(!o)return;mq+=o.mq*r.q;
      const e=lineaPrezzo(c,kind,x,o.t,mat),pr=num(e.prezzo),mn=num(e.min)||0,mqF=e.modo==='mq'?Math.max(mn,o.mq):o.mq;
      fz[kind].push({x,o,q:r.q,e,pr,mqF,imp:pr>0?(e.modo==='mq'?pr*mqF*r.q:pr*r.q):0})})});
  const lav=pv.lav.map(x=>({...x,imp:(num(x.qta)||0)*(num(x.prezzo)||0)}));
  const S_=a=>a.reduce((s,x)=>s+x.imp,0),totV=S_(vetri),totF=S_(fz.fin),totZ=S_(fz.zan),totL=S_(lav),imp=totV+totF+totZ+totL;
  const sc=imp*(num(pv.sconto)||0)/100,base=imp-sc,iva=base*(num(pv.iva)||0)/100;
  const mancanti=vetri.filter(g=>!(g.pr>0)).length+fz.fin.filter(l=>!(l.pr>0)).length+fz.zan.filter(l=>!(l.pr>0)).length;
  return{pv,vetri,fin:fz.fin,zan:fz.zan,lav,totV,totF,totZ,totL,imp,sc,base,iva,tot:base+iva,mq,vani,mlin:c.lati.reduce((a,l)=>a+latoLen(l),0)/1000,mancanti}}

function voceResult(c,x){

function fzThumb(x,r){
  if(!r.ok)return'<span class="note">Inserisci le misure</span>';
  const L=r.L,H=r.H,fs=Math.max(L,H)/14,pad=fs*1.6,fw=Math.min(L,H)*0.06,id='m'+x.id;
  let g=`<svg viewBox="${-pad} ${-fs*0.6} ${L+pad*1.4} ${H+fs*3.1}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anteprima del vano, vista interna">
    <defs><pattern id="${id}" width="${fs*0.45}" height="${fs*0.45}" patternUnits="userSpaceOnUse"><path d="M0 0H${fs*0.45}M0 0V${fs*0.45}" stroke="var(--muted)" stroke-width="${fs*0.03}" fill="none"/></pattern></defs>`;
  g+=`<rect x="0" y="0" width="${L}" height="${H}" fill="none" stroke="var(--ink)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;
  if(r.fin){const f=x.fin,n=Math.max(1,Math.min(4,+f.ante||1)),a=f.apertura||'Anta',w=(L-2*fw)/n,prim=f.verso==='SX'?0:n-1;
    g+=`<rect x="${fw/2}" y="${fw/2}" width="${L-fw}" height="${H-fw}" fill="none" stroke="var(--ink)" stroke-width="${fw}" stroke-opacity=".18"/>`;
    for(let i=0;i<n;i++){const x0=fw+i*w,y0=fw,h=H-2*fw,cerSx=n===1?f.verso!=='DX':i<n/2;
      g+=`<rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="var(--glass)" stroke="var(--accent)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`;
      const ln=(x1,y1,x2,y2,d)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--ink)" stroke-width="1" ${d?'stroke-dasharray="4 3"':''} vector-effect="non-scaling-stroke"/>`;
      const hx=cerSx?x0:x0+w,mx=cerSx?x0+w:x0;
      if(a==='Anta'||a==='Anta-ribalta'){g+=ln(hx,y0,mx,y0+h/2)+ln(hx,y0+h,mx,y0+h/2)}
      if(a==='Vasistas'||(a==='Anta-ribalta'&&(n===1||i===prim))){g+=ln(x0,y0+h,x0+w/2,y0,a==='Anta-ribalta')+ln(x0+w,y0+h,x0+w/2,y0,a==='Anta-ribalta')}
      if(a==='Bilico'){g+=ln(x0,y0+h/2,x0+w,y0+h/2)+ln(x0+w/2,y0,x0+w/2,y0+h,1)}
      if(a==='Scorrevole'||a==='Alzante scorrevole'){const dir=i%2?-1:1,cy=y0+h/2,ax=x0+w*0.25,bx=x0+w*0.75,tip=dir>0?bx:ax,fsA=Math.min(w,h)*0.08;
        g+=ln(ax,cy,bx,cy)+ln(tip,cy,tip-dir*fsA,cy-fsA)+ln(tip,cy,tip-dir*fsA,cy+fsA)}
      if(a==='Fisso')g+=`<text x="${x0+w/2}" y="${y0+h/2}" font-size="${fs}" text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-family="IBM Plex Mono,monospace" font-weight="600">F</text>`}}
  if(r.zan){const ins=r.fin?fw*1.6:fw*0.5;
    g+=`<rect x="${ins}" y="${ins}" width="${L-2*ins}" height="${H-2*ins}" fill="url(#${id})" fill-opacity=".9" stroke="var(--hi)" stroke-width="1.2" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>`;
    g+=`<text x="${L-ins-fs*0.3}" y="${ins+fs*0.95}" font-size="${fs*0.8}" text-anchor="end" fill="var(--hi)" font-family="IBM Plex Mono,monospace" font-weight="600">Z</text>`}
  const yb=H+fs*0.9;
  g+=`<path d="M0 ${yb-fs*.3}V${yb+fs*.3}M${L} ${yb-fs*.3}V${yb+fs*.3}M0 ${yb}H${L}" stroke="var(--hi)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  g+=`<text x="${L/2}" y="${yb+fs*1.15}" font-size="${fs*0.75}" text-anchor="middle" fill="var(--hi)" font-family="IBM Plex Mono,monospace">${fmt(L)}</text>`;
  const xl=-fs*0.7;g+=`<path d="M${xl-fs*.3} ${H}H${xl+fs*.3}M${xl-fs*.3} 0H${xl+fs*.3}M${xl} 0V${H}" stroke="var(--hi)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  g+=`<text x="${xl-fs*0.35}" y="${H/2}" font-size="${fs*0.75}" text-anchor="middle" fill="var(--hi)" font-family="IBM Plex Mono,monospace" transform="rotate(-90 ${xl-fs*0.35} ${H/2})">${fmt(H)}</text>`;
  return g+'</svg>';
}
function bindFzVani(c){

    else if(t.dataset.zf&&t.tagName!=='SELECT')x.zan[t.dataset.zf]=t.value;
    else return;
    save();if(t.dataset.xf!=='nome')voceResult(c,x);updTot(c)});
  m.addEventListener('change',e=>{const t=e.target,x=t.closest('[data-x]')&&findX(t);if(!x||t.tagName!=='SELECT')return;

    else if(t.dataset.zf){x.zan[t.dataset.zf]=t.value;if(t.dataset.zf==='tipo'){ensureRefs(c);paintAvvisi(c)}}else return;

  m.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!b.closest('[data-x]'))return;const x=findX(b);
    if(b.dataset.tog){x[b.dataset.tog].on=!x[b.dataset.tog].on;ensureRefs(c);save();viewFzVani(c);updTot(c);paintAvvisi(c)}
    else if(b.hasAttribute('data-xdup')){const n={...clone(x),id:uid(),nome:x.nome+' (copia)',link:null};c.fz.voci.splice(c.fz.voci.indexOf(x)+1,0,n);save();viewFzVani(c);updTot(c)}
    else if(b.hasAttribute('data-xunlink')){scollega(c,x);save();viewFzVani(c);toast('Vano scollegato: ora le misure sono indipendenti')}});
  armDelete('[data-xdel]',b=>{const x=c.fz.voci.find(y=>y.id===b.dataset.xdel);if(!x)return;scollega(c,x);c.fz.voci=c.fz.voci.filter(y=>y!==x);ensureRefs(c);save();viewFzVani(c);updTot(c);paintAvvisi(c)});

    c.fz.voci.push(x);ensureRefs(c);save();viewFzVani(c);updTot(c);const el=document.querySelector(`[data-x="${x.id}"]`);if(el)el.scrollIntoView({block:'start'})};
  if($('fzFromV')){$('fzFromV').onclick=()=>{const p=$('fzPick');p.hidden=!p.hidden};$('fzPickNo').onclick=()=>{$('fzPick').hidden=true};
    $('fzPickOk').onclick=()=>{const f=findVano(c,$('fzPickSel').value);if(!f)return;
      const x=newVoce(/^vano\s*\d*$/i.test(f.v.nome.trim())?`${f.l.nome} – ${f.v.nome}`:f.v.nome,c,{L:f.v.L,H:f.v.Hs,link:f.v.id});f.v.link=x.id;
      c.fz.voci.push(x);ensureRefs(c);save();viewFzVani(c);updTot(c);toast('Vano collegato: le misure si aggiornano in entrambe le sezioni')}}

  if(!DV.pend)DV.pend=p;else{if(Math.hypot(p[0]-DV.pend[0],p[1]-DV.pend[1])>1e-3){Q.push({a:DV.pend,b:p,t:''});disSaveQ(DV.id)}DV.pend=null}
  dv2();dvFoot()}
function dvMode(mo){if(!DV||!DV.g)return;if(mo==='3d'){DV.qm=false;DV.pend=null;DV.qsel=null}DV.mode=mo;DV.el.querySelectorAll('[data-dvm]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.dvm===mo)));
  const C=$('dvC'),H=$('dv3'),M=$('dvMsg');
  if(mo==='2d'){if(DV.t3){DV.t3.dispose();DV.t3=null}H.hidden=true;H.innerHTML='';C.hidden=false;M.hidden=true;dvSize();dv2();dvFoot();return}
  C.hidden=true;H.hidden=false;M.hidden=false;M.textContent='Preparo il 3D…';
  DV.auto=!DV.sel;if(!DV.sel)DV.sel=disMain(DV.g);const part=DV.sel,me=DV;dvFoot();
  if(!part){M.textContent='In questo disegno non ci sono contorni chiusi da mostrare in 3D.';return}
  setTimeout(()=>dis3D(H,DV.g,part).then(t=>{if(DV!==me||me.mode!=='3d'){t&&t.dispose();return}me.t3=t;M.hidden=true})
    .catch(()=>{if(DV===me)M.textContent='Il 3D non è disponibile su questo dispositivo.'}),30)}

/* ---------- 3D: la sezione scelta allungata come un profilo (three.js, caricato solo quando serve) ---------- */
let THREE_P=null;
async function dis3D(host,g,part){const THREE=await(THREE_P||(THREE_P=import('./three.module.min.js')));
  const C=[],seen=new Set();
  part.ids.forEach(i=>{const a=g.paths[i].p,pts=[];for(let k=0;k<a.length;k+=2){const x=a[k],y=a[k+1],L=pts[pts.length-1];if(!L||Math.abs(L.x-x)>1e-4||Math.abs(L.y-y)>1e-4)pts.push(new THREE.Vector2(x,y))}
    if(pts.length>3&&pts[0].distanceTo(pts[pts.length-1])<1e-4)pts.pop();if(pts.length<3)return;
    let ar=0,x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;for(let k=0;k<pts.length;k++){const p=pts[k],q=pts[(k+1)%pts.length];ar+=p.x*q.y-q.x*p.y;
      if(p.x<x0)x0=p.x;if(p.x>x1)x1=p.x;if(p.y<y0)y0=p.y;if(p.y>y1)y1=p.y}
    ar=Math.abs(ar/2);if(ar<1e-3)return;const key=[x0,y0,x1,y1].map(v=>Math.round(v*20)).join(',')+':'+Math.round(ar*10);if(seen.has(key))return;seen.add(key);
    C.push({pts,ar,x0,y0,x1,y1,par:-1,dep:0})});
  if(!C.length)throw new Error('vuoto');
  C.sort((a,b)=>b.ar-a.ar);
  const inside=(P,pt)=>{let r=false;const v=P.pts;for(let i=0,j=v.length-1;i<v.length;j=i++){const a=v[i],b=v[j];if(((a.y>pt.y)!==(b.y>pt.y))&&(pt.x<(b.x-a.x)*(pt.y-a.y)/(b.y-a.y)+a.x))r=!r}return r};
  const e=1e-6;
  for(let i=1;i<C.length;i++){const ci=C[i],n=ci.pts.length,tp=[ci.pts[0],ci.pts[Math.floor(n/3)],ci.pts[Math.floor(2*n/3)]];
    for(let j=i-1;j>=0;j--){const cj=C[j];if(cj.x0>ci.x0+e||cj.y0>ci.y0+e||cj.x1<ci.x1-e||cj.y1<ci.y1-e)continue;
      let k=0;tp.forEach(p=>{if(inside(cj,p))k++});if(k>=2){ci.par=j;ci.dep=cj.dep+1;break}}}
  const shapes=[];C.forEach(ci=>{if(ci.dep%2===0){ci.shape=new THREE.Shape(ci.pts);shapes.push(ci.shape)}});
  C.forEach(ci=>{if(ci.dep%2===1&&ci.par>=0&&C[ci.par].shape)C[ci.par].shape.holes.push(new THREE.Path(ci.pts))});
  const W=part.x1-part.x0,H=part.y1-part.y0,len=Math.max(W,H)*1.6;
  const geo=new THREE.ExtrudeGeometry(shapes,{depth:len,bevelEnabled:false,curveSegments:1,steps:1});
  geo.translate(-(part.x0+part.x1)/2,-(part.y0+part.y1)/2,-len/2);geo.computeVertexNormals();
  const T=disTheme(),scene=new THREE.Scene();
  const mat=new THREE.MeshStandardMaterial({color:0xd3d9df,metalness:.3,roughness:.5,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
  const mesh=new THREE.Mesh(geo,mat);scene.add(mesh);
  const eg=new THREE.EdgesGeometry(geo,28),em=new THREE.LineBasicMaterial({color:new THREE.Color(T.ink),transparent:true,opacity:.55});scene.add(new THREE.LineSegments(eg,em));
  scene.add(new THREE.HemisphereLight(0xffffff,0x6b7680,1.7));
  const R=Math.hypot(W,H,len)/2,cam=new THREE.PerspectiveCamera(30,1,R/200,R*40);scene.add(cam);
  const dl=new THREE.DirectionalLight(0xffffff,2.3);dl.position.set(.5,.9,1);cam.add(dl);
  let rnd;try{rnd=new THREE.WebGLRenderer({antialias:true,alpha:true})}catch(err){geo.dispose();eg.dispose();throw err}
  rnd.setPixelRatio(Math.min(2,window.devicePixelRatio||1));host.appendChild(rnd.domElement);const cv=rnd.domElement;cv.style.touchAction='none';
  const st={th:.62,ph:1.12,dist:R*4,user:false};const st0={...st};let req=0;
  const fitDist=()=>{const vf=cam.fov*Math.PI/360,hf=Math.atan(Math.tan(vf)*cam.aspect);return R/Math.sin(Math.min(vf,hf))*1.12};
  const draw=()=>{req=0;cam.position.set(st.dist*Math.sin(st.ph)*Math.sin(st.th),st.dist*Math.cos(st.ph),st.dist*Math.sin(st.ph)*Math.cos(st.th));cam.lookAt(0,0,0);rnd.render(scene,cam)};
  const ask=()=>{if(!req)req=requestAnimationFrame(draw)};
  const resize=()=>{const w=host.clientWidth||300,h=host.clientHeight||300;rnd.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();if(!st.user)st.dist=fitDist();ask()};
  const ptr=new Map(),pos=ev=>{const r=cv.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top}};
  cv.onpointerdown=ev=>{try{cv.setPointerCapture(ev.pointerId)}catch(_){}ptr.set(ev.pointerId,pos(ev))};
  cv.onpointermove=ev=>{const p=ptr.get(ev.pointerId);if(!p)return;const n=pos(ev);
    if(ptr.size===1){st.th-=(n.x-p.x)*.008;st.ph=Math.max(.08,Math.min(Math.PI-.08,st.ph-(n.y-p.y)*.008))}
    else{let o=null;for(const[k,v]of ptr)if(k!==ev.pointerId){o=v;break}if(o){const d0=Math.hypot(p.x-o.x,p.y-o.y),d1=Math.hypot(n.x-o.x,n.y-o.y);if(d0>2&&d1>2){st.dist=Math.max(R*.6,Math.min(R*30,st.dist*d0/d1));st.user=true}}}
    p.x=n.x;p.y=n.y;ask()};
  cv.onpointerup=cv.onpointercancel=ev=>{ptr.delete(ev.pointerId)};
  cv.onwheel=ev=>{ev.preventDefault();st.dist=Math.max(R*.6,Math.min(R*30,st.dist*Math.exp(ev.deltaY*.0015)));st.user=true;ask()};
  resize();
  return{resize,reset(){Object.assign(st,st0);st.dist=fitDist();ask()},dispose(){if(req)cancelAnimationFrame(req);geo.dispose();eg.dispose();mat.dispose();em.dispose();rnd.dispose();try{rnd.forceContextLoss()}catch(_){}cv.remove()}}}

/* ---------- riquadro "Sezione" nei profili e pulsanti nei cantieri ---------- */
function disBlockHTML(id){const m=DIS.meta.get(id);
  return`<div class="dis-box">${m?`<canvas class="dis-th" data-dist="${id}" data-disv="${id}" role="button" tabindex="0" aria-label="Apri la sezione"></canvas>`:''}
   <div class="dis-side"><small>${m?esc(m.file)+' · '+new Date(m.at).toLocaleDateString('it-IT'):'Nessun disegno. Importa il file DXF con la sezione di questo profilo.'}</small>
   <div class="row"><label class="btn sm${m?'':' primary'}" for="dif_${id}">${m?'Sostituisci DXF':'Importa DXF'}</label><input type="file" id="dif_${id}" data-disin="${id}" hidden>
   ${m?`<button class="btn sm" type="button" data-disv="${id}">Apri</button><button class="btn sm danger" type="button" data-disdel="${id}">Elimina disegno</button>`:''}</div></div></div>`}
function bindDis(rer){
  document.querySelectorAll('[data-disin]').forEach(i=>i.onchange=async e=>{const f=e.target.files&&e.target.files[0],id=e.target.dataset.disin;e.target.value='';if(!f)return;
    toast('Leggo il disegno…');try{const g=await leggiDxf(f);await disPut(id,f.name,g);rer();toast('Disegno importato: '+f.name)}catch(err){toast(dxfErr(err,f.name))}});
  armDelete('[data-disdel]',async b=>{await disDel(b.dataset.disdel);rer();toast('Disegno eliminato')})}
const disInline=id=>id&&DIS.meta.has(id)?`<button type="button" class="dis-inl" data-disv="${id}" aria-label="Apri la sezione"><canvas data-dist="${id}" data-big="1" aria-hidden="true"></canvas><span>Sezione del profilo: tocca per ingrandire, mettere le quote o vederla in 3D</span></button>`:'';
const disBtn=(id,t='Vedi sezione')=>id&&DIS.meta.has(id)?`<button class="btn sm" type="button" data-disv="${id}">${t}</button>`:'';
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-disv]');if(!b)return;e.preventDefault();openDis(b.dataset.disv)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('canvas[data-disv]')){e.preventDefault();openDis(e.target.dataset.disv)}});
/* import di più file: un profilo per file nella sezione aperta (se esiste già un profilo con quel nome, gli assegna il disegno) */
async function importaDxfMulti(files,sec){
  const k=sec==='finestre'?'tipFin':sec==='zanzariere'?'tipZan':'sistemi';let n=0,nuovi=0,last=null;const err=[];
  for(let i=0;i<files.length;i++){const f=files[i];progress(`Leggo ${i+1} di ${files.length}: ${f.name}`);
    try{const g=await leggiDxf(f),nome=nomeDaFile(f.name);
      let p=S.prof[k].find(x=>x.nome.toLowerCase()===nome.toLowerCase()&&(k!=='sistemi'||sezOf(x)===sec));
      if(!p){p=nuovoProfiloDa(k,sec,nome);S.prof[k].push(p);nuovi++}
      await disPut(p.id,f.name,g);n++;last=p}catch(e){err.push(dxfErr(e,f.name))}
    await new Promise(r=>setTimeout(r,20))}
  if(last){S.ui.tipSel=S.ui.tipSel||{};S.ui.tipSel[k==='sistemi'?'prof_'+sec:k==='tipFin'?'prof_fin':'prof_zan']=last.id}
  progress(null);save();renderHome();
  toast(n?`${n} ${n===1?'disegno importato':'disegni importati'}${nuovi?`, ${nuovi} ${nuovi===1?'profilo nuovo':'profili nuovi'}`:''}${err.length?` · ${err.length} non letti`:''}`:(err[0]||'Nessun file importato'));
  if(err.length)setTimeout(()=>toast(err.slice(0,2).join(' · ')),2400)}
function nuovoProfiloDa(k,sec,nome){let p;
  if(k==='tipZan'){const t=/pliss/i.test(nome)?'plisse':/lateral/i.test(nome)?'laterale':/battent|anta/i.test(nome)?'battente':/fiss|tubol/i.test(nome)?'fissa':'verticale';
    p=zanDaPreset(ZAN_PRESETS.find(x=>x.key==='z-'+t)||ZAN_PRESETS[0])}
  else if(k==='tipFin')p=finDaPreset(FIN_PRESETS[0]);
  else p=sisDaPreset(PRESETS.find(x=>x.key===({scorrevoli:'binari',pacchetto:'pacchetto',fisse:'fissavetro'})[sec])||PRESETS[0]);
  p.nome=nome;p.forn='';p.note='';return p}

    const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))showUpd(doReload);else doReload()});
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}));
