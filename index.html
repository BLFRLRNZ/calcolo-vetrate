<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vetrate">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Calcolo Vetrate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: strumento tecnico. Barra superiore compatta, contenuto su carta millimetrata, navigazione fissa in basso; schede a una colonna su telefono */
:root{
  --bg:#eef1f4; --grid:#e3e8ed; --surface:#ffffff; --surface-2:#f5f7f9; --ink:#0f1720; --muted:#5b6976;
  --line:#d6dde4; --line-2:#b8c3ce; --accent:#0b7a8f; --accent-ink:#ffffff; --accent-soft:#e0f0f3;
  --hi:#d9530b; --sel:var(--hi); --glass:#cfe6ec; --glass-2:#a8d2db; --bar:#0f1720; --bar-ink:#dfe7ee; --bar-muted:#7f8d99;
  --warn:#b25b00; --bad:#c0362c; --ok:#2b7a3d;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px; --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1015; --grid:#111920; --surface:#111a21; --surface-2:#16212a; --ink:#e2e9ef; --muted:#8b9aa7;
  --line:#22303b; --line-2:#344552; --accent:#3cc3d8; --accent-ink:#04232a; --accent-soft:#0f2e36;
  --hi:#ff8a3d; --glass:#173f48; --glass-2:#215661; --bar:#070b0f; --bar-ink:#dfe7ee; --bar-muted:#6f7e8a;
  --warn:#f0a54a; --bad:#ff8a80; --ok:#7fcf8a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1015; --grid:#111920; --surface:#111a21; --surface-2:#16212a; --ink:#e2e9ef; --muted:#8b9aa7;
  --line:#22303b; --line-2:#344552; --accent:#3cc3d8; --accent-ink:#04232a; --accent-soft:#0f2e36;
  --hi:#ff8a3d; --glass:#173f48; --glass-2:#215661; --bar:#070b0f; --bar-ink:#dfe7ee; --bar-muted:#6f7e8a;
  --warn:#f0a54a; --bad:#ff8a80; --ok:#7fcf8a; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto}

/* barra superiore */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border:1px solid var(--line);border-top:0;
  border-radius:0 0 var(--r) var(--r);padding:12px 14px;margin-bottom:4px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .titles{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.crumb{font:500 .66rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font:700 1.45rem/1.05 var(--f-display);letter-spacing:.005em;margin:0;overflow-wrap:anywhere}
.sub{color:var(--muted);font:400 .76rem var(--f-mono);overflow-wrap:anywhere}
.logo{flex:none;width:38px;height:38px;border-radius:var(--r);background:var(--bar);display:grid;place-items:center}
.back{flex:none;width:38px;height:38px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.back svg{width:18px;height:18px}

/* navigazione in basso */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bar);border-top:1px solid var(--line-2);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bnav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.bnav button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:var(--r);
  color:var(--bar-muted);font:500 .64rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;position:relative}
.bnav svg{width:22px;height:22px}
.bnav button[aria-selected="true"]{color:var(--bar-ink)}
.bnav button[aria-selected="true"]::before{content:"";position:absolute;top:-7px;left:25%;right:25%;height:2px;background:var(--accent)}
.bnav button:focus-visible{outline:2px solid var(--accent)}

main{padding-top:14px;display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:14px}
@media (min-width:860px){.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
h2{font:600 1.15rem/1.2 var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
h3{font:600 .68rem var(--f-mono);margin:4px 0 0;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);display:flex;align-items:center;gap:8px}
h3::after{content:"";flex:1;height:1px;background:var(--line)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}
.sec h2{font-size:1rem;text-transform:uppercase;letter-spacing:.08em}
.sec .note{font-size:.78rem}

/* campi */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px 12px}
label.f{display:flex;flex-direction:column;gap:5px;min-width:0;font:500 .66rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
label.f .hint{font:400 .74rem var(--f-body);letter-spacing:0;text-transform:none;opacity:.9}
.f.wide{grid-column:1/-1}
label.chk{display:flex;gap:8px;align-items:center;font-size:.88rem}
label.chk input{width:auto}
input,select,textarea{font:500 .95rem var(--f-body);color:var(--ink);background:var(--surface-2);border:1px solid var(--line-2);border-radius:4px;padding:9px 10px;width:100%;min-width:0;min-height:40px}
input.num,textarea.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
input[readonly]{background:transparent;border-style:dashed;color:var(--muted)}
input.name{font:600 1.08rem var(--f-display);background:transparent;border-color:transparent;padding:4px 6px;min-height:0}
input.name:hover{border-color:var(--line-2)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.unit{position:relative}
.unit input{padding-right:40px}
.unit span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:500 .68rem var(--f-mono);color:var(--muted);pointer-events:none;text-transform:none;letter-spacing:0}

/* pulsanti */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:500 .78rem var(--f-mono);border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);padding:7px 11px;border-radius:4px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.btn{font:600 .82rem var(--f-body);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:4px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line-2))}
.btn.sm{padding:5px 9px;font-size:.76rem}
.btn[data-armed]{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}

/* letture numeriche */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{padding:10px 12px;background:var(--surface-2);border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.stat b{display:block;font:600 1.35rem var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font:500 .62rem var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.1em}

/* tabelle */
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font:500 .62rem var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.1em;background:var(--surface-2)}
td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
.l{text-align:left}
td.t{font-family:var(--f-body)}
tr.grp td{background:var(--accent-soft);font:600 .7rem var(--f-mono);color:var(--accent);text-align:left;text-transform:uppercase;letter-spacing:.1em}
tfoot td{font-weight:600}

.pill{display:inline-flex;align-items:center;gap:5px;font:500 .7rem var(--f-mono);padding:3px 8px;border-radius:3px;border:1px solid currentColor;letter-spacing:.02em}
.pill.mob{color:var(--accent)} .pill.fix{color:var(--muted)} .pill.w{color:var(--warn)} .pill.b{color:var(--bad)}
.msg{font-size:.82rem;padding:7px 10px;border-radius:4px;border-left:3px solid var(--warn);background:var(--surface-2)}
.msg.bad{border-color:var(--bad)} .msg.ok{border-color:var(--ok)}
.note{font-size:.84rem;color:var(--muted);margin:0;max-width:68ch}
.banner{font-size:.84rem;padding:10px 12px;border-radius:4px;border:1px dashed var(--hi);background:color-mix(in srgb,var(--hi) 7%,transparent)}

/* struttura */
.lato{padding:0;gap:0;overflow:hidden}
.lato-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.lato-head .tag{font:700 .9rem var(--f-mono);color:var(--surface);background:var(--ink);border-radius:4px;width:30px;height:30px;display:grid;place-items:center}
.lato-head input.name{flex:1;min-width:140px}
.lato-body{padding:14px 12px;display:flex;flex-direction:column;gap:14px}
.vani{display:flex;flex-direction:column;gap:12px}
.vano{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.vano-head{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 8px;border-bottom:1px solid var(--line)}
.vano-head input.name{flex:1;min-width:120px;font-size:1rem}
.vano-main{display:grid;grid-template-columns:1fr;gap:12px;padding:12px}
@media (min-width:640px){.vano-main{grid-template-columns:200px minmax(0,1fr)}}
.thumb{background:var(--surface-2);border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;padding:8px;min-height:120px}
.thumb svg{width:100%;height:auto;max-height:190px;display:block}
.vres{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font:500 .8rem var(--f-mono);padding:8px 12px;border-top:1px solid var(--line);background:var(--surface-2)}
.vres b{font-weight:600}
.vano details{padding:0 12px 12px}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.vano details summary{font:500 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--accent);padding-top:10px}
.vano details summary::before{content:"+ "}
.vano details[open] summary::before{content:"− "}
.vano details[open] summary{margin-bottom:8px}

/* disegni */
.draw{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:8px;overflow-x:auto}
.draw svg{display:block;width:100%;height:auto}
.plan svg{max-height:380px}
.plan [data-lato]{cursor:pointer}
.kv{display:grid;grid-template-columns:1fr auto;gap:0;font-size:.86rem;margin:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kv dt,.kv dd{padding:7px 10px;border-bottom:1px solid var(--line);margin:0}
.kv dt{color:var(--muted)} .kv dd{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;font-weight:500}
.kv dt:nth-last-child(2),.kv dd:last-child{border-bottom:0}

/* elenco cantieri */
.clist{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.ccard{text-align:left;cursor:pointer;font:inherit;color:inherit;padding:0;gap:0;overflow:hidden}
.ccard:hover{border-color:var(--ink)}
.ccard .cthumb{background:var(--surface-2);border-bottom:1px solid var(--line);height:130px;display:grid;place-items:center;padding:10px}
.ccard .cthumb svg{width:100%;height:100%}
.ccard .cbody{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.ccard .meta{display:grid;grid-template-columns:repeat(4,auto);justify-content:start;gap:4px 14px;font:400 .7rem var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ccard .meta b{display:block;font:600 .95rem var(--f-mono);color:var(--ink);letter-spacing:0}

.vtab td input{padding:6px 8px;font-size:.86rem;min-height:34px}
.vtab td{padding:4px 6px}
.vtab td:first-child input{min-width:150px}
.vtab td input.num{width:84px}

/* sistemi */
[data-s] details>summary{display:flex;flex-direction:column;gap:2px}
.sis-t{font:600 1.1rem var(--f-display);color:var(--ink)}
[data-s] details>summary .note{font:400 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
.sis-body{display:flex;flex-direction:column;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}

.sync{font:500 .64rem var(--f-mono);color:var(--muted);display:inline-flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.08em}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--ok)} .sync.w::before{background:var(--warn)} .sync.b::before{background:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:4px;font:500 .82rem var(--f-mono);z-index:20}
@media (prefers-reduced-motion:no-preference){.seg button,.btn,.bnav button{transition:background .15s,color .15s,border-color .15s}}
</style>

</head>
<body>
<div class="wrap">
<header id="hdr"></header>
<main id="main"></main>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const num=v=>{if(v==null)return NaN;const s=String(v).trim().replace(/\s/g,'').replace(',','.');return s===''?NaN:parseFloat(s)};
const fmt=(n,d=0)=>isFinite(n)?n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d}):'–';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const letter=i=>String.fromCharCode(65+(i%26));
const clone=o=>JSON.parse(JSON.stringify(o));

/* sistemi: ogni vano usa un sistema; due schemi di calcolo */
const SCHEMI={scorrevole:'Ante sovrapposte (scorrono una sull\'altra)',affiancati:'Vetri affiancati (impacchettabile, a libro, fissa)'};
const SIS_FIELDS=[
 {t:'Telaio e posa',f:[
  ['gp','Gioco di posa per lato','mm','Spazio tra muro e telaio, su ogni lato'],
  ['telL','Deduzione telaio in larghezza','mm','Totale sx + dx, dal telaio esterno alla luce utile'],
  ['telH','Deduzione telaio in altezza','mm','Totale sopra + sotto: binari, guide o profili']]},
 {t:'Tra un vetro e l\'altro',f:[
  ['sorm','Sormonto tra ante','mm','Quanto si sovrappongono due ante vicine. Negativo = fuga tra i vetri','scorrevole'],
  ['fuga','Spazio tra vetri vicini','mm','Montante, guarnizione o fuga tra un vetro e il successivo','affiancati']]},
 {t:'Vetro',f:[
  ['vetL','Deduzione vetro in larghezza','mm','Totale, da anta o modulo a vetro (profili + gioco)'],
  ['vetH','Deduzione vetro in altezza','mm','Totale, da anta o modulo a vetro (traversi + gioco)']]},
 {t:'Limiti e divisione automatica',f:[
  ['minN','Numero minimo di vetri','n',''],['maxN','Numero massimo di vetri','n',''],
  ['maxW','Larghezza massima vetro','mm',''],['maxH','Altezza massima vetro','mm',''],
  ['maxKg','Peso massimo per vetro','kg',''],['binari','Binari o guide','n','Solo informativo']]}
];
const FATT_FIELDS=[['minMq','Superficie minima per vetro','m²','Sotto questa soglia si fattura il minimo'],
  ['arrot','Arrotondamento lati','mm','Multiplo per eccesso, 0 = nessuno'],['sfrido','Sfrido / scarto','%','Aggiunto ai m² da ordinare']];
const DEF_FATT={minMq:0.5,arrot:0,sfrido:0};
const DEF_SP={gp:0,telL:0,telH:0,sorm:0,fuga:0,vetL:0,vetH:0,minN:1,maxN:8,maxW:1500,maxH:3000,maxKg:120,binari:0};
const PRESETS=[
 {key:'binari',nome:'Scorrevole tutto vetro su binari',schema:'scorrevole',mobili:true,
  note:'Vetrata panoramica a 3–5 binari, ante senza profili verticali. Larghezza anta tipica 600–1000 mm, vetro temperato 10 mm.',
  p:{telL:30,sorm:30,vetH:75,minN:2,maxN:10,maxW:1000,maxH:3000,maxKg:80,binari:3}},
 {key:'pacchetto',nome:'Impacchettabile (si raccoglie a pacchetto)',schema:'affiancati',mobili:true,
  note:'Vetri affiancati con guarnizione tra uno e l\'altro, appesi alla guida superiore. Larghezza vetro tipica 600–800 mm, circa 55 kg max per vetro.',
  p:{telL:30,fuga:3,vetH:80,minN:2,maxN:14,maxW:800,maxH:3000,maxKg:55,binari:1}},
 {key:'libro',nome:'A libro (pieghevole)',schema:'affiancati',mobili:true,
  note:'Ante incernierate che si piegano a soffietto. Larghezza anta tipica 500–850 mm, altezza fino a circa 2800 mm.',
  p:{telL:30,fuga:5,vetH:80,minN:2,maxN:10,maxW:850,maxH:2800,maxKg:60,binari:1}},
 {key:'alluminio',nome:'Scorrevole in alluminio con telaio',schema:'scorrevole',mobili:true,
  note:'Serramento con telaio e ante a profilo. Tarato su un catalogo di settore: 2 ante su 2 binari danno vetro L/2 − 75,5 mm e H − 130 mm.',
  p:{telL:60,telH:40,sorm:40,vetL:65.5,vetH:90,minN:2,maxN:6,maxW:1500,maxH:2700,maxKg:150,binari:2}},
 {key:'fissaprof',nome:'Fissa con profili e montanti',schema:'affiancati',mobili:false,
  note:'Vetri fissi in telaio perimetrale con montante tra un vetro e l\'altro. Larghezza vetro fino a circa 2000 mm.',
  p:{gp:5,telL:50,telH:50,fuga:50,vetL:10,vetH:10,minN:1,maxN:8,maxW:2000,maxH:3000,maxKg:150}},
 {key:'fissavetro',nome:'Fissa tutto vetro (vetri accostati)',schema:'affiancati',mobili:false,
  note:'Vetri accostati con guarnizione trasparente, profilo a U sopra e sotto. Larghezza vetro tipica 500–1000 mm.',
  p:{telL:20,fuga:3,vetH:40,minN:1,maxN:10,maxW:1000,maxH:2500,maxKg:80}}
];
const sisDaPreset=x=>({id:uid(),nome:x.nome,schema:x.schema,mobili:x.mobili,note:x.note,preset:x.key,p:{...DEF_SP,...x.p}});
const presetSistemi=()=>PRESETS.map(sisDaPreset);
const defVetri=()=>[['Temperato 8 mm',8,20],['Temperato 10 mm',10,25],['Stratificato 33.1',6.4,16],['Stratificato 44.2',8.8,22],
 ['Stratificato 55.2',10.8,27],['Vetrocamera 4/16/4',8,20],['Vetrocamera 33.1/16/33.1',12.8,32]].map(([nome,sp,kg])=>({id:uid(),nome,sp,kg,prezzo:''}));

function newVano(nome,o={}){return{id:uid(),nome,L:'',Hs:'',Hd:'',qta:'1',sistema:'',n:'auto',vetro:'',...o}}
function newLato(nome,o={}){return{id:uid(),nome,angolo:90,pil:0,vani:[],...o}}
function newCantiere(nome,modello,catalogo){return{id:uid(),nome,indirizzo:'',note:'',parete:true,creato:new Date().toISOString().slice(0,10),
  p:{...DEF_FATT,...(modello&&modello.fatt||{})},sistemi:clone(modello&&modello.sistemi&&modello.sistemi.length?modello.sistemi:presetSistemi()),vetri:clone(catalogo),lati:[]}}
const sisBy=(c,key)=>c.sistemi.find(s=>s.preset===key)||c.sistemi[0];
function esempio(modello,catalogo){
  const c=newCantiere('Veranda di esempio',modello,catalogo);
  c.note='Misure di esempio: sostituiscile con quelle reali o crea un nuovo cantiere.';
  const v=c.vetri.find(x=>x.nome.includes('10 mm'))||c.vetri[0],fx=sisBy(c,'fissavetro').id,sc=sisBy(c,'binari').id;
  c.lati=[
    newLato('Fianco sinistro',{vani:[newVano('Vano 1',{L:'2500',Hs:'2600',Hd:'2300',sistema:fx,vetro:v.id})]}),
    newLato('Fronte',{pil:80,vani:[newVano('Vano scorrevole',{L:'3000',Hs:'2300',Hd:'2300',sistema:sc,vetro:v.id}),newVano('Vano fisso',{L:'1500',Hs:'2300',Hd:'2300',sistema:fx,vetro:v.id})]}),
    newLato('Fianco destro',{vani:[newVano('Vano 1',{L:'2500',Hs:'2300',Hd:'2600',sistema:fx,vetro:v.id})]})];
  return c;
}
/* migrazione dal formato precedente (tipo fissa/scorrevole + parametri unici) */
function sistemiDaVecchi(p){p=p||{};const b={gp:p.gp??5,maxN:p.maxN??8,maxW:p.maxW??1500,maxH:p.maxH??3000,maxKg:p.maxKg??120};
  return[{id:uid(),nome:'Scorrevole (tuoi parametri)',schema:'scorrevole',mobili:true,note:'Parametri che avevi inserito nella versione precedente.',preset:'',p:{...DEF_SP,...b,telL:p.sTelL??40,telH:p.sTelH??60,sorm:p.sorm??40,vetL:p.sAntaL??70,vetH:p.sAntaH??90,minN:p.minAnte??2,binari:p.binari??2}},
    {id:uid(),nome:'Fissa (tuoi parametri)',schema:'affiancati',mobili:false,note:'Parametri che avevi inserito nella versione precedente.',preset:'',p:{...DEF_SP,...b,telL:p.fTelL??50,telH:p.fTelH??50,fuga:p.mont??50,vetL:p.fVetL??10,vetH:p.fVetH??10,minN:1}}]}
function migraCantiere(c){
  if(!(c.sistemi&&c.sistemi.length)){const old=sistemiDaVecchi(c.p);c.sistemi=[...old,...presetSistemi()];
    c.lati.forEach(l=>l.vani.forEach(v=>{v.sistema=v.tipo==='scorrevole'?old[0].id:old[1].id;delete v.tipo}));
    const p=c.p||{};c.p={minMq:p.minMq??0.5,arrot:p.arrot??0,sfrido:p.sfrido??0}}
  c.p={...DEF_FATT,...c.p};c.sistemi.forEach(x=>x.p={...DEF_SP,...x.p});return c}
function migraModello(m){if(m.sistemi)return m;
  return{id:m.id,nome:m.nome,sistemi:[...sistemiDaVecchi(m.p),...presetSistemi()],fatt:{minMq:m.p?.minMq??0.5,arrot:m.p?.arrot??0,sfrido:m.p?.sfrido??0}}}

function fresh(){const f={v:2,modelli:[{id:uid(),nome:'Preimpostazioni standard',sistemi:presetSistemi(),fatt:{...DEF_FATT}}],catalogo:defVetri(),cantieri:[],ui:{c:null,tab:'struttura',lato:null,sviluppo:false}};
  f.cantieri=[esempio(f.modelli[0],f.catalogo)];return f}
function load(){let o=null;try{o=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}

  o.modelli=(o.modelli||[]).map(migraModello);if(!o.modelli.length)o.modelli=fresh().modelli;
  o.cantieri.forEach(migraCantiere);return o}

async function shareFile(name,obj){
  const blob=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}),file=new File([blob],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('File salvato')}
function readFile(input,fn){const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{fn(JSON.parse(r.result))}catch(e){toast('File non valido')}input.value=''};r.readAsText(f)}

/* ---------- calcolo ---------- */
const sisOf=(c,v)=>c.sistemi.find(s=>s.id===v.sistema)||c.sistemi[0];
function layout(N,L,Hs,Hd,s,f,kgm){
  const p=s.p,H=x=>Hs+(Hd-Hs)*x/L,panes=[],ded=2*p.gp+p.telH+p.vetH,by=p.gp+p.telH/2+p.vetH/2,luce=L-2*p.gp-p.telL;
  let w,step;
  if(s.schema==='scorrevole'){w=(luce+(N-1)*p.sorm)/N;step=w-p.sorm}else{w=(luce-(N-1)*p.fuga)/N;step=w+p.fuga}
  const gw=w-p.vetL;
  for(let i=0;i<N;i++){const gx=p.gp+p.telL/2+i*step+p.vetL/2;panes.push({i:i+1,mob:!!s.mobili,gx,gw,hl:H(gx)-ded,hr:H(gx+gw)-ded,by})}
  const r=v=>f.arrot>0?Math.ceil(v/f.arrot)*f.arrot:v;
  panes.forEach(q=>{q.mq=q.gw*(q.hl+q.hr)/2/1e6;q.kg=q.mq*kgm;
    q.fmq=Math.max(f.minMq||0,r(q.gw)*r(Math.max(q.hl,q.hr))/1e6);q.lato=Math.hypot(q.gw,q.hr-q.hl)});
  return panes;
}
function problems(panes,p){const m=[];
  panes.forEach(q=>{
    if(!(q.gw>0&&q.hl>0&&q.hr>0))m.push(['bad',`Vetro ${q.i}: misure nulle o negative, controlla vano e detrazioni.`]);
    else{if(q.gw>p.maxW)m.push(['warn',`Vetro ${q.i}: larghezza ${fmt(q.gw)} mm oltre il massimo di ${fmt(p.maxW)} mm.`]);
      if(Math.max(q.hl,q.hr)>p.maxH)m.push(['warn',`Vetro ${q.i}: altezza ${fmt(Math.max(q.hl,q.hr))} mm oltre il massimo di ${fmt(p.maxH)} mm.`,'h']);
      if(q.kg>p.maxKg)m.push(['warn',`Vetro ${q.i}: peso ${fmt(q.kg,1)} kg oltre il massimo di ${fmt(p.maxKg)} kg.`])}});
  return m}
function compute(v,c){
  const L=num(v.L),Hs=num(v.Hs);let Hd=num(v.Hd);if(!isFinite(Hd))Hd=Hs;
  if(!(L>0&&Hs>0&&Hd>0)||!c.sistemi.length)return{ok:false};
  const s=sisOf(c,v),p=s.p,f=c.p,gl=c.vetri.find(x=>x.id===v.vetro)||c.vetri[0]||{nome:'—',kg:0},kgm=num(gl.kg)||0,qta=Math.max(1,Math.round(num(v.qta))||1);
  let N,panes,auto=v.n==='auto';
  if(auto){const lo=Math.max(s.schema==='scorrevole'?2:1,p.minN|0),hi=Math.max(lo,p.maxN|0);
    for(N=lo;N<=hi;N++){panes=layout(N,L,Hs,Hd,s,f,kgm);if(!problems(panes,p).some(m=>m[2]!=='h'))break}
    if(N>hi){N=hi;panes=layout(N,L,Hs,Hd,s,f,kgm)}}
  else{N=+v.n;panes=layout(N,L,Hs,Hd,s,f,kgm)}
  const sum=k=>panes.reduce((a,q)=>a+q[k],0);
  return{ok:true,L,Hs,Hd,N,auto,panes,qta,gl,s,flat:Math.abs(Hs-Hd)<.5,msgs:problems(panes,p),
    mq:sum('mq')*qta,fmq:sum('fmq')*qta*(1+(f.sfrido||0)/100),kg:sum('kg')*qta,prezzo:num(gl.prezzo)};
}
const latoLen=(l)=>{const ws=l.vani.map(v=>num(v.L)).filter(x=>x>0);return ws.reduce((a,b)=>a+b,0)+Math.max(0,ws.length-1)*(num(l.pil)||0)};
function totals(c){const t={vetri:0,mq:0,fmq:0,kg:0,cost:0,vani:0,warn:0};
  c.lati.forEach(l=>l.vani.forEach(v=>{t.vani++;const r=compute(v,c);if(!r.ok)return;
    t.vetri+=r.N*r.qta;t.mq+=r.mq;t.fmq+=r.fmq;t.kg+=r.kg;if(r.prezzo>0)t.cost+=r.fmq*r.prezzo;t.warn+=r.msgs.length}));return t}

function vanoCard(c,l,v,vi){return`
  <div class="vano" data-v="${v.id}">

      ${uf('vHd_'+v.id,'Altezza destra',v.Hd,'mm','data-vf="Hd" placeholder="= sinistra"')}
      <label class="f">Quantità uguali<input class="num" id="vq_${v.id}" inputmode="numeric" data-vf="qta" value="${esc(v.qta)}"></label>
      <label class="f wide">Sistema<select id="vt_${v.id}" data-vs="sistema">${c.sistemi.map(s=>`<option value="${s.id}" ${s.id===sisOf(c,v)?.id?'selected':''}>${esc(s.nome)}</option>`).join('')}</select></label>
      <label class="f">${sisOf(c,v)?.mobili?'Ante':'Vetri'}<select id="vnn_${v.id}" data-vs="n">${nOpts(sisOf(c,v)?.schema,v.n)}</select></label>
      <label class="f">Vetro<select id="vg_${v.id}" data-vs="vetro">${vetroOpts(c,v.vetro)}</select></label>
    </div></div>
    <div class="vres" id="vr_${v.id}"></div>
    <details id="vdet_${v.id}"><summary>Misure dei vetri</summary><div id="vtb_${v.id}"></div></details>
  </div>`}
function vanoResult(c,v){
  const r=compute(v,c),box=$('vr_'+v.id),tb=$('vtb_'+v.id);if(!box)return;const th=$('vth_'+v.id);if(th)th.innerHTML=vanoThumb(r);
  if(!r.ok){box.innerHTML='<span class="note">Inserisci larghezza e altezza.</span>';tb.innerHTML='';return}
  const nb=r.msgs.filter(m=>m[0]==='bad').length,nw=r.msgs.length-nb;
  box.innerHTML=`<span class="pill ${r.s.mobili?'mob':'fix'}">${esc(r.s.nome)} · ${r.N} ${r.s.mobili?'ante':'vetri'}${r.auto?' auto':''}</span>
    <span><b>${fmt(r.mq,2)}</b> m²</span><span><b>${fmt(r.kg,0)}</b> kg</span>${r.qta>1?`<span>× ${r.qta}</span>`:''}
    ${nb?`<span class="pill b">${nb} errori</span>`:''}${nw?`<span class="pill w">${nw} avvisi</span>`:''}`;
  tb.innerHTML=r.msgs.map(([k,t])=>`<div class="msg ${k==='bad'?'bad':''}">${esc(t)}</div>`).join('')+paneTable(r);
}
function paneTable(r){
  const hc=r.flat?'<th>Altezza</th>':'<th>H sx</th><th>H dx</th><th>Lato incl.</th>';
  return`<div class="tablebox"><table><thead><tr><th class="l">N°</th><th class="l">Tipo</th><th>Larghezza</th>${hc}<th>m²</th><th>kg</th></tr></thead><tbody>`+
   r.panes.map(q=>`<tr><td class="l">${q.i}</td><td class="t l">${q.mob?'Anta mobile':'Fisso'}</td><td>${fmt(q.gw,1)}</td>`+
     (r.flat?`<td>${fmt(q.hl,1)}</td>`:`<td>${fmt(q.hl,1)}</td><td>${fmt(q.hr,1)}</td><td>${fmt(q.lato,1)}</td>`)+`<td>${fmt(q.mq,3)}</td><td>${fmt(q.kg,1)}</td></tr>`).join('')+'</tbody></table></div>';
}
function bindStruttura(c){
  const findL=el=>c.lati.find(l=>l.id===el.closest('[data-l]').dataset.l);
  const findV=el=>{const l=findL(el);return[l,l.vani.find(v=>v.id===el.closest('[data-v]').dataset.v)]};
  c.lati.forEach(l=>l.vani.forEach(v=>vanoResult(c,v)));
  const m=$('main');
  m.addEventListener('input',e=>{const t=e.target;
    if(t.dataset.lf){const l=findL(t);l[t.dataset.lf]=t.dataset.lf==='nome'?t.value:t.value;save();$('ll_'+l.id).value=fmt(latoLen(l));return}
    if(t.dataset.vf){const[l,v]=findV(t);v[t.dataset.vf]=t.value;save();if(t.dataset.vf!=='nome'){vanoResult(c,v);$('ll_'+l.id).value=fmt(latoLen(l));updTot(c)}}});
  m.addEventListener('change',e=>{const t=e.target;if(!t.dataset.vs)return;const[,v]=findV(t);v[t.dataset.vs]=t.value;
    if(t.dataset.vs==='sistema'){v.n='auto';save();viewStruttura(c);updTot(c);return}save();vanoResult(c,v);updTot(c)});
  m.querySelectorAll('[data-addvano]').forEach(b=>b.onclick=()=>{const l=c.lati.find(x=>x.id===b.dataset.addvano);const prev=l.vani[l.vani.length-1];
    l.vani.push(newVano('Vano '+(l.vani.length+1),prev?{Hs:prev.Hd||prev.Hs,Hd:prev.Hd||prev.Hs,vetro:prev.vetro,sistema:prev.sistema}:{vetro:c.vetri[0]?.id,sistema:c.sistemi[0]?.id}));save();viewStruttura(c);updTot(c)});
  m.querySelectorAll('[data-dupvano]').forEach(b=>b.onclick=()=>{const[l,v]=findV(b);const i=l.vani.indexOf(v);l.vani.splice(i+1,0,{...clone(v),id:uid(),nome:v.nome+' (copia)'});save();viewStruttura(c);updTot(c)});
  armDelete('[data-delvano]',b=>{const[l,v]=findV(b);l.vani=l.vani.filter(x=>x!==v);save();viewStruttura(c);updTot(c)});
  armDelete('[data-dellato]',b=>{c.lati=c.lati.filter(l=>l.id!==b.dataset.dellato);save();viewStruttura(c);updTot(c)});
  m.querySelectorAll('[data-up],[data-down]').forEach(b=>b.onclick=()=>{const i=+(b.dataset.up??b.dataset.down),j=b.dataset.up!=null?i-1:i+1;
    [c.lati[i],c.lati[j]]=[c.lati[j],c.lati[i]];save();viewStruttura(c)});
  $('addLato').onclick=()=>{const l=newLato('Lato '+letter(c.lati.length),{vani:[newVano('Vano 1',{vetro:c.vetri[0]?.id,sistema:c.sistemi[0]?.id})]});c.lati.push(l);save();viewStruttura(c);updTot(c);
    const el=document.querySelector(`[data-l="${l.id}"]`);if(el)el.scrollIntoView({block:'start'})};
}

/* ---------- VISTA ---------- */
function vanoThumb(r){
  if(!r.ok)return'<span class="note">Inserisci le misure</span>';
  const L=r.L,Hm=Math.max(r.Hs,r.Hd),fs=Math.max(L,Hm)/14,Y=h=>Hm-h,pad=fs*1.6;
  let g=`<svg viewBox="${-pad} ${-fs*0.6} ${L+pad*1.4} ${Hm+fs*2.4}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anteprima del vano">`;
  g+=`<polygon points="0,${Y(0)} ${L},${Y(0)} ${L},${Y(r.Hd)} 0,${Y(r.Hs)}" fill="none" stroke="var(--ink)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;
  const sc=r.s.schema==='scorrevole';
  r.panes.forEach((q,k)=>{const b=q.by,fill=sc&&k%2?'var(--glass-2)':'var(--glass)';
    g+=`<polygon points="${q.gx},${Y(b)} ${q.gx+q.gw},${Y(b)} ${q.gx+q.gw},${Y(b+q.hr)} ${q.gx},${Y(b+q.hl)}" fill="${fill}" fill-opacity="${sc?.85:1}" stroke="var(--accent)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
    g+=`<text x="${q.gx+q.gw/2}" y="${Y(b+(q.hl+q.hr)/4)}" font-size="${fs*0.8}" text-anchor="middle" dominant-baseline="middle" fill="var(--ink)" font-family="IBM Plex Mono,monospace" font-weight="600">${q.i}</text>`});
  const yb=Hm+fs*0.9;
  g+=`<path d="M0 ${yb-fs*.3}V${yb+fs*.3}M${L} ${yb-fs*.3}V${yb+fs*.3}M0 ${yb}H${L}" stroke="var(--hi)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  g+=`<text x="${L/2}" y="${yb+fs*1.15}" font-size="${fs*0.75}" text-anchor="middle" fill="var(--hi)" font-family="IBM Plex Mono,monospace">${fmt(L)}</text>`;
  const xl=-fs*0.7;g+=`<path d="M${xl-fs*.3} ${Y(0)}H${xl+fs*.3}M${xl-fs*.3} ${Y(r.Hs)}H${xl+fs*.3}M${xl} ${Y(0)}V${Y(r.Hs)}" stroke="var(--hi)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  g+=`<text x="${xl-fs*0.35}" y="${Y(r.Hs/2)}" font-size="${fs*0.75}" text-anchor="middle" fill="var(--hi)" font-family="IBM Plex Mono,monospace" transform="rotate(-90 ${xl-fs*0.35} ${Y(r.Hs/2)})">${fmt(r.Hs)}</text>`;
  return g+'</svg>';
}
function planSvg(c,sel,mini){
  let x=0,y=0,dx=0,dy=1;const segs=[];
  c.lati.forEach((l,li)=>{const len=latoLen(l)||1000;const s={l,li,x0:x,y0:y,dx,dy,len};x+=dx*len;y+=dy*len;s.x1=x;s.y1=y;segs.push(s);
    const t=(180-(num(l.angolo)||90))*Math.PI/180;[dx,dy]=[dx*Math.cos(t)+dy*Math.sin(t),-dx*Math.sin(t)+dy*Math.cos(t)]});
  if(!segs.length)return'<p class="note">Aggiungi almeno un lato.</p>';
  const xs=segs.flatMap(s=>[s.x0,s.x1]),ys=segs.flatMap(s=>[s.y0,s.y1]);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const ext=Math.max(maxX-minX,maxY-minY,1000),fs=ext/20,pad=mini?fs*1.2:fs*4.2;
  let g=`<svg viewBox="${minX-pad} ${minY-pad} ${maxX-minX+pad*2} ${maxY-minY+pad*2}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pianta della veranda">`;
  if(c.parete&&segs.length>1){const a=segs[0],b=segs[segs.length-1];
    g+=`<line x1="${b.x1}" y1="${b.y1}" x2="${a.x0}" y2="${a.y0}" stroke="var(--muted)" stroke-width="6" stroke-dasharray="10 8" vector-effect="non-scaling-stroke"/>`;
    if(!mini)g+=`<text x="${(a.x0+b.x1)/2}" y="${(a.y0+b.y1)/2-fs*0.7}" font-size="${fs*0.8}" text-anchor="middle" fill="var(--muted)" font-family="IBM Plex Mono,monospace">PARETE</text>`}
  segs.forEach(s=>{const on=s.l.id===sel,col=on?'var(--sel)':'var(--accent)';
    const nx=-s.dy,ny=s.dx; /* esterno = destra del percorso */
    g+=`<g data-lato="${s.l.id}"><line x1="${s.x0}" y1="${s.y0}" x2="${s.x1}" y2="${s.y1}" stroke="transparent" stroke-width="${fs*2.2}"/>
      <line x1="${s.x0}" y1="${s.y0}" x2="${s.x1}" y2="${s.y1}" stroke="${col}" stroke-width="${on?7:5}" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
    let acc=0;s.l.vani.forEach((v,i)=>{acc+=num(v.L)||0;if(i<s.l.vani.length-1){const px=s.x0+s.dx*acc,py=s.y0+s.dy*acc;
      g+=`<line x1="${px-nx*fs*.5}" y1="${py-ny*fs*.5}" x2="${px+nx*fs*.5}" y2="${py+ny*fs*.5}" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/>`;acc+=num(s.l.pil)||0}});
    if(mini){g+='</g>';return}
    const mx=(s.x0+s.x1)/2+nx*fs*1.9,my=(s.y0+s.y1)/2+ny*fs*1.9;
    g+=`<text x="${mx}" y="${my-fs*0.15}" font-size="${fs}" text-anchor="middle" fill="${on?'var(--sel)':'var(--ink)'}" font-family="IBM Plex Sans Condensed,sans-serif" font-weight="700">${letter(s.li)} · ${esc(s.l.nome)}</text>
      <text x="${mx}" y="${my+fs*0.95}" font-size="${fs*0.75}" text-anchor="middle" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${fmt(latoLen(s.l))} mm</text></g>`});
  return g+'</svg>';
}
function elevSvg(c,lati,multi){
  let Hm=0;lati.forEach(l=>l.vani.forEach(v=>{const a=num(v.Hs),b=isFinite(num(v.Hd))?num(v.Hd):a;if(a>0)Hm=Math.max(Hm,a,b)}));
  if(!Hm)return'<p class="note">Inserisci le misure dei vani per vedere il prospetto.</p>';
  const fs=Hm/18,gap=multi?Hm*0.35:0;let x=0,body='';
  lati.forEach((l,li)=>{const x0=x,pil=num(l.pil)||0;
    l.vani.forEach((v,vi)=>{const r=compute(v,c);const L=num(v.L);if(!(L>0))return;
      const Hs=num(v.Hs)||0,Hd=isFinite(num(v.Hd))?num(v.Hd):Hs,Y=h=>Hm-h;
      if(vi>0&&pil>0)body+=`<rect x="${x-pil}" y="${Y(Math.max(Hs,Hd))}" width="${pil}" height="${Math.max(Hs,Hd)}" fill="var(--line)"/>`;
      body+=`<polygon points="${x},${Y(0)} ${x+L},${Y(0)} ${x+L},${Y(Hd)} ${x},${Y(Hs)}" fill="none" stroke="var(--ink)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`;
      if(r.ok)r.panes.forEach((q,k)=>{const sc=r.s.schema==='scorrevole',fill=sc&&k%2?'var(--glass-2)':'var(--glass)',X=x+q.gx,b=q.by;
        body+=`<polygon points="${X},${Y(b)} ${X+q.gw},${Y(b)} ${X+q.gw},${Y(b+q.hr)} ${X},${Y(b+q.hl)}" fill="${fill}" fill-opacity="${sc?.85:1}" stroke="var(--accent)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`;
        body+=`<text x="${X+q.gw/2}" y="${Y(b+(q.hl+q.hr)/4)}" font-size="${fs*0.9}" text-anchor="middle" dominant-baseline="middle" fill="var(--ink)" font-family="IBM Plex Sans Condensed,sans-serif" font-weight="700">${q.i}</text>`});
      body+=`<text x="${x+L/2}" y="${Y(Math.max(Hs,Hd))-fs*0.55}" font-size="${fs*0.78}" text-anchor="middle" fill="var(--ink)" font-family="IBM Plex Sans,sans-serif" font-weight="600">${esc(v.nome)}</text>`;
      body+=`<text x="${x+L/2}" y="${Hm+fs*1.2}" font-size="${fs*0.72}" text-anchor="middle" fill="var(--hi)" font-family="IBM Plex Mono,monospace">${fmt(L)}</text>`;
      body+=`<text x="${x+fs*0.3}" y="${Y(Hs)+fs*1.1}" font-size="${fs*0.62}" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${fmt(Hs)}</text>`;
      if(Math.abs(Hs-Hd)>.5)body+=`<text x="${x+L-fs*0.3}" y="${Y(Hd)+fs*1.1}" font-size="${fs*0.62}" text-anchor="end" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${fmt(Hd)}</text>`;
      x+=L+pil});
    if(l.vani.length&&pil>0)x-=pil;
    if(multi){body+=`<line x1="${x0}" y1="${Hm+fs*2}" x2="${x}" y2="${Hm+fs*2}" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
      <text x="${(x0+x)/2}" y="${Hm+fs*3.3}" font-size="${fs}" text-anchor="middle" fill="var(--accent)" font-family="IBM Plex Sans Condensed,sans-serif" font-weight="700">${letter(c.lati.indexOf(l))} · ${esc(l.nome)}</text>`;x+=gap}});
  if(multi)x-=gap;
  const W=Math.max(x,1),top=fs*2,bot=multi?fs*4:fs*1.9,side=fs*0.8,vbW=W+side*2,vbH=Hm+top+bot;
  const minPx=Math.round(Math.min(4000,300*vbW/vbH));
  return`<svg viewBox="${-side} ${-top} ${vbW} ${vbH}" style="min-width:${minPx}px" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Prospetto">${body}</svg>`;
}
function viewVista(c){
  if(!c.lati.find(l=>l.id===S.ui.lato))S.ui.lato=c.lati[0]?.id;
  const sel=c.lati.find(l=>l.id===S.ui.lato);
  setMain(),$('main').innerHTML=`
  <section class="card"><div class="row between"><h2>Pianta</h2><span class="note">Tocca un lato per vederne il prospetto</span></div>
    <div class="draw plan">${planSvg(c,S.ui.sviluppo?null:S.ui.lato)}</div></section>
  <section class="card">
    <div class="seg" id="latoSeg">${c.lati.map((l,i)=>`<button data-sl="${l.id}" aria-pressed="${!S.ui.sviluppo&&l.id===S.ui.lato}">${letter(i)} · ${esc(l.nome)}</button>`).join('')}
      <button data-sl="__all" aria-pressed="${!!S.ui.sviluppo}">Tutti i lati</button></div>
    <h2>${S.ui.sviluppo?'Sviluppo di tutti i lati, visti dall\'esterno':sel?`Lato ${letter(c.lati.indexOf(sel))} · ${esc(sel.nome)}, visto dall'esterno`:''}</h2>

  </section>`;
  document.querySelectorAll('[data-lato]').forEach(g=>g.onclick=()=>{S.ui.lato=g.dataset.lato;S.ui.sviluppo=false;save();viewVista(c)});

}
function latoDetail(c,l){return l.vani.map(v=>{const r=compute(v,c);return`<div class="card" style="padding:12px;gap:8px"><div class="row between"><h3>${esc(v.nome)}</h3>

      const g=byG[r.gl.id]||(byG[r.gl.id]={nome:r.gl.nome,n:0,mq:0,fmq:0,kg:0,pr:r.prezzo});g.n+=r.N*r.qta;g.mq+=r.mq;g.fmq+=r.fmq;g.kg+=r.kg;

        txt+=`  ${q.i}) ${fmt(q.gw,1)} × ${r.flat?fmt(q.hl,1):fmt(q.hl,1)+'/'+fmt(q.hr,1)} mm  ×${r.qta}  ${fmt(q.mq*r.qta,3)} m²\n`})})});
  txt+=`\nTOTALE: ${t.vetri} vetri · ${fmt(t.mq,2)} m² reali · ${fmt(t.fmq,2)} m² fatturati · ${fmt(t.kg,0)} kg`;
  const gl=Object.values(byG);

    <textarea id="distTa" hidden></textarea></section>
  <section class="card"><h2>Ordine per tipo di vetro</h2>
    <div class="tablebox"><table><thead><tr><th class="l">Vetro</th><th>Pezzi</th><th>m² reali</th><th>m² fatt.</th><th>kg</th><th>€</th></tr></thead><tbody>
    ${gl.map(g=>`<tr><td class="t l">${esc(g.nome)}</td><td>${g.n}</td><td>${fmt(g.mq,2)}</td><td>${fmt(g.fmq,2)}</td><td>${fmt(g.kg,0)}</td><td>${g.pr>0?fmt(g.fmq*g.pr,2):'–'}</td></tr>`).join('')}</tbody></table></div></section>
  <section class="card"><h2>Distinta vetri per lato</h2>
    <div class="tablebox"><table><thead><tr><th class="l">Vano</th><th class="l">N°</th><th>Larghezza</th><th>Altezza</th><th>Pz</th><th>m²</th><th>kg</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
  $('copyAll').onclick=()=>{const ta=$('distTa');ta.hidden=false;copy(txt,ta)};
}

/* ---------- PARAMETRI ---------- */
function sisCard(c,s,open){
  const used=c.lati.reduce((a,l)=>a+l.vani.filter(v=>sisOf(c,v)===s).length,0),pr=PRESETS.find(x=>x.key===s.preset);
  return`<section class="card" data-s="${s.id}"><details ${open?'open':''}><summary><span class="sis-t">${esc(s.nome)}</span>
    <span class="note">${s.mobili?'Mobile':'Fissa'} · ${s.schema==='scorrevole'?'ante sovrapposte':'vetri affiancati'} · usato da ${used} ${used===1?'vano':'vani'}</span></summary>
    <div class="sis-body">
    ${s.note?`<p class="note">${esc(s.note)}</p>`:''}
    <div class="fields">
      <label class="f wide">Nome<input id="sn_${s.id}" data-sf="nome" value="${esc(s.nome)}"></label>
      <label class="f wide">Come si dividono i vetri<select id="ss_${s.id}" data-sf="schema">${Object.entries(SCHEMI).map(([k,t])=>`<option value="${k}" ${s.schema===k?'selected':''}>${t}</option>`).join('')}</select></label>
      <label class="f">Vetri<select id="sm_${s.id}" data-sf="mobili"><option value="1" ${s.mobili?'selected':''}>Mobili</option><option value="0" ${s.mobili?'':'selected'}>Fissi</option></select></label>
    </div>
    ${SIS_FIELDS.map(gr=>{const fs=gr.f.filter(x=>!x[4]||x[4]===s.schema);return fs.length?`<h3>${gr.t}</h3><div class="fields">`+
      fs.map(([k,l,u,h])=>`<label class="f">${l}<div class="unit"><input class="num" id="p_${s.id}_${k}" data-k="${k}" inputmode="decimal" value="${s.p[k]??''}"><span>${u}</span></div>${h?`<span class="hint">${h}</span>`:''}</label>`).join('')+'</div>':''}).join('')}
    <div class="row"><button class="btn sm" data-sdup="${s.id}">Duplica</button>${pr?`<button class="btn sm" data-sreset="${s.id}">Ripristina valori preimpostati</button>`:''}<button class="btn sm danger" data-sdel="${s.id}">Elimina sistema</button></div>
    </div></details></section>`}
function viewParametri(c,openId){
  const p=c.p;
  setMain(),$('main').innerHTML=`
  <section class="card"><h2>Dati del cantiere</h2>
    <div class="fields"><label class="f">Nome<input id="cn" value="${esc(c.nome)}"></label><label class="f">Indirizzo<input id="ci" value="${esc(c.indirizzo)}"></label></div>
    <label class="f">Note<textarea id="cno" rows="2">${esc(c.note)}</textarea></label>
    <label class="chk"><input type="checkbox" id="cpar" ${c.parete?'checked':''}> Veranda addossata a una parete (chiude la pianta tra ultimo e primo lato)</label>
    <div class="row"><button class="btn primary" id="expC">Esporta cantiere</button><button class="btn" id="dupC">Duplica cantiere</button><button class="btn danger" id="delC">Elimina cantiere</button></div></section>
  <section class="card"><h2>Sistemi di questo cantiere</h2>
    <p class="banner">Le preimpostazioni sono valori indicativi ricavati da schede tecniche pubbliche e misure tipiche del settore, non da un produttore preciso. Prima di ordinare i vetri verificale su un lavoro già fatto o sulla scheda del tuo sistema. Modificarle qui vale solo per «${esc(c.nome)}».</p>
    <div class="fields"><label class="f wide">Aggiungi una preimpostazione<select id="addPre">${PRESETS.map(x=>`<option value="${x.key}">${esc(x.nome)}</option>`).join('')}</select></label></div>
    <div class="row"><button class="btn primary" id="addPreBtn">Aggiungi sistema</button></div>
    <div class="fields"><label class="f wide">Modello<select id="modSel">${S.modelli.map(m=>`<option value="${m.id}">${esc(m.nome)}</option>`).join('')}</select></label></div>
    <div class="row"><button class="btn" id="loadMod">Carica sistemi dal modello</button><button class="btn" id="saveMod">Salva come modello</button></div></section>
  ${c.sistemi.map(s=>sisCard(c,s,s.id===openId)).join('')}
  <section class="card"><h2>Fatturazione</h2><div class="fields">
    ${FATT_FIELDS.map(([k,l,u,h])=>`<label class="f">${l}<div class="unit"><input class="num" id="f_${k}" data-fk="${k}" inputmode="decimal" value="${p[k]??''}"><span>${u}</span></div>${h?`<span class="hint">${h}</span>`:''}</label>`).join('')}</div></section>
  <section class="card"><h2>Vetri di questo cantiere</h2>
    <p class="note">Peso indicativo circa 2,5 kg/m² per mm di spessore. Il prezzo è facoltativo.</p>
    <div class="tablebox"><table class="vtab"><thead><tr><th class="l">Nome</th><th>Spessore mm</th><th>kg/m²</th><th>€/m²</th><th></th></tr></thead><tbody>
    ${c.vetri.map(v=>`<tr data-g="${v.id}"><td><input id="gn_${v.id}" data-f="nome" value="${esc(v.nome)}"></td><td><input class="num" id="gs_${v.id}" data-f="sp" inputmode="decimal" value="${v.sp}"></td>
      <td><input class="num" id="gk_${v.id}" data-f="kg" inputmode="decimal" value="${v.kg}"></td><td><input class="num" id="gp_${v.id}" data-f="prezzo" inputmode="decimal" value="${v.prezzo??''}" placeholder="–"></td>
      <td><button class="btn danger sm" data-delg="${v.id}" aria-label="Elimina vetro">✕</button></td></tr>`).join('')}</tbody></table></div>
    <div class="row"><button class="btn" id="addG">Aggiungi vetro</button></div></section>`;
  const findS=el=>c.sistemi.find(s=>s.id===el.closest('[data-s]').dataset.s);
  $('cn').oninput=e=>{c.nome=e.target.value||'Senza nome';save();document.querySelector('h1').textContent=c.nome};
  $('ci').oninput=e=>{c.indirizzo=e.target.value;save();updTot(c)};
  $('cno').oninput=e=>{c.note=e.target.value;save()};
  $('cpar').onchange=e=>{c.parete=e.target.checked;save()};
  document.querySelectorAll('[data-s] [data-k]').forEach(i=>i.addEventListener('input',e=>{const n=num(e.target.value);findS(e.target).p[e.target.dataset.k]=isFinite(n)?n:0;save();updTot(c)}));
  document.querySelectorAll('[data-sf="nome"]').forEach(i=>i.addEventListener('input',e=>{const s=findS(e.target);s.nome=e.target.value||'Sistema';save();e.target.closest('details').querySelector('.sis-t').textContent=s.nome}));
  document.querySelectorAll('select[data-sf]').forEach(i=>i.addEventListener('change',e=>{const s=findS(e.target);
    if(e.target.dataset.sf==='mobili')s.mobili=e.target.value==='1';else s.schema=e.target.value;save();viewParametri(c,s.id);updTot(c)}));
  document.querySelectorAll('[data-fk]').forEach(i=>i.addEventListener('input',e=>{const n=num(e.target.value);c.p[e.target.dataset.fk]=isFinite(n)?n:0;save();updTot(c)}));
  $('addPreBtn').onclick=()=>{const x=PRESETS.find(k=>k.key===$('addPre').value);if(!x)return;const s=sisDaPreset(x);c.sistemi.push(s);save();viewParametri(c,s.id);toast('Sistema aggiunto')};
  document.querySelectorAll('[data-sdup]').forEach(b=>b.onclick=()=>{const s=findS(b),n={...clone(s),id:uid(),nome:s.nome+' (copia)'};c.sistemi.splice(c.sistemi.indexOf(s)+1,0,n);save();viewParametri(c,n.id)});
  armDelete('[data-sreset]',b=>{const s=findS(b),x=PRESETS.find(k=>k.key===s.preset);if(!x)return;s.p={...DEF_SP,...x.p};s.schema=x.schema;s.mobili=x.mobili;save();viewParametri(c,s.id);updTot(c);toast('Valori ripristinati')});
  armDelete('[data-sdel]',b=>{const s=findS(b);const used=c.lati.reduce((a,l)=>a+l.vani.filter(v=>sisOf(c,v)===s).length,0);
    if(c.sistemi.length<2){toast('Serve almeno un sistema');return}
    if(used){toast(`Usato da ${used} ${used===1?'vano':'vani'}: cambia prima il sistema di quei vani`);return}
    c.sistemi=c.sistemi.filter(x=>x!==s);save();viewParametri(c)});
  $('loadMod').onclick=()=>{const m=S.modelli.find(x=>x.id===$('modSel').value);if(!m)return;
    const nuovi=clone(m.sistemi).map(s=>({...s,id:uid()}));
    c.lati.forEach(l=>l.vani.forEach(v=>{const old=sisOf(c,v);const n=nuovi.find(x=>old&&((x.preset&&x.preset===old.preset)||x.nome===old.nome))||nuovi[0];v.sistema=n.id}));
    c.sistemi=nuovi;c.p={...DEF_FATT,...m.fatt};save();viewParametri(c);updTot(c);toast('Sistemi caricati dal modello')};
  $('saveMod').onclick=()=>{S.modelli.push({id:uid(),nome:'Da '+c.nome,sistemi:clone(c.sistemi),fatt:{...c.p}});save();toast('Salvato come modello «Da '+c.nome+'»')};
  $('expC').onclick=()=>shareFile('cantiere-'+fileName(c.nome)+'.json',{v:2,tipo:'cantiere',cantiere:c});
  $('dupC').onclick=()=>{const n={...clone(c),id:uid(),nome:c.nome+' (copia)'};S.cantieri.unshift(n);go(n.id,'struttura');toast('Cantiere duplicato')};
  armDelete('#delC',()=>{S.cantieri=S.cantieri.filter(x=>x!==c);go(null);toast('Cantiere eliminato')});
  document.querySelectorAll('[data-g] input').forEach(i=>i.addEventListener('input',e=>{const v=c.vetri.find(x=>x.id===e.target.closest('tr').dataset.g),f=e.target.dataset.f;
    v[f]=f==='nome'?e.target.value:e.target.value.replace(',','.');
    if(f==='sp'){const sp=num(e.target.value);if(sp>0){v.kg=+(sp*2.5).toFixed(1);$('gk_'+v.id).value=v.kg}}save();updTot(c)}));
  armDelete('[data-delg]',b=>{if(c.vetri.length<2){toast('Serve almeno un vetro');return}c.vetri=c.vetri.filter(v=>v.id!==b.dataset.delg);save();viewParametri(c);updTot(c)});
  $('addG').onclick=()=>{c.vetri.push({id:uid(),nome:'Nuovo vetro',sp:8,kg:20,prezzo:''});save();viewParametri(c)};
}

/* ---------- STRUMENTI ---------- */
function geoRows(L,Hs,Hd){const dh=Hd-Hs;
  return[['Lato superiore inclinato',fmt(Math.hypot(L,dh),1)+' mm'],['Differenza altezze',fmt(Math.abs(dh),1)+' mm'],
   ['Pendenza',fmt(Math.abs(dh)/L*100,2)+' %'],['Angolo',fmt(Math.atan2(Math.abs(dh),L)*180/Math.PI,2)+'°'],
   ['Diagonale basso sx → alto dx',fmt(Math.hypot(L,Hd),1)+' mm'],['Diagonale basso dx → alto sx',fmt(Math.hypot(L,Hs),1)+' mm'],
   ['Superficie vano',fmt(L*(Hs+Hd)/2/1e6,3)+' m²']]}
const kv=rows=>rows.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('');
function viewStrumenti(c){
  const opts=c.lati.flatMap((l,li)=>l.vani.map(v=>`<option value="${v.id}">${letter(li)} · ${esc(l.nome)} – ${esc(v.nome)}</option>`)).join('');
  setMain(),$('main').innerHTML=`<div class="grid two">
  <section class="card"><h2>Lato inclinato e diagonali</h2>
    <p class="note">Base e due altezze danno lato inclinato, pendenza e diagonali. Puoi partire da un vano del cantiere.</p>
    <div class="row"><select id="srcV" style="flex:1"><option value="">Scegli un vano…</option>${opts}</select></div>
    <div class="fields">${uf('m1L','Base','','mm')}${uf('m1Hs','Altezza sinistra','','mm')}${uf('m1Hd','Altezza destra','','mm')}</div>
    <dl class="kv" id="m1out"></dl></section>
  <section class="card"><h2>Triangolo rettangolo</h2><p class="note">Inserisci due misure e lascia vuota quella che manca.</p>
    <div class="fields">${uf('m2a','Base','','mm')}${uf('m2b','Altezza','','mm')}${uf('m2c','Diagonale','','mm')}</div><dl class="kv" id="m2out"></dl></section>
  <section class="card"><h2>Verifica squadra</h2><p class="note">Se le due diagonali del vano sono uguali, il vano è in squadra.</p>
    <div class="fields">${uf('m3L','Larghezza','','mm')}${uf('m3H','Altezza','','mm')}${uf('m3d1','Diagonale 1','','mm')}${uf('m3d2','Diagonale 2','','mm')}</div><dl class="kv" id="m3out"></dl></section>
  <section class="card"><h2>Angolo tra due lati</h2><p class="note">Misura un tratto lungo ciascun lato a partire dall'angolo e la distanza tra i due punti: ottieni l'angolo reale da inserire in Struttura.</p>
    <div class="fields">${uf('m4a','Tratto sul lato 1','','mm')}${uf('m4b','Tratto sul lato 2','','mm')}${uf('m4c','Distanza tra i punti','','mm')}</div><dl class="kv" id="m4out"></dl></section></div>`;
  const g=k=>num($(k).value);
  function run(){
    const L=g('m1L'),a=g('m1Hs'),b=isFinite(g('m1Hd'))?g('m1Hd'):g('m1Hs');
    $('m1out').innerHTML=(L>0&&a>0&&b>0)?kv(geoRows(L,a,b)):'<dt>Inserisci base e altezze</dt><dd></dd>';
    const x=g('m2a'),y=g('m2b'),d=g('m2c');let r;
    if(x>0&&y>0&&!(d>0))r=[['Diagonale',fmt(Math.hypot(x,y),1)+' mm'],['Angolo alla base',fmt(Math.atan2(y,x)*180/Math.PI,2)+'°']];
    else if(x>0&&d>0&&!(y>0))r=d>x?[['Altezza',fmt(Math.sqrt(d*d-x*x),1)+' mm']]:[['La diagonale deve superare la base','']];
    else if(y>0&&d>0&&!(x>0))r=d>y?[['Base',fmt(Math.sqrt(d*d-y*y),1)+' mm']]:[['La diagonale deve superare l\'altezza','']];
    else if(x>0&&y>0&&d>0)r=[['Diagonale teorica',fmt(Math.hypot(x,y),1)+' mm'],['Differenza con la tua',fmt(d-Math.hypot(x,y),1)+' mm']];
    else r=[['Inserisci due misure su tre','']];
    $('m2out').innerHTML=kv(r);
    const W=g('m3L'),H=g('m3H'),d1=g('m3d1'),d2=g('m3d2'),o=[];
    if(W>0&&H>0)o.push(['Diagonale teorica',fmt(Math.hypot(W,H),1)+' mm']);
    if(d1>0&&d2>0){const dd=Math.abs(d1-d2);o.push(['Differenza tra le diagonali',fmt(dd,1)+' mm'],['Esito',dd<=2?'In squadra':dd<=5?'Leggermente fuori squadra':'Fuori squadra'])}
    $('m3out').innerHTML=o.length?kv(o):'<dt>Inserisci le misure</dt><dd></dd>';
    const A=g('m4a'),B=g('m4b'),D=g('m4c');
    if(A>0&&B>0&&D>0){const cs=(A*A+B*B-D*D)/(2*A*B);$('m4out').innerHTML=Math.abs(cs)<=1?kv([['Angolo',fmt(Math.acos(cs)*180/Math.PI,1)+'°']]):kv([['Misure non compatibili tra loro','']])}
    else $('m4out').innerHTML='<dt>Inserisci le tre misure</dt><dd></dd>';
  }
  $('main').addEventListener('input',run);
  $('srcV').onchange=e=>{const v=c.lati.flatMap(l=>l.vani).find(x=>x.id===e.target.value);if(!v)return;$('m1L').value=v.L;$('m1Hs').value=v.Hs;$('m1Hd').value=v.Hd||v.Hs;run()};
  run();
}

render();
paintStatus();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})();
</script>
