<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d7480">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Calcolo Vetrate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: elenco cantieri → cantiere con schede (Struttura, Vista, Riepilogo, Parametri, Strumenti); una colonna su telefono */
:root{
  --bg:#eef3f4; --surface:#ffffff; --ink:#15232a; --muted:#5a6b73; --line:#d2dde1;
  --accent:#0d7480; --accent-ink:#ffffff; --glass:#cfe6e9; --glass-2:#b3d8dd; --sel:#d9822b;
  --warn:#a85600; --bad:#b3261e; --ok:#2f7a3c;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e161a; --surface:#152128; --ink:#e3edf0; --muted:#92a5ad; --line:#2a3a42;
  --accent:#4fc2cc; --accent-ink:#06262a; --glass:#1d4549; --glass-2:#27595e; --sel:#f0a54a;
  --warn:#f0a54a; --bad:#ff8a80; --ok:#7fcf8a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161a; --surface:#152128; --ink:#e3edf0; --muted:#92a5ad; --line:#2a3a42;
  --accent:#4fc2cc; --accent-ink:#06262a; --glass:#1d4549; --glass-2:#27595e; --sel:#f0a54a;
  --warn:#f0a54a; --bad:#ff8a80; --ok:#7fcf8a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .titles{min-width:0;flex:1}
h1{font-family:var(--f-display);font-weight:700;font-size:1.6rem;margin:0;line-height:1.05;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.back{flex:none;font:600 1.2rem var(--f-body);width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;font:600 .9rem var(--f-body);border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:7px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
main{padding-top:16px;display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px}
@media (min-width:860px){.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
h2{font-family:var(--f-display);font-weight:600;font-size:1.3rem;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:.95rem;margin:0;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);min-width:0}
label.f .hint{font-size:.74rem;opacity:.85}
label.chk{display:flex;gap:8px;align-items:center;font-size:.9rem}
label.chk input{width:auto}
input,select,textarea{font:500 1rem var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
input.num,textarea.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
input.name{font:600 1.1rem var(--f-display);letter-spacing:.01em;background:transparent;border-color:transparent;padding:4px 6px}
input.name:hover{border-color:var(--line)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.unit{position:relative}
.unit input{padding-right:38px}
.unit span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:.74rem var(--f-mono);color:var(--muted);pointer-events:none}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:600 .88rem var(--f-body);border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.btn{font:600 .88rem var(--f-body);border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:.8rem}
.btn[data-armed]{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg)}
.stat b{display:block;font:600 1.35rem var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;background:var(--bg)}
td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.l{text-align:left}
td.t{font-family:var(--f-body)}
tr.grp td{background:var(--bg);font:600 .82rem var(--f-body);color:var(--muted);text-align:left;text-transform:uppercase;letter-spacing:.05em}
tfoot td{font-weight:600;border-bottom:0}
.pill{display:inline-block;font:600 .72rem var(--f-body);padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.pill.mob{color:var(--accent)} .pill.fix{color:var(--muted)} .pill.w{color:var(--warn)} .pill.b{color:var(--bad)}
.msg{font-size:.85rem;padding:7px 10px;border-radius:8px;border-left:3px solid var(--warn);background:var(--bg)}
.msg.bad{border-color:var(--bad)} .msg.ok{border-color:var(--ok)}
.note{font-size:.85rem;color:var(--muted);margin:0;max-width:65ch}
.banner{font-size:.86rem;padding:10px 12px;border-radius:8px;border:1px dashed var(--warn)}
.lato{border-left:4px solid var(--accent)}
.lato-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lato-head .tag{font:700 .8rem var(--f-mono);color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:3px 7px}
.lato-head input.name{flex:1;min-width:140px}
.vani{display:flex;flex-direction:column;gap:12px}
.vano{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.vano input,.vano select{background:var(--surface)}
.vano-head{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vano-head input.name{flex:1;min-width:120px;font-size:1rem}
.vres{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.86rem}
.vres b{font-family:var(--f-mono);font-weight:500}
details summary{cursor:pointer;font-size:.86rem;font-weight:600;color:var(--accent)}
details[open] summary{margin-bottom:8px}
.draw{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px;overflow-x:auto}
.draw svg{display:block;width:100%;height:auto}
.plan svg{max-height:380px}
.plan [data-lato]{cursor:pointer}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:.9rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.clist{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.ccard{text-align:left;cursor:pointer;font:inherit;color:inherit}
.ccard:hover{border-color:var(--accent)}
.ccard .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.ccard .meta b{font-family:var(--f-mono);color:var(--ink);font-weight:500}
.vtab td input{padding:6px 8px;font-size:.88rem}
.vtab td{padding:4px 6px}
.vtab td:first-child input{min-width:150px}
.vtab td input.num{width:84px}
.sync{font-size:.74rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--ok)} .sync.w::before{background:var(--warn)} .sync.b::before{background:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.9rem;z-index:20}
@media (prefers-reduced-motion:no-preference){.tabs button,.seg button,.btn{transition:background .15s,color .15s}}
</style>

</head>
<body>
<div class="wrap">
<header id="hdr"></header>
<main id="main"></main>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const num=v=>{if(v==null)return NaN;const s=String(v).trim().replace(/\s/g,'').replace(',','.');return s===''?NaN:parseFloat(s)};
const fmt=(n,d=0)=>isFinite(n)?n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d}):'–';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const letter=i=>String.fromCharCode(65+(i%26));
const clone=o=>JSON.parse(JSON.stringify(o));

const PARAM_GROUPS=[
 {t:'Posa',d:'Valido per tutti i vani del cantiere.',f:[['gp','Gioco di posa per lato','mm','Spazio tra muro e telaio su ogni lato']]},
 {t:'Scorrevole · telaio',f:[
  ['sTelL','Deduzione telaio in larghezza','mm','Totale sx + dx, da telaio esterno a luce di scorrimento'],
  ['sTelH','Deduzione telaio in altezza','mm','Totale sopra + sotto, da telaio esterno ad altezza anta'],
  ['binari','Numero di binari','n','Solo informativo per ora']]},
 {t:'Scorrevole · ante e vetro',f:[
  ['sorm','Sormonto tra ante','mm','Quanto si sovrappongono due ante vicine'],
  ['sAntaL','Deduzione vetro in larghezza','mm','Totale, da larghezza anta a larghezza vetro'],
  ['sAntaH','Deduzione vetro in altezza','mm','Totale, da altezza anta ad altezza vetro'],
  ['minAnte','Numero minimo di ante','n','Usato dalla divisione automatica']]},
 {t:'Fissa',f:[
  ['fTelL','Deduzione telaio in larghezza','mm','Totale sx + dx, da telaio esterno a luce'],
  ['fTelH','Deduzione telaio in altezza','mm','Totale sopra + sotto'],
  ['mont','Larghezza montante intermedio','mm','Tra un vetro fisso e l\'altro'],
  ['fVetL','Gioco vetro in larghezza','mm','Totale per vetro, da luce a vetro'],
  ['fVetH','Gioco vetro in altezza','mm','Totale per vetro']]},
 {t:'Limiti vetro',d:'La divisione automatica sceglie il numero di vetri per restare entro questi limiti.',f:[
  ['maxW','Larghezza massima vetro','mm',''],['maxH','Altezza massima vetro','mm',''],
  ['maxKg','Peso massimo per vetro','kg',''],['maxN','Numero massimo di vetri per vano','n','']]},
 {t:'Fatturazione',f:[
  ['minMq','Superficie minima per vetro','m²','Sotto questa soglia si fattura il minimo'],
  ['arrot','Arrotondamento lati','mm','Multiplo per eccesso, 0 = nessuno'],
  ['sfrido','Sfrido / scarto','%','Aggiunto ai m² da ordinare']]}
];
const DEF_P={gp:5,sTelL:40,sTelH:60,binari:2,sorm:40,sAntaL:70,sAntaH:90,minAnte:2,
  fTelL:50,fTelH:50,mont:50,fVetL:10,fVetH:10,maxW:1500,maxH:3000,maxKg:120,maxN:8,minMq:0.5,arrot:0,sfrido:0};
const defVetri=()=>[['Temperato 8 mm',8,20],['Temperato 10 mm',10,25],['Stratificato 33.1',6.4,16],['Stratificato 44.2',8.8,22],
 ['Stratificato 55.2',10.8,27],['Vetrocamera 4/16/4',8,20],['Vetrocamera 33.1/16/33.1',12.8,32]].map(([nome,sp,kg])=>({id:uid(),nome,sp,kg,prezzo:''}));

function newVano(nome,o={}){return{id:uid(),nome,L:'',Hs:'',Hd:'',qta:'1',tipo:'fissa',n:'auto',vetro:'',...o}}
function newLato(nome,o={}){return{id:uid(),nome,angolo:90,pil:0,vani:[],...o}}
function newCantiere(nome,modello,catalogo){return{id:uid(),nome,indirizzo:'',note:'',parete:true,creato:new Date().toISOString().slice(0,10),
  p:{...DEF_P,...(modello?modello.p:{})},vetri:clone(catalogo),lati:[]}}
function esempio(modello,catalogo){
  const c=newCantiere('Veranda di esempio',modello,catalogo);
  c.note='Misure di esempio: sostituiscile con quelle reali o crea un nuovo cantiere.';
  const v=c.vetri.find(x=>x.nome.includes('44.2'))||c.vetri[0];
  c.lati=[
    newLato('Fianco sinistro',{vani:[newVano('Vano 1',{L:'2500',Hs:'2600',Hd:'2300',vetro:v.id})]}),
    newLato('Fronte',{pil:80,vani:[newVano('Vano scorrevole',{L:'3000',Hs:'2300',Hd:'2300',tipo:'scorrevole',vetro:v.id}),newVano('Vano fisso',{L:'1500',Hs:'2300',Hd:'2300',vetro:v.id})]}),
    newLato('Fianco destro',{vani:[newVano('Vano 1',{L:'2500',Hs:'2300',Hd:'2600',vetro:v.id})]})];
  return c;
}

/* ---------- stato ---------- */
const KEY='vetrate.v2';
let S;
function fresh(){
  let modelli=[{id:uid(),nome:'Modello esempio',p:{...DEF_P}}],catalogo=defVetri();
  try{const o=JSON.parse(localStorage.getItem('vetrate.v1')||'null');
    if(o&&o.sistemi&&o.sistemi.length){modelli=o.sistemi.map(s=>({id:s.id,nome:s.nome,p:{...DEF_P,...s.p}}));if(o.vetri&&o.vetri.length)catalogo=o.vetri}}catch(e){}
  return{v:2,modelli,catalogo,cantieri:[esempio(modelli[0],catalogo)],ui:{c:null,tab:'struttura',lato:null,sviluppo:false}};
}
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&o.v===2&&o.cantieri)return o}catch(e){}return fresh()}
/* salvataggio sul dispositivo */
const cloud={state:'local'};
function setStatus(s){cloud.state=s;paintStatus()}
function paintStatus(){const e=$('sync');if(!e)return;const ok=cloud.state!=='err';e.textContent=ok?'Salvato su questo dispositivo':'Memoria del dispositivo non disponibile';e.className='sync '+(ok?'ok':'b')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));if(cloud.state==='err')setStatus('local')}catch(e){setStatus('err')}}
function fileName(t){return t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'vetrate'}
async function shareFile(name,obj){
  const blob=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}),file=new File([blob],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('File salvato')}
function readFile(input,fn){const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{fn(JSON.parse(r.result))}catch(e){toast('File non valido')}input.value=''};r.readAsText(f)}
function importCantiere(c){if(!c||!c.lati||!c.p){toast('Il file non contiene un cantiere');return}
  c=clone(c);c.p={...DEF_P,...c.p};if(S.cantieri.some(x=>x.id===c.id)){c.id=uid();c.nome+=' (importato)'}
  S.cantieri.unshift(c);save();toast('Cantiere importato: '+c.nome);return c}
S=load();S.ui=S.ui||{};
function setMain(){const o=$('main'),n=o.cloneNode(false);o.replaceWith(n)}
const C=()=>S.cantieri.find(c=>c.id===S.ui.c);

function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
async function copy(text,ta){try{await navigator.clipboard.writeText(text);toast('Copiato')}catch(e){if(ta){ta.value=text;ta.focus();ta.select()}toast('Seleziona e copia il testo a mano')}}

/* ---------- calcolo ---------- */
function layout(N,L,Hs,Hd,p,tipo,kgm){
  const H=x=>Hs+(Hd-Hs)*x/L,panes=[];
  if(tipo==='scorrevole'){
    const luce=L-2*p.gp-p.sTelL,aW=(luce+(N-1)*p.sorm)/N,gw=aW-p.sAntaL,ded=2*p.gp+p.sTelH+p.sAntaH;
    for(let i=0;i<N;i++){const x0=p.gp+p.sTelL/2+i*(aW-p.sorm),gx=x0+p.sAntaL/2;
      panes.push({i:i+1,mob:true,gx,gw,hl:H(gx)-ded,hr:H(gx+gw)-ded,by:p.gp+p.sTelH/2+p.sAntaH/2})}
  }else{
    const luce=L-2*p.gp-p.fTelL,mW=(luce-(N-1)*p.mont)/N,gw=mW-p.fVetL,ded=2*p.gp+p.fTelH+p.fVetH;
    for(let i=0;i<N;i++){const x0=p.gp+p.fTelL/2+i*(mW+p.mont),gx=x0+p.fVetL/2;
      panes.push({i:i+1,mob:false,gx,gw,hl:H(gx)-ded,hr:H(gx+gw)-ded,by:p.gp+p.fTelH/2+p.fVetH/2})}
  }
  const r=v=>p.arrot>0?Math.ceil(v/p.arrot)*p.arrot:v;
  panes.forEach(q=>{q.mq=q.gw*(q.hl+q.hr)/2/1e6;q.kg=q.mq*kgm;
    q.fmq=Math.max(p.minMq||0,r(q.gw)*r(Math.max(q.hl,q.hr))/1e6);q.lato=Math.hypot(q.gw,q.hr-q.hl)});
  return panes;
}
function problems(panes,p){const m=[];
  panes.forEach(q=>{
    if(!(q.gw>0&&q.hl>0&&q.hr>0))m.push(['bad',`Vetro ${q.i}: misure nulle o negative, controlla vano e detrazioni.`]);
    else{if(q.gw>p.maxW)m.push(['warn',`Vetro ${q.i}: larghezza ${fmt(q.gw)} mm oltre il massimo di ${fmt(p.maxW)} mm.`]);
      if(Math.max(q.hl,q.hr)>p.maxH)m.push(['warn',`Vetro ${q.i}: altezza ${fmt(Math.max(q.hl,q.hr))} mm oltre il massimo di ${fmt(p.maxH)} mm.`]);
      if(q.kg>p.maxKg)m.push(['warn',`Vetro ${q.i}: peso ${fmt(q.kg,1)} kg oltre il massimo di ${fmt(p.maxKg)} kg.`])}});
  return m}
function compute(v,c){
  const L=num(v.L),Hs=num(v.Hs);let Hd=num(v.Hd);if(!isFinite(Hd))Hd=Hs;
  if(!(L>0&&Hs>0&&Hd>0))return{ok:false};
  const p=c.p,gl=c.vetri.find(x=>x.id===v.vetro)||c.vetri[0]||{nome:'—',kg:0},kgm=num(gl.kg)||0,qta=Math.max(1,Math.round(num(v.qta))||1);
  let N,panes,auto=v.n==='auto';
  if(auto){const lo=v.tipo==='scorrevole'?Math.max(2,p.minAnte|0):1,hi=Math.max(lo,p.maxN|0);
    for(N=lo;N<=hi;N++){panes=layout(N,L,Hs,Hd,p,v.tipo,kgm);if(!problems(panes,p).length)break}
    if(N>hi){N=hi;panes=layout(N,L,Hs,Hd,p,v.tipo,kgm)}}
  else{N=+v.n;panes=layout(N,L,Hs,Hd,p,v.tipo,kgm)}
  const sum=k=>panes.reduce((a,q)=>a+q[k],0);
  return{ok:true,L,Hs,Hd,N,auto,panes,qta,gl,flat:Math.abs(Hs-Hd)<.5,msgs:problems(panes,p),
    mq:sum('mq')*qta,fmq:sum('fmq')*qta*(1+(p.sfrido||0)/100),kg:sum('kg')*qta,prezzo:num(gl.prezzo)};
}
const latoLen=(l)=>{const ws=l.vani.map(v=>num(v.L)).filter(x=>x>0);return ws.reduce((a,b)=>a+b,0)+Math.max(0,ws.length-1)*(num(l.pil)||0)};
function totals(c){const t={vetri:0,mq:0,fmq:0,kg:0,cost:0,vani:0,warn:0};
  c.lati.forEach(l=>l.vani.forEach(v=>{t.vani++;const r=compute(v,c);if(!r.ok)return;
    t.vetri+=r.N*r.qta;t.mq+=r.mq;t.fmq+=r.fmq;t.kg+=r.kg;if(r.prezzo>0)t.cost+=r.fmq*r.prezzo;t.warn+=r.msgs.length}));return t}

function armDelete(sel,fn){document.querySelectorAll(sel).forEach(b=>{const label=b.textContent;
  b.onclick=()=>{if(!b.hasAttribute('data-armed')){document.querySelectorAll('[data-armed]').forEach(x=>{x.removeAttribute('data-armed');x.textContent=x.dataset.label||x.textContent});

    fn(b)}})}

function renderCantiere(c){

function updTot(c){const t=totals(c),e=$('cTot');if(e)e.textContent=`${c.indirizzo?c.indirizzo+' · ':''}${c.lati.length} lati · ${t.vani} vani · ${t.vetri} vetri · ${fmt(t.mq,2)} m²`}

function nOpts(tipo,val){const lo=tipo==='scorrevole'?2:1;return'<option value="auto">Automatico</option>'+Array.from({length:9-lo},(_,i)=>i+lo).map(n=>`<option value="${n}" ${String(val)===String(n)?'selected':''}>${n}</option>`).join('')}
function vetroOpts(c,val){return c.vetri.map(v=>`<option value="${v.id}" ${v.id===val?'selected':''}>${esc(v.nome)}</option>`).join('')}
const uf=(id,label,val,u,attrs='')=>`<label class="f">${label}<div class="unit"><input class="num" id="${id}" inputmode="decimal" value="${esc(val)}" ${attrs}><span>${u}</span></div></label>`;

function viewStruttura(c){
  setMain(),$('main').innerHTML=c.lati.map((l,li)=>`
  <section class="card lato" data-l="${l.id}">

      <input class="name" id="ln_${l.id}" data-lf="nome" value="${esc(l.nome)}" aria-label="Nome del lato">
      <button class="btn sm" data-up="${li}" ${li?'':'disabled'} aria-label="Sposta su">↑</button>
      <button class="btn sm" data-down="${li}" ${li<c.lati.length-1?'':'disabled'} aria-label="Sposta giù">↓</button>
      <button class="btn sm danger" data-dellato="${l.id}">Elimina lato</button></div>
    <div class="fields">
      ${uf('la_'+l.id,'Angolo interno con il lato successivo',l.angolo,'°','data-lf="angolo"')}
      ${uf('lp_'+l.id,'Spessore tra un vano e l\'altro',l.pil,'mm','data-lf="pil"')}
      <label class="f">Lunghezza del lato<div class="unit"><input class="num" id="ll_${l.id}" readonly value="${fmt(latoLen(l))}"><span>mm</span></div></label>

function vanoCard(c,l,v,vi){return`
  <div class="vano" data-v="${v.id}">
    <div class="vano-head"><input class="name" id="vn_${v.id}" data-vf="nome" value="${esc(v.nome)}" aria-label="Nome del vano">
      <button class="btn sm" data-dupvano="${v.id}">Duplica</button>
      <button class="btn sm danger" data-delvano="${v.id}">Elimina</button></div>
    <div class="fields">
      ${uf('vL_'+v.id,'Larghezza',v.L,'mm','data-vf="L"')}
      ${uf('vHs_'+v.id,'Altezza sinistra',v.Hs,'mm','data-vf="Hs"')}
      ${uf('vHd_'+v.id,'Altezza destra',v.Hd,'mm','data-vf="Hd" placeholder="= sinistra"')}
      <label class="f">Quantità uguali<input class="num" id="vq_${v.id}" inputmode="numeric" data-vf="qta" value="${esc(v.qta)}"></label>
      <label class="f">Tipo<select id="vt_${v.id}" data-vs="tipo"><option value="fissa" ${v.tipo==='fissa'?'selected':''}>Fissa</option><option value="scorrevole" ${v.tipo==='scorrevole'?'selected':''}>Scorrevole</option></select></label>
      <label class="f">${v.tipo==='scorrevole'?'Ante':'Vetri'}<select id="vnn_${v.id}" data-vs="n">${nOpts(v.tipo,v.n)}</select></label>
      <label class="f">Vetro<select id="vg_${v.id}" data-vs="vetro">${vetroOpts(c,v.vetro)}</select></label>
    </div>
    <div class="vres" id="vr_${v.id}"></div>
    <details id="vdet_${v.id}"><summary>Misure dei vetri</summary><div id="vtb_${v.id}"></div></details>
  </div>`}
function vanoResult(c,v){
  const r=compute(v,c),box=$('vr_'+v.id),tb=$('vtb_'+v.id);if(!box)return;
  if(!r.ok){box.innerHTML='<span class="note">Inserisci larghezza e altezza.</span>';tb.innerHTML='';return}
  const nb=r.msgs.filter(m=>m[0]==='bad').length,nw=r.msgs.length-nb;
  box.innerHTML=`<span class="pill ${v.tipo==='scorrevole'?'mob':'fix'}">${v.tipo==='scorrevole'?'Scorrevole':'Fissa'} · ${r.N} ${v.tipo==='scorrevole'?'ante':'vetri'}${r.auto?' auto':''}</span>
    <span><b>${fmt(r.mq,2)}</b> m²</span><span><b>${fmt(r.kg,0)}</b> kg</span>${r.qta>1?`<span>× ${r.qta}</span>`:''}
    ${nb?`<span class="pill b">${nb} errori</span>`:''}${nw?`<span class="pill w">${nw} avvisi</span>`:''}`;
  tb.innerHTML=r.msgs.map(([k,t])=>`<div class="msg ${k==='bad'?'bad':''}">${esc(t)}</div>`).join('')+paneTable(r);
}
function paneTable(r){
  const hc=r.flat?'<th>Altezza</th>':'<th>H sx</th><th>H dx</th><th>Lato incl.</th>';
  return`<div class="tablebox"><table><thead><tr><th class="l">N°</th><th class="l">Tipo</th><th>Larghezza</th>${hc}<th>m²</th><th>kg</th></tr></thead><tbody>`+
   r.panes.map(q=>`<tr><td class="l">${q.i}</td><td class="t l">${q.mob?'Anta mobile':'Fisso'}</td><td>${fmt(q.gw,1)}</td>`+
     (r.flat?`<td>${fmt(q.hl,1)}</td>`:`<td>${fmt(q.hl,1)}</td><td>${fmt(q.hr,1)}</td><td>${fmt(q.lato,1)}</td>`)+`<td>${fmt(q.mq,3)}</td><td>${fmt(q.kg,1)}</td></tr>`).join('')+'</tbody></table></div>';
}
function bindStruttura(c){
  const findL=el=>c.lati.find(l=>l.id===el.closest('[data-l]').dataset.l);
  const findV=el=>{const l=findL(el);return[l,l.vani.find(v=>v.id===el.closest('[data-v]').dataset.v)]};
  c.lati.forEach(l=>l.vani.forEach(v=>vanoResult(c,v)));
  const m=$('main');
  m.addEventListener('input',e=>{const t=e.target;
    if(t.dataset.lf){const l=findL(t);l[t.dataset.lf]=t.dataset.lf==='nome'?t.value:t.value;save();$('ll_'+l.id).value=fmt(latoLen(l));return}
    if(t.dataset.vf){const[l,v]=findV(t);v[t.dataset.vf]=t.value;save();if(t.dataset.vf!=='nome'){vanoResult(c,v);$('ll_'+l.id).value=fmt(latoLen(l));updTot(c)}}});
  m.addEventListener('change',e=>{const t=e.target;if(!t.dataset.vs)return;const[,v]=findV(t);v[t.dataset.vs]=t.value;
    if(t.dataset.vs==='tipo'){v.n='auto';save();viewStruttura(c);updTot(c);return}save();vanoResult(c,v);updTot(c)});
  m.querySelectorAll('[data-addvano]').forEach(b=>b.onclick=()=>{const l=c.lati.find(x=>x.id===b.dataset.addvano);const prev=l.vani[l.vani.length-1];
    l.vani.push(newVano('Vano '+(l.vani.length+1),prev?{Hs:prev.Hd||prev.Hs,Hd:prev.Hd||prev.Hs,vetro:prev.vetro,tipo:prev.tipo}:{vetro:c.vetri[0]?.id}));save();viewStruttura(c);updTot(c)});
  m.querySelectorAll('[data-dupvano]').forEach(b=>b.onclick=()=>{const[l,v]=findV(b);const i=l.vani.indexOf(v);l.vani.splice(i+1,0,{...clone(v),id:uid(),nome:v.nome+' (copia)'});save();viewStruttura(c);updTot(c)});
  armDelete('[data-delvano]',b=>{const[l,v]=findV(b);l.vani=l.vani.filter(x=>x!==v);save();viewStruttura(c);updTot(c)});
  armDelete('[data-dellato]',b=>{c.lati=c.lati.filter(l=>l.id!==b.dataset.dellato);save();viewStruttura(c);updTot(c)});
  m.querySelectorAll('[data-up],[data-down]').forEach(b=>b.onclick=()=>{const i=+(b.dataset.up??b.dataset.down),j=b.dataset.up!=null?i-1:i+1;
    [c.lati[i],c.lati[j]]=[c.lati[j],c.lati[i]];save();viewStruttura(c)});
  $('addLato').onclick=()=>{const l=newLato('Lato '+letter(c.lati.length),{vani:[newVano('Vano 1',{vetro:c.vetri[0]?.id})]});c.lati.push(l);save();viewStruttura(c);updTot(c);
    const el=document.querySelector(`[data-l="${l.id}"]`);if(el)el.scrollIntoView({block:'start'})};
}

/* ---------- VISTA ---------- */
function planSvg(c,sel){
  let x=0,y=0,dx=0,dy=1;const segs=[];
  c.lati.forEach((l,li)=>{const len=latoLen(l)||1000;const s={l,li,x0:x,y0:y,dx,dy,len};x+=dx*len;y+=dy*len;s.x1=x;s.y1=y;segs.push(s);
    const t=(180-(num(l.angolo)||90))*Math.PI/180;[dx,dy]=[dx*Math.cos(t)+dy*Math.sin(t),-dx*Math.sin(t)+dy*Math.cos(t)]});
  if(!segs.length)return'<p class="note">Aggiungi almeno un lato.</p>';
  const xs=segs.flatMap(s=>[s.x0,s.x1]),ys=segs.flatMap(s=>[s.y0,s.y1]);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const ext=Math.max(maxX-minX,maxY-minY,1000),fs=ext/20,pad=fs*4.2;
  let g=`<svg viewBox="${minX-pad} ${minY-pad} ${maxX-minX+pad*2} ${maxY-minY+pad*2}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pianta della veranda">`;
  if(c.parete&&segs.length>1){const a=segs[0],b=segs[segs.length-1];
    g+=`<line x1="${b.x1}" y1="${b.y1}" x2="${a.x0}" y2="${a.y0}" stroke="var(--muted)" stroke-width="6" stroke-dasharray="10 8" vector-effect="non-scaling-stroke"/>`;
    g+=`<text x="${(a.x0+b.x1)/2}" y="${(a.y0+b.y1)/2-fs*0.7}" font-size="${fs*0.8}" text-anchor="middle" fill="var(--muted)" font-family="Barlow,sans-serif">Parete</text>`}
  segs.forEach(s=>{const on=s.l.id===sel,col=on?'var(--sel)':'var(--accent)';
    const nx=-s.dy,ny=s.dx; /* esterno = destra del percorso */
    g+=`<g data-lato="${s.l.id}"><line x1="${s.x0}" y1="${s.y0}" x2="${s.x1}" y2="${s.y1}" stroke="transparent" stroke-width="${fs*2.2}"/>
      <line x1="${s.x0}" y1="${s.y0}" x2="${s.x1}" y2="${s.y1}" stroke="${col}" stroke-width="${on?7:5}" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
    let acc=0;s.l.vani.forEach((v,i)=>{acc+=num(v.L)||0;if(i<s.l.vani.length-1){const px=s.x0+s.dx*acc,py=s.y0+s.dy*acc;
      g+=`<line x1="${px-nx*fs*.5}" y1="${py-ny*fs*.5}" x2="${px+nx*fs*.5}" y2="${py+ny*fs*.5}" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/>`;acc+=num(s.l.pil)||0}});
    const mx=(s.x0+s.x1)/2+nx*fs*1.9,my=(s.y0+s.y1)/2+ny*fs*1.9;
    g+=`<text x="${mx}" y="${my-fs*0.15}" font-size="${fs}" text-anchor="middle" fill="${on?'var(--sel)':'var(--ink)'}" font-family="Barlow Condensed,sans-serif" font-weight="700">${letter(s.li)} · ${esc(s.l.nome)}</text>
      <text x="${mx}" y="${my+fs*0.95}" font-size="${fs*0.75}" text-anchor="middle" fill="var(--muted)" font-family="JetBrains Mono,monospace">${fmt(latoLen(s.l))} mm</text></g>`});
  return g+'</svg>';
}
function elevSvg(c,lati,multi){
  let Hm=0;lati.forEach(l=>l.vani.forEach(v=>{const a=num(v.Hs),b=isFinite(num(v.Hd))?num(v.Hd):a;if(a>0)Hm=Math.max(Hm,a,b)}));
  if(!Hm)return'<p class="note">Inserisci le misure dei vani per vedere il prospetto.</p>';
  const fs=Hm/18,gap=multi?Hm*0.35:0;let x=0,body='';
  lati.forEach((l,li)=>{const x0=x,pil=num(l.pil)||0;
    l.vani.forEach((v,vi)=>{const r=compute(v,c);const L=num(v.L);if(!(L>0))return;
      const Hs=num(v.Hs)||0,Hd=isFinite(num(v.Hd))?num(v.Hd):Hs,Y=h=>Hm-h;
      if(vi>0&&pil>0)body+=`<rect x="${x-pil}" y="${Y(Math.max(Hs,Hd))}" width="${pil}" height="${Math.max(Hs,Hd)}" fill="var(--line)"/>`;
      body+=`<polygon points="${x},${Y(0)} ${x+L},${Y(0)} ${x+L},${Y(Hd)} ${x},${Y(Hs)}" fill="none" stroke="var(--ink)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`;
      if(r.ok)r.panes.forEach((q,k)=>{const fill=v.tipo==='scorrevole'&&k%2?'var(--glass-2)':'var(--glass)',X=x+q.gx,b=q.by;
        body+=`<polygon points="${X},${Y(b)} ${X+q.gw},${Y(b)} ${X+q.gw},${Y(b+q.hr)} ${X},${Y(b+q.hl)}" fill="${fill}" fill-opacity="${v.tipo==='scorrevole'?.85:1}" stroke="var(--accent)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`;
        body+=`<text x="${X+q.gw/2}" y="${Y(b+(q.hl+q.hr)/4)}" font-size="${fs*0.9}" text-anchor="middle" dominant-baseline="middle" fill="var(--ink)" font-family="Barlow Condensed,sans-serif" font-weight="700">${q.i}</text>`});
      body+=`<text x="${x+L/2}" y="${Y(Math.max(Hs,Hd))-fs*0.55}" font-size="${fs*0.78}" text-anchor="middle" fill="var(--ink)" font-family="Barlow,sans-serif" font-weight="600">${esc(v.nome)}</text>`;
      body+=`<text x="${x+L/2}" y="${Hm+fs*1.2}" font-size="${fs*0.72}" text-anchor="middle" fill="var(--muted)" font-family="JetBrains Mono,monospace">${fmt(L)}</text>`;
      body+=`<text x="${x+fs*0.3}" y="${Y(Hs)+fs*1.1}" font-size="${fs*0.62}" fill="var(--muted)" font-family="JetBrains Mono,monospace">${fmt(Hs)}</text>`;
      if(Math.abs(Hs-Hd)>.5)body+=`<text x="${x+L-fs*0.3}" y="${Y(Hd)+fs*1.1}" font-size="${fs*0.62}" text-anchor="end" fill="var(--muted)" font-family="JetBrains Mono,monospace">${fmt(Hd)}</text>`;
      x+=L+pil});
    if(l.vani.length&&pil>0)x-=pil;
    if(multi){body+=`<line x1="${x0}" y1="${Hm+fs*2}" x2="${x}" y2="${Hm+fs*2}" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
      <text x="${(x0+x)/2}" y="${Hm+fs*3.3}" font-size="${fs}" text-anchor="middle" fill="var(--accent)" font-family="Barlow Condensed,sans-serif" font-weight="700">${letter(c.lati.indexOf(l))} · ${esc(l.nome)}</text>`;x+=gap}});
  if(multi)x-=gap;
  const W=Math.max(x,1),top=fs*2,bot=multi?fs*4:fs*1.9,side=fs*0.8,vbW=W+side*2,vbH=Hm+top+bot;
  const minPx=Math.round(Math.min(4000,300*vbW/vbH));
  return`<svg viewBox="${-side} ${-top} ${vbW} ${vbH}" style="min-width:${minPx}px" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Prospetto">${body}</svg>`;
}
function viewVista(c){
  if(!c.lati.find(l=>l.id===S.ui.lato))S.ui.lato=c.lati[0]?.id;
  const sel=c.lati.find(l=>l.id===S.ui.lato);
  setMain(),$('main').innerHTML=`
  <section class="card"><div class="row between"><h2>Pianta</h2><span class="note">Tocca un lato per vederne il prospetto</span></div>
    <div class="draw plan">${planSvg(c,S.ui.sviluppo?null:S.ui.lato)}</div></section>
  <section class="card">
    <div class="seg" id="latoSeg">${c.lati.map((l,i)=>`<button data-sl="${l.id}" aria-pressed="${!S.ui.sviluppo&&l.id===S.ui.lato}">${letter(i)} · ${esc(l.nome)}</button>`).join('')}
      <button data-sl="__all" aria-pressed="${!!S.ui.sviluppo}">Tutti i lati</button></div>
    <h2>${S.ui.sviluppo?'Sviluppo di tutti i lati, visti dall\'esterno':sel?`Lato ${letter(c.lati.indexOf(sel))} · ${esc(sel.nome)}, visto dall'esterno`:''}</h2>
    <div class="draw">${S.ui.sviluppo?elevSvg(c,c.lati,true):sel?elevSvg(c,[sel],false):''}</div>
    ${!S.ui.sviluppo&&sel?latoDetail(c,sel):''}
  </section>`;
  document.querySelectorAll('[data-lato]').forEach(g=>g.onclick=()=>{S.ui.lato=g.dataset.lato;S.ui.sviluppo=false;save();viewVista(c)});
  document.querySelectorAll('[data-sl]').forEach(b=>b.onclick=()=>{if(b.dataset.sl==='__all')S.ui.sviluppo=true;else{S.ui.lato=b.dataset.sl;S.ui.sviluppo=false}save();viewVista(c)});
}
function latoDetail(c,l){return l.vani.map(v=>{const r=compute(v,c);return`<div class="card" style="padding:12px;gap:8px"><div class="row between"><h3>${esc(v.nome)}</h3>
  ${r.ok?`<span class="note">${fmt(r.L)} × ${r.flat?fmt(r.Hs):fmt(r.Hs)+'/'+fmt(r.Hd)} mm · ${esc(r.gl.nome)}${r.qta>1?' · × '+r.qta:''}</span>`:''}</div>
  ${r.ok?r.msgs.map(([k,t])=>`<div class="msg ${k==='bad'?'bad':''}">${esc(t)}</div>`).join('')+paneTable(r):'<p class="note">Misure incomplete.</p>'}</div>`}).join('')}

/* ---------- RIEPILOGO ---------- */
function viewRiepilogo(c){
  const t=totals(c),byG={};let rows='',txt=`CANTIERE: ${c.nome}${c.indirizzo?' – '+c.indirizzo:''}\n`;
  c.lati.forEach((l,li)=>{rows+=`<tr class="grp"><td colspan="7">${letter(li)} · ${esc(l.nome)}</td></tr>`;txt+=`\n== ${letter(li)} · ${l.nome} ==\n`;
    l.vani.forEach(v=>{const r=compute(v,c);if(!r.ok){rows+=`<tr><td class="t l">${esc(v.nome)}</td><td class="t l" colspan="6">Misure incomplete</td></tr>`;return}
      const g=byG[r.gl.id]||(byG[r.gl.id]={nome:r.gl.nome,n:0,mq:0,fmq:0,kg:0,pr:r.prezzo});g.n+=r.N*r.qta;g.mq+=r.mq;g.fmq+=r.fmq;g.kg+=r.kg;
      txt+=`${v.nome} – ${v.tipo} – vano ${fmt(r.L)} × ${r.flat?fmt(r.Hs):fmt(r.Hs)+'/'+fmt(r.Hd)}${r.qta>1?' (× '+r.qta+')':''} – ${r.gl.nome}\n`;
      r.panes.forEach(q=>{rows+=`<tr><td class="t l">${esc(v.nome)}</td><td class="l">${q.i}</td><td>${fmt(q.gw,1)}</td><td>${r.flat?fmt(q.hl,1):fmt(q.hl,1)+' / '+fmt(q.hr,1)}</td><td>${r.qta}</td><td>${fmt(q.mq*r.qta,3)}</td><td>${fmt(q.kg*r.qta,1)}</td></tr>`;
        txt+=`  ${q.i}) ${fmt(q.gw,1)} × ${r.flat?fmt(q.hl,1):fmt(q.hl,1)+'/'+fmt(q.hr,1)} mm  ×${r.qta}  ${fmt(q.mq*r.qta,3)} m²\n`})})});
  txt+=`\nTOTALE: ${t.vetri} vetri · ${fmt(t.mq,2)} m² reali · ${fmt(t.fmq,2)} m² fatturati · ${fmt(t.kg,0)} kg`;
  const gl=Object.values(byG);
  txt+='\n\nORDINE VETRI:\n'+gl.map(g=>`${g.nome}: ${g.n} pz · ${fmt(g.fmq,2)} m²`).join('\n');
  setMain(),$('main').innerHTML=`
  <section class="card"><div class="row between"><h2>Totali cantiere</h2><button class="btn primary" id="copyAll">Copia distinta</button></div>
    <div class="stats"><div class="stat"><span>Vetri</span><b>${t.vetri}</b></div><div class="stat"><span>m² reali</span><b>${fmt(t.mq,2)}</b></div>
    <div class="stat"><span>m² da fatturare</span><b>${fmt(t.fmq,2)}</b></div><div class="stat"><span>Peso</span><b>${fmt(t.kg,0)} kg</b></div>
    ${t.cost>0?`<div class="stat"><span>Costo vetro</span><b>€ ${fmt(t.cost,2)}</b></div>`:''}</div>
    ${t.warn?`<div class="msg">Ci sono ${t.warn} avvisi nei vani: controllali in Struttura.</div>`:''}
    <textarea id="distTa" hidden></textarea></section>
  <section class="card"><h2>Ordine per tipo di vetro</h2>
    <div class="tablebox"><table><thead><tr><th class="l">Vetro</th><th>Pezzi</th><th>m² reali</th><th>m² fatt.</th><th>kg</th><th>€</th></tr></thead><tbody>
    ${gl.map(g=>`<tr><td class="t l">${esc(g.nome)}</td><td>${g.n}</td><td>${fmt(g.mq,2)}</td><td>${fmt(g.fmq,2)}</td><td>${fmt(g.kg,0)}</td><td>${g.pr>0?fmt(g.fmq*g.pr,2):'–'}</td></tr>`).join('')}</tbody></table></div></section>
  <section class="card"><h2>Distinta vetri per lato</h2>
    <div class="tablebox"><table><thead><tr><th class="l">Vano</th><th class="l">N°</th><th>Larghezza</th><th>Altezza</th><th>Pz</th><th>m²</th><th>kg</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
  $('copyAll').onclick=()=>{const ta=$('distTa');ta.hidden=false;copy(txt,ta)};
}

/* ---------- PARAMETRI ---------- */
function viewParametri(c){
  const p=c.p;
  setMain(),$('main').innerHTML=`
  <section class="card"><h2>Dati del cantiere</h2>
    <div class="fields"><label class="f">Nome<input id="cn" value="${esc(c.nome)}"></label><label class="f">Indirizzo<input id="ci" value="${esc(c.indirizzo)}"></label></div>
    <label class="f">Note<textarea id="cno" rows="2">${esc(c.note)}</textarea></label>
    <label class="chk"><input type="checkbox" id="cpar" ${c.parete?'checked':''}> Veranda addossata a una parete (chiude la pianta tra ultimo e primo lato)</label>
    <div class="row"><button class="btn primary" id="expC">Esporta cantiere</button><button class="btn" id="dupC">Duplica cantiere</button><button class="btn danger" id="delC">Elimina cantiere</button></div></section>
  <section class="card"><h2>Parametri di questo cantiere</h2>
    <p class="banner">Questi valori valgono solo per «${esc(c.nome)}». Modificarli non cambia gli altri cantieri.</p>
    <div class="fields"><label class="f">Carica da un modello<select id="modSel">${S.modelli.map(m=>`<option value="${m.id}">${esc(m.nome)}</option>`).join('')}</select></label></div>
    <div class="row"><button class="btn" id="loadMod">Carica modello</button><button class="btn" id="saveMod">Salva come modello</button></div></section>
  ${PARAM_GROUPS.map(gr=>`<section class="card"><h2>${gr.t}</h2>${gr.d?`<p class="note">${gr.d}</p>`:''}<div class="fields">`+
    gr.f.map(([k,l,u,h])=>`<label class="f">${l}<div class="unit"><input class="num" id="p_${k}" data-k="${k}" inputmode="decimal" value="${p[k]??''}"><span>${u}</span></div>${h?`<span class="hint">${h}</span>`:''}</label>`).join('')+'</div></section>').join('')}
  <section class="card"><h2>Vetri di questo cantiere</h2>
    <p class="note">Peso indicativo circa 2,5 kg/m² per mm di spessore. Il prezzo è facoltativo.</p>
    <div class="tablebox"><table class="vtab"><thead><tr><th class="l">Nome</th><th>Spessore mm</th><th>kg/m²</th><th>€/m²</th><th></th></tr></thead><tbody>
    ${c.vetri.map(v=>`<tr data-g="${v.id}"><td><input id="gn_${v.id}" data-f="nome" value="${esc(v.nome)}"></td><td><input class="num" id="gs_${v.id}" data-f="sp" inputmode="decimal" value="${v.sp}"></td>
      <td><input class="num" id="gk_${v.id}" data-f="kg" inputmode="decimal" value="${v.kg}"></td><td><input class="num" id="gp_${v.id}" data-f="prezzo" inputmode="decimal" value="${v.prezzo??''}" placeholder="–"></td>
      <td><button class="btn danger sm" data-delg="${v.id}" aria-label="Elimina vetro">✕</button></td></tr>`).join('')}</tbody></table></div>
    <div class="row"><button class="btn" id="addG">Aggiungi vetro</button></div></section>`;
  $('cn').oninput=e=>{c.nome=e.target.value||'Senza nome';save();document.querySelector('h1').textContent=c.nome};
  $('ci').oninput=e=>{c.indirizzo=e.target.value;save();updTot(c)};
  $('cno').oninput=e=>{c.note=e.target.value;save()};
  $('cpar').onchange=e=>{c.parete=e.target.checked;save()};
  document.querySelectorAll('[data-k]').forEach(i=>i.addEventListener('input',e=>{const n=num(e.target.value);c.p[e.target.dataset.k]=isFinite(n)?n:0;save();updTot(c)}));
  $('loadMod').onclick=()=>{const m=S.modelli.find(x=>x.id===$('modSel').value);if(!m)return;c.p={...DEF_P,...m.p};save();viewParametri(c);updTot(c);toast('Modello caricato')};
  $('saveMod').onclick=()=>{S.modelli.push({id:uid(),nome:'Da '+c.nome,p:{...c.p}});save();viewParametri(c);toast('Salvato come modello «Da '+c.nome+'»')};
  $('expC').onclick=()=>shareFile('cantiere-'+fileName(c.nome)+'.json',{v:2,tipo:'cantiere',cantiere:c});
  $('dupC').onclick=()=>{const n={...clone(c),id:uid(),nome:c.nome+' (copia)'};S.cantieri.unshift(n);go(n.id,'struttura');toast('Cantiere duplicato')};
  armDelete('#delC',()=>{S.cantieri=S.cantieri.filter(x=>x!==c);go(null);toast('Cantiere eliminato')});
  document.querySelectorAll('[data-g] input').forEach(i=>i.addEventListener('input',e=>{const v=c.vetri.find(x=>x.id===e.target.closest('tr').dataset.g),f=e.target.dataset.f;
    v[f]=f==='nome'?e.target.value:e.target.value.replace(',','.');
    if(f==='sp'){const sp=num(e.target.value);if(sp>0){v.kg=+(sp*2.5).toFixed(1);$('gk_'+v.id).value=v.kg}}save();updTot(c)}));
  armDelete('[data-delg]',b=>{if(c.vetri.length<2){toast('Serve almeno un vetro');return}c.vetri=c.vetri.filter(v=>v.id!==b.dataset.delg);save();viewParametri(c);updTot(c)});
  $('addG').onclick=()=>{c.vetri.push({id:uid(),nome:'Nuovo vetro',sp:8,kg:20,prezzo:''});save();viewParametri(c)};
}

/* ---------- STRUMENTI ---------- */
function geoRows(L,Hs,Hd){const dh=Hd-Hs;
  return[['Lato superiore inclinato',fmt(Math.hypot(L,dh),1)+' mm'],['Differenza altezze',fmt(Math.abs(dh),1)+' mm'],
   ['Pendenza',fmt(Math.abs(dh)/L*100,2)+' %'],['Angolo',fmt(Math.atan2(Math.abs(dh),L)*180/Math.PI,2)+'°'],
   ['Diagonale basso sx → alto dx',fmt(Math.hypot(L,Hd),1)+' mm'],['Diagonale basso dx → alto sx',fmt(Math.hypot(L,Hs),1)+' mm'],
   ['Superficie vano',fmt(L*(Hs+Hd)/2/1e6,3)+' m²']]}
const kv=rows=>rows.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('');
function viewStrumenti(c){
  const opts=c.lati.flatMap((l,li)=>l.vani.map(v=>`<option value="${v.id}">${letter(li)} · ${esc(l.nome)} – ${esc(v.nome)}</option>`)).join('');
  setMain(),$('main').innerHTML=`<div class="grid two">
  <section class="card"><h2>Lato inclinato e diagonali</h2>
    <p class="note">Base e due altezze danno lato inclinato, pendenza e diagonali. Puoi partire da un vano del cantiere.</p>
    <div class="row"><select id="srcV" style="flex:1"><option value="">Scegli un vano…</option>${opts}</select></div>
    <div class="fields">${uf('m1L','Base','','mm')}${uf('m1Hs','Altezza sinistra','','mm')}${uf('m1Hd','Altezza destra','','mm')}</div>
    <dl class="kv" id="m1out"></dl></section>
  <section class="card"><h2>Triangolo rettangolo</h2><p class="note">Inserisci due misure e lascia vuota quella che manca.</p>
    <div class="fields">${uf('m2a','Base','','mm')}${uf('m2b','Altezza','','mm')}${uf('m2c','Diagonale','','mm')}</div><dl class="kv" id="m2out"></dl></section>
  <section class="card"><h2>Verifica squadra</h2><p class="note">Se le due diagonali del vano sono uguali, il vano è in squadra.</p>
    <div class="fields">${uf('m3L','Larghezza','','mm')}${uf('m3H','Altezza','','mm')}${uf('m3d1','Diagonale 1','','mm')}${uf('m3d2','Diagonale 2','','mm')}</div><dl class="kv" id="m3out"></dl></section>
  <section class="card"><h2>Angolo tra due lati</h2><p class="note">Misura un tratto lungo ciascun lato a partire dall'angolo e la distanza tra i due punti: ottieni l'angolo reale da inserire in Struttura.</p>
    <div class="fields">${uf('m4a','Tratto sul lato 1','','mm')}${uf('m4b','Tratto sul lato 2','','mm')}${uf('m4c','Distanza tra i punti','','mm')}</div><dl class="kv" id="m4out"></dl></section></div>`;
  const g=k=>num($(k).value);
  function run(){
    const L=g('m1L'),a=g('m1Hs'),b=isFinite(g('m1Hd'))?g('m1Hd'):g('m1Hs');
    $('m1out').innerHTML=(L>0&&a>0&&b>0)?kv(geoRows(L,a,b)):'<dt>Inserisci base e altezze</dt><dd></dd>';
    const x=g('m2a'),y=g('m2b'),d=g('m2c');let r;
    if(x>0&&y>0&&!(d>0))r=[['Diagonale',fmt(Math.hypot(x,y),1)+' mm'],['Angolo alla base',fmt(Math.atan2(y,x)*180/Math.PI,2)+'°']];
    else if(x>0&&d>0&&!(y>0))r=d>x?[['Altezza',fmt(Math.sqrt(d*d-x*x),1)+' mm']]:[['La diagonale deve superare la base','']];
    else if(y>0&&d>0&&!(x>0))r=d>y?[['Base',fmt(Math.sqrt(d*d-y*y),1)+' mm']]:[['La diagonale deve superare l\'altezza','']];
    else if(x>0&&y>0&&d>0)r=[['Diagonale teorica',fmt(Math.hypot(x,y),1)+' mm'],['Differenza con la tua',fmt(d-Math.hypot(x,y),1)+' mm']];
    else r=[['Inserisci due misure su tre','']];
    $('m2out').innerHTML=kv(r);
    const W=g('m3L'),H=g('m3H'),d1=g('m3d1'),d2=g('m3d2'),o=[];
    if(W>0&&H>0)o.push(['Diagonale teorica',fmt(Math.hypot(W,H),1)+' mm']);
    if(d1>0&&d2>0){const dd=Math.abs(d1-d2);o.push(['Differenza tra le diagonali',fmt(dd,1)+' mm'],['Esito',dd<=2?'In squadra':dd<=5?'Leggermente fuori squadra':'Fuori squadra'])}
    $('m3out').innerHTML=o.length?kv(o):'<dt>Inserisci le misure</dt><dd></dd>';
    const A=g('m4a'),B=g('m4b'),D=g('m4c');
    if(A>0&&B>0&&D>0){const cs=(A*A+B*B-D*D)/(2*A*B);$('m4out').innerHTML=Math.abs(cs)<=1?kv([['Angolo',fmt(Math.acos(cs)*180/Math.PI,1)+'°']]):kv([['Misure non compatibili tra loro','']])}
    else $('m4out').innerHTML='<dt>Inserisci le tre misure</dt><dd></dd>';
  }
  $('main').addEventListener('input',run);
  $('srcV').onchange=e=>{const v=c.lati.flatMap(l=>l.vani).find(x=>x.id===e.target.value);if(!v)return;$('m1L').value=v.L;$('m1Hs').value=v.Hs;$('m1Hd').value=v.Hd||v.Hs;run()};
  run();
}

render();
paintStatus();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})();
</script>
