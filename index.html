    vv.forEach(({v,vi,r})=>{rows.push({grp:`${letter(li)}${vi+1} · ${v.nome}`,right:`${r.s.nome} · ${r.gl.nome} · vano ${fmt(r.L)} × ${r.flat?fmt(r.Hs):fmt(r.Hs)+'/'+fmt(r.Hd)}${r.qta>1?' · × '+r.qta:''}`});
      r.panes.forEach(q=>rows.push({cells:[`${letter(li)}${vi+1}-${q.i}`,q.mob?'Anta mobile':'Fisso',fmtMm(q.gw),r.flat?fmtMm(q.hl):`${fmtMm(q.hl)} / ${fmtMm(q.hr)}`,String(r.qta),fmt(q.mq*r.qta,3),fmt(q.kg*r.qta,1)]}))});
    D.table([{t:'Rif.',w:18},{t:'Tipo',w:30},{t:'Larghezza',w:28,al:'r'},{t:'Altezza',w:36,al:'r'},{t:'Pz',w:14,al:'r'},{t:'m²',w:26,al:'r'},{t:'kg',w:28,al:'r'}],rows);
    D.gap(5)});
  if(S.set.noteOrdine){D.h2('Note');D.para(S.set.noteOrdine)}
  return{bytes:D.finish(),name:`Distinta vetri - ${c.nome}.pdf`}}
function pdfOrdine(c,kind){
  const fin=kind==='fin',rows=c.fz.voci.map(x=>({x,r:fzCalc(c,x)})).filter(o=>o.r.ok&&o.r[kind]);
  if(!rows.length){toast(fin?'Nessuna finestra con misure.':'Nessuna zanzariera con misure.');return null}
  const tit=fin?'Ordine finestre':'Ordine zanzariere',D=mkDoc({title:tit,ref:c.nome,meta:[['Data',oggi()]]});
  D.y+=D.pairsAt([['Cantiere',c.nome],['Indirizzo',c.indirizzo]],D.M,D.W)+2;
  const pz=rows.reduce((a,o)=>a+o.r.q,0),mq=rows.reduce((a,o)=>a+o.r[kind].mq*o.r.q,0);
  D.stats([[fin?'Finestre':'Zanzariere',String(pz)],['Posizioni',String(rows.length)],['m² totali',fmt(mq,2)]]);
  D.h2(fin?'Finestre da ordinare':'Zanzariere da ordinare',fin?'Misure da ordinare in mm · schema visto dall\'interno':'Misure da ordinare in mm');
  const cols=fin?[{t:'N°',w:9},{t:'Schema',w:32,draw:true},{t:'Vano',w:28},{t:'Descrizione',w:59},{t:'Larghezza',w:19,al:'r'},{t:'Altezza',w:19,al:'r'},{t:'Q.tà',w:14,al:'r'}]
    :[{t:'N°',w:9},{t:'Vano',w:34},{t:'Descrizione',w:85},{t:'Larghezza',w:19,al:'r'},{t:'Altezza',w:19,al:'r'},{t:'Q.tà',w:14,al:'r'}];
  D.table(cols,rows.map((o,i)=>{const x=o.x,m=o.r[kind];
    if(fin){const f=x.fin,n=+f.ante||1,det=[`${f.apertura}, ${pl(n,'anta','ante')}${f.verso?' '+f.verso:''}`,f.vetro?'Vetro: '+f.vetro:'',f.colore?'Colore: '+f.colore:'',f.note?'Note: '+f.note:''].filter(Boolean).join('\n');
      return{cells:[String(i+1),'',x.nome,{t:m.t.nome,s:det},fmtMm(m.oL),fmtMm(m.oH),String(o.r.q)],h:24,draw:(cx,cy,cw,ch)=>pdfWin(D.P,cx+2,cy+2,cw-4,ch-4,f,m.oL,m.oH)}}
    const z=x.zan,det=[`Montaggio ${m.mont}`,z.colore?'Colore: '+z.colore:'',z.rete?'Rete: '+z.rete:'',z.comando?'Comando: '+z.comando:'',z.note?'Note: '+z.note:''].filter(Boolean).join('\n');
    return{cells:[String(i+1),x.nome,{t:m.t.nome,s:det},fmtMm(m.oL),fmtMm(m.oH),String(o.r.q)]}}).concat([{cells:fin?['','','Totale','','','',String(pz)]:['','Totale','','','',String(pz)],b:true,f:PC.bg}]));
  return{bytes:D.finish(),name:`${tit} - ${c.nome}.pdf`}}
function pdfPreventivo(c){
  const k=prevCalc(c,true),pv=k.pv;save();
  if(!k.vetri.length&&!k.fin.length&&!k.zan.length&&!k.lav.length){toast('Il preventivo è vuoto: aggiungi vani o lavorazioni.');return null}
  const D=mkDoc({title:'Preventivo',ref:pv.cliente||c.nome,meta:[pv.numero?['N.',pv.numero]:null,['Data',fmtData(pv.data)||oggi()]].filter(Boolean)}),M=D.M,W=D.W,g=8,cw=(W-g)/2;
  const h1=D.pairsAt([['Cliente',pv.cliente||'—']],M,cw),h2=D.pairsAt([['Lavoro',c.nome],['Indirizzo',c.indirizzo]],M+cw+g,cw);D.y+=Math.max(h1,h2)+1;
  D.para('Importi in euro, IVA esclusa salvo dove indicato.',{sz:7.5,c:PC.mut});
  if(k.vetri.length){D.h2('Vetrate e scorrevoli');
    const vr=[];c.lati.forEach((l,li)=>l.vani.forEach((v,vi)=>{const r=compute(v,c);if(!r.ok)return;
      vr.push({cells:[`${letter(li)}${vi+1}`,{t:`${v.nome} · ${l.nome}`,s:`${r.s.nome} · ${pl(r.N,r.s.mobili?'anta':'vetro',r.s.mobili?'ante':'vetri')} · ${r.gl.nome}`},`${fmt(r.L)} × ${r.flat?fmt(r.Hs):fmt(r.Hs)+'/'+fmt(r.Hd)}`,String(r.qta)]})}));
    D.table([{t:'Rif.',w:13},{t:'Descrizione',w:109},{t:'Misure vano mm',w:38,al:'r'},{t:'Q.tà',w:20,al:'r'}],vr);D.gap(2.5);
    D.table([{t:'Vetro',w:72},{t:'Pezzi',w:18,al:'r'},{t:'m²',w:24,al:'r'},{t:'Prezzo €/m²',w:32,al:'r'},{t:'Importo €',w:34,al:'r'}],
      [...k.vetri.map(g=>({cells:[g.nome,String(g.n),fmt(g.fmq,2),g.pr>0?fmtE(g.pr):'da definire',g.pr>0?fmtE(g.imp):'–']})),{cells:['Totale vetrate','','','',fmtE(k.totV)],b:true,f:PC.bg}])}
  const fzT=(kind,list,tv,lab)=>{D.h2(lab);
    D.table([{t:'Rif.',w:12},{t:'Descrizione',w:80},{t:'Misura mm',w:30,al:'r'},{t:'Q.tà',w:12,al:'r'},{t:'Prezzo €',w:22,al:'r'},{t:'Importo €',w:24,al:'r'}],
      [...list.map((l,i)=>{const x=l.x,o=l.o,e=l.e,f=x.fin,z=x.zan;
        const det=kind==='fin'?[descFin(c,x),f.vetro,f.colore].filter(Boolean).join(' · '):[descZan(c,x),z.colore,z.rete?'rete '+z.rete.toLowerCase():''].filter(Boolean).join(' · ');
        const prz=!(l.pr>0)?'da definire':e.modo==='mq'?{t:fmtE(l.pr)+'/m²',s:`${fmt(l.mqF,2)} m²${l.mqF>o.mq+1e-9?' (min.)':''} cad.`}:{t:fmtE(l.pr),s:'cad.'};
        return{cells:[`${kind==='fin'?'F':'Z'}${i+1}`,{t:x.nome,s:det},`${fmtMm(o.oL)} × ${fmtMm(o.oH)}`,String(l.q),prz,l.pr>0?fmtE(l.imp):'–']}}),
       {cells:['',`Totale ${lab.toLowerCase()}`,'','','',fmtE(tv)],b:true,f:PC.bg}])};
  if(k.fin.length)fzT('fin',k.fin,k.totF,'Finestre');
  if(k.zan.length)fzT('zan',k.zan,k.totZ,'Zanzariere');
  if(k.lav.length){D.h2('Altre lavorazioni');
    D.table([{t:'Descrizione',w:92},{t:'Q.tà',w:22,al:'r'},{t:'U.M.',w:14},{t:'Prezzo €',w:26,al:'r'},{t:'Importo €',w:26,al:'r'}],
      [...k.lav.map(x=>({cells:[x.desc||'Lavorazione',fmtQ(num(x.qta)||0),x.um,fmtE(num(x.prezzo)||0),fmtE(x.imp)]})),{cells:['Totale altre lavorazioni','','','',fmtE(k.totL)],b:true,f:PC.bg}])}
  D.gap(4);
  D.totals([k.vetri.length?['Vetrate e scorrevoli',eur(k.totV)]:null,k.fin.length?['Finestre',eur(k.totF)]:null,k.zan.length?['Zanzariere',eur(k.totZ)]:null,k.lav.length?['Altre lavorazioni',eur(k.totL)]:null,
    ['Imponibile',eur(k.imp)],...(k.sc>0?[[`Sconto ${fmtQ(num(pv.sconto))}%`,'– '+eur(k.sc)],['Imponibile scontato',eur(k.base)]]:[]),[`IVA ${fmtQ(num(pv.iva)||0)}%`,eur(k.iva)]].filter(Boolean),['Totale IVA inclusa',eur(k.tot)]);
  const cond=[num(pv.validita)>0?`Offerta valida ${pv.validita} giorni dalla data del preventivo.`:'',pv.note||''].filter(Boolean);
  if(cond.length){D.h2('Note e condizioni');cond.forEach(t=>{D.para(t);D.gap(1.5)})}
  D.firma();
  return{bytes:D.finish(),name:`Preventivo${pv.numero?' '+pv.numero:''} - ${pv.cliente||c.nome}.pdf`}}

/* ---------- impostazioni generali ---------- */
function renderSettings(){
  $('hdr').innerHTML=`<div class="brand"><button class="back" id="backBtn" type="button" aria-label="Indietro">${ICON.back}</button>
    <div class="titles"><span class="crumb">Calcolo vetrate</span><h1>Impostazioni generali</h1><span class="sync" id="sync"></span></div></div>`;
  removeNav();
  const st=S.set;let kb=0;try{kb=Math.max(1,Math.round((localStorage.getItem(KEY)||'').length/1024))}catch(e){}
  const ctx={key:'predef',h:S.predef,cantiere:null,vetri:S.catalogo,usage:null,rerender:renderSettings,onChange:null};
  const fctx={key:'predef',h:S.predef,cantiere:null,usage:null,rerender:renderSettings};
  setMain(),$('main').innerHTML=`
  <section class="card">${cardH('Aspetto','aspetto','hp_asp')}
    <div class="setrow"><span class="setl">Tema</span>${seg('sTema',st.tema,[['auto','Automatico'],['light','Chiaro'],['dark','Scuro']])}</div>
    <div class="setrow"><span class="setl">Dimensione del testo</span>${seg('sTesto',st.testo,[['normale','Normale'],['grande','Grande']])}</div>
    <div class="setrow"><span class="setl">Pulsanti di spiegazione «!»</span>${seg('sAiuti',st.aiuti?'1':'0',[['1','Mostra'],['0','Nascondi']])}</div>
  </section>
  <section class="card">${cardH('Misure dei vetri','arrot','hp_arr')}
    <div class="setrow"><span class="setl">Arrotonda le misure di taglio</span>${seg('sArr',st.arrotVetro,[['decimo','Al decimo di mm'],['mm-giu','Al mm per difetto'],['mm','Al mm più vicino']])}</div>
  </section>
  <section class="card">${cardH('Dati della ditta','intest','hp_int')}
    <div class="fields">${fld({id:'sDitta',label:'Ditta',val:st.ditta,attrs:'placeholder="Es. Rossi Serramenti"'})}${fld({id:'sInd',label:'Indirizzo',val:st.indDitta,attrs:'placeholder="Via, numero, CAP e città"'})}
      ${fld({id:'sCont',label:'Contatto',val:st.contatto,attrs:'placeholder="Telefono o email"'})}${fld({id:'sPiva',label:'Partita IVA',val:st.piva,attrs:'inputmode="numeric"'})}</div>
    ${fld({id:'sNote',label:'Note per il vetraio',ctrl:`<textarea id="sNote" rows="2" placeholder="Es. filo lucido, consegna in cantiere">${esc(st.noteOrdine)}</textarea>`})}
  </section>
  ${tipHTML(ctx,'Tipologie vetrate predefinite','tipPredef')}
  <datalist id="dlMat">${['PVC','Alluminio','Legno-alluminio','Legno'].map(x=>`<option value="${x}">`).join('')}</datalist>
  ${fzTipHTML('fin',fctx,'Tipologie finestre predefinite','tipFinPre')}${fzTipHTML('zan',fctx,'Tipologie zanzariere predefinite','tipZanPre')}
  <section class="card">${cardH('Vetri predefiniti','vetriPre','hp_vpre')}${vetriHTML(S.catalogo,'gv')}</section>
  <section class="card">${cardH('Dati e backup','backup','hp_bk')}
    <dl class="kv"><dt>Ultimo backup</dt><dd>${st.lastBackup?new Date(st.lastBackup).toLocaleDateString('it-IT'):'mai'}</dd><dt>Cantieri salvati</dt><dd>${S.cantieri.length}</dd><dt>Spazio usato</dt><dd>${kb} KB</dd></dl>
    <div class="row"><button class="btn primary" id="bkBtn" type="button">Backup completo</button>
      <label class="btn" for="impAll">Ripristina backup</label><input type="file" id="impAll" accept=".json,application/json" hidden>
      <label class="btn" for="impC2">Importa cantiere</label><input type="file" id="impC2" accept=".json,application/json" hidden></div>
    <div class="row"><button class="btn danger" id="wipeBtn" type="button">Elimina tutti i dati</button></div>
  </section>
  <section class="card">${cardH('App','app','hp_app')}
    <dl class="kv"><dt>Versione</dt><dd>${APP_VER}</dd><dt>Salvataggio</dt><dd>Su questo dispositivo</dd></dl>
    <div class="row"><button class="btn primary" id="updBtn" type="button">Cerca aggiornamenti</button></div>
  </section>`;
  $('backBtn').onclick=()=>{S.ui.imp=false;save();render();window.scrollTo(0,0)};
  const segBind=(id,fn)=>$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{fn(b.dataset.v);save();applySettings();renderSettings()});
  segBind('sTema',v=>st.tema=v);segBind('sTesto',v=>st.testo=v);segBind('sAiuti',v=>st.aiuti=v==='1');segBind('sArr',v=>st.arrotVetro=v);
  $('sDitta').oninput=e=>{st.ditta=e.target.value;save()};$('sInd').oninput=e=>{st.indDitta=e.target.value;save()};$('sPiva').oninput=e=>{st.piva=e.target.value;save()};$('sCont').oninput=e=>{st.contatto=e.target.value;save()};$('sNote').oninput=e=>{st.noteOrdine=e.target.value;save()};
  bindTip(ctx);
  bindVetri(S,'catalogo','gv',renderSettings,null);
  bindFzTip('fin',fctx);bindFzTip('zan',fctx);
  $('bkBtn').onclick=()=>doBackup().then(ok=>{if(ok)renderSettings()});
  $('impAll').onchange=e=>readFile(e.target,restoreBackup);
  $('impC2').onchange=e=>readFile(e.target,o=>{const c=importCantiere(o.cantiere||o);if(c)go(c.id,'struttura')});
  armDelete('#wipeBtn',()=>{try{localStorage.removeItem(KEY)}catch(e){}S=fresh();save();applySettings();render();toast('Dati eliminati')});
  $('updBtn').onclick=()=>{toast('Controllo aggiornamenti…');const fine=()=>setTimeout(()=>location.reload(),800);
    if(!('serviceWorker' in navigator))return fine();
    navigator.serviceWorker.getRegistration().then(r=>r?r.update():null).catch(()=>{}).finally(fine)};
}

render();
paintStatus();
/* aggiornamenti: il service worker nuovo prende il controllo e la pagina si ricarica da sola */
function showUpd(fn){if($('upd'))return;const d=document.createElement('div');d.id='upd';d.className='upd';
  d.innerHTML='<span>Nuova versione pronta</span><button class="btn sm primary" type="button">Aggiorna</button>';d.querySelector('button').onclick=fn;document.body.appendChild(d)}
if('serviceWorker' in navigator){
  const hadCtrl=!!navigator.serviceWorker.controller;let reloading=false;
  const doReload=()=>{if(reloading)return;reloading=true;location.reload()};
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtrl)return;
    const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))showUpd(doReload);else doReload()});
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{})});
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})();
</script>
